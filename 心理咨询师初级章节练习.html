<script id="data" type="application/json">{"chapters":[{"n":"第一章 基础心理学","part":1},{"n":"第二章 人格心理学","part":1},{"n":"第三章 社会心理学","part":1},{"n":"第四章 发展心理学","part":1},{"n":"第五章 积极心理学","part":1},{"n":"第六章 健康心理学","part":1},{"n":"第七章 病理心理学","part":1},{"n":"第八章 心理测量学知识","part":1},{"n":"第九章 咨询心理学","part":1},{"n":"第十章 心理咨询伦理与相关法规","part":1},{"n":"第二部分 操作技能","part":2}],"qs":[{"id":"1-1","ch":0,"no":1,"t":"s","g":null,"stem":"基础心理学的研究内容，不包括以下哪一项？","o":[["A","心理现象发生发展的最一般规律"],["B","各种心理现象的生理机制"],["C","个体心理现象的具体表现和细节差异"],["D","心理与客观现实的关系"],["E","心理与行为的关系"]],"ans":"C","k":[2],"exp":"基础心理学研究的是心理学基本原理和心理现象的一般规律，选项A、B、D都是其涵盖的内容。而“个体心理现象的具体表现和细节差异”属于个性心理学或发展心理学等应用领域的研究范畴，不是基础心理学的核心研究内容。E选项属于基础心理学的研究内容，心理支配行为，行为表现心理。因此选C。","src":"基础心理学的研究内容，基础心理学→绪论，（熟悉）"},{"id":"1-2","ch":0,"no":2,"t":"s","g":null,"stem":"“仁者见仁，智者见智”这句俗语，从心理学的角度最恰当地说明了心理的哪种特性？","o":[["A","脑是心理的器官"],["B","心理是客观现实的反映"],["C","心理反映具有主观能动性"],["D","心理是在实践中发生发展的"],["E","心理具有社会历史性"]],"ans":"C","k":[2],"exp":"“仁者见仁，智者见智”意指不同的人对同一客观事物有不同的看法。这生动地体现了人对客观现实的反映不是被动的、镜子式的，而是受个人知识、经验、价值观影响，具有主观性和能动性。A选项强调心理的生理基础；B选项强调心理的源泉是客观现实；D选项强调心理的社会实践性；E选项强调心理受社会历史条件制约，均未紧扣“不同的人看法不同”这一核心。","src":"心理是对客观现实的反映，基础心理学→绪论，（掌握）"},{"id":"1-3","ch":0,"no":3,"t":"s","g":null,"stem":"在心理学史上，主张心理学应研究人们在适应环境过程中的心理机能，而非心理结构，这一观点属于哪个学派的核心理念？","o":[["A","构造主义"],["B","机能主义"],["C","行为主义"],["D","格式塔心理学"],["E","精神分析学派"]],"ans":"B","k":[1],"exp":"机能主义心理学受达尔文进化论影响，主张心理学的研究对象是具有适应性的心理活动，强调意识在适应环境中的功能和作用，而非像构造主义那样去分析意识的元素。A选项构造主义研究意识的结构；C选项行为主义研究可观察的行为；D选项格式塔心理学研究意识或知觉的整体性；E选项精神分析研究潜意识。","src":"学派纷争，基础心理学→绪论（了解）"},{"id":"1-4","ch":0,"no":4,"t":"c","g":null,"stem":"某心理学家想研究城市交通噪音对居民阅读效率的影响。他在实验室中模拟了不同强度的交通噪音，并测量了被试在标准化阅读测验上的得分。这种研究方法主要属于？","o":[["A","自然观察法"],["B","实验法"],["C","调查法"],["D","个案法"],["E","相关法"]],"ans":"B","k":[1],"exp":"研究者主动、系统地操纵了环境条件（交通噪音强度），并观察这一操作对被试行为（阅读测验得分）的影响，这完全符合实验法的核心特征。A选项是在自然情境下不干预地观察；C选项是通过问卷或访谈收集信息；D选项是对单个个体进行深入研究；E选项只能揭示变量间关系不能确定因果。","src":"研究心理现象的方法，基础心理学→绪论，（掌握）"},{"id":"1-5","ch":0,"no":5,"t":"m","g":null,"stem":"下列关于心理学主要流派的描述，正确的有？","o":[["A","精神分析学派强调潜意识对人的行为具有决定作用"],["B","行为主义学派主张心理学应该研究那些可以观察、测量和记录的行为"],["C","人本主义心理学认为研究动物行为的结果完全可以用来解释人类行为"],["D","认知心理学将人脑比作计算机，关注信息加工的过程"],["E","构造主义主张心理学应该研究意识的机能而非结构"]],"ans":"ABD","k":[0,1,3],"exp":"A选项正确，精神分析的核心就是探索潜意识。B选项正确，行为主义主张“心理学应该研究行为，而不是意识”。C选项错误，这正是人本主义所反对的观点，人本主义强调人的独特性和价值，反对将动物研究直接推广到人。D选项正确，这是认知心理学的核心隐喻。E选项错误，研究意识机能的是机能主义，构造主义研究意识的结构。","src":"心理学发展简史，基础心理学→绪论（了解）"},{"id":"1-6","ch":0,"no":6,"t":"s","g":null,"stem":"神经系统的基本结构和功能单位是？","o":[["A","神经胶质细胞"],["B","神经元"],["C","突触"],["D","细胞体"],["E","神经纤维"]],"ans":"B","k":[1],"exp":"神经元是神经系统的基本结构和功能单位，负责接收、整合和传递信息。A选项神经胶质细胞起支持、营养和保护作用，但不直接参与信息传递；C选项突触是神经元之间传递信息的结构；D选项细胞体是神经元的一部分，不是完整的单位；E选项神经纤维是由轴突和外包髓鞘组成，属于神经元的一部分。","src":"神经元及其功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-7","ch":0,"no":7,"t":"s","g":null,"stem":"神经元之间传递信息的结构是？","o":[["A","轴突"],["B","树突"],["C","突触"],["D","髓鞘"],["E","神经末梢"]],"ans":"C","k":[2],"exp":"突触是神经元之间或神经元与效应器之间传递信息的特殊结构。A选项轴突负责将神经冲动从细胞体传出；B选项树突负责接收来自其他神经元的信息；D选项髓鞘包裹在轴突外，起绝缘和加速传导的作用；E选项是神经元的末端，但不负责在神经元“之间”传递。","src":"神经元及其功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-8","ch":0,"no":8,"t":"s","g":null,"stem":"支配内脏器官、血管和腺体的神经系统是？","o":[["A","躯体神经系统"],["B","脊神经"],["C","自主神经系统"],["D","脑神经"],["E","感觉神经系统"]],"ans":"C","k":[2],"exp":"自主神经系统（又称植物神经系统）主要支配内脏器官、心血管和腺体的活动，不受意识直接控制。A选项躯体神经系统支配骨骼肌，受意识控制；B选项脊神经主要分布于躯干和四肢，包含感觉和运动纤维；D选项脑神经主要支配头面部；E选项属于传入神经，不负责支配。","src":"神经系统的构造及功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-9","ch":0,"no":9,"t":"s","g":null,"stem":"下列哪项不属于中枢神经系统的组成部分？","o":[["A","大脑"],["B","小脑"],["C","脊神经节"],["D","脑干"],["E","脊髓"]],"ans":"C","k":[2],"exp":"中枢神经系统包括脑（大脑、小脑、脑干等）和脊髓。A、B、D、E均属于中枢神经系统。C选项脊神经节属于外周神经系统，是脊神经上感觉神经元的胞体聚集处。","src":"中枢神经系统及其功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-10","ch":0,"no":10,"t":"s","g":null,"stem":"大脑皮层中，主要负责躯体感觉（如触觉、痛觉、温觉）的区域是？","o":[["A","额叶"],["B","顶叶"],["C","颞叶"],["D","枕叶"],["E","边缘叶"]],"ans":"B","k":[1],"exp":"顶叶位于中央沟之后，其前方的中央后回是躯体感觉中枢，负责接收和处理来自皮肤和肌肉的感觉信息。A选项额叶主要负责运动控制和高级认知功能；C选项颞叶主要负责听觉和记忆；D选项枕叶主要负责视觉；E选项边缘叶与情绪和记忆有关。","src":"大脑的结构与功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-11","ch":0,"no":11,"t":"s","g":null,"stem":"“裂脑人”研究表明，对于大多数右利手者，空间知觉和形象思维主要由哪个半球负责？","o":[["A","左半球"],["B","右半球"],["C","双侧半球协同"],["D","小脑"],["E","胼胝体"]],"ans":"B","k":[1],"exp":"裂脑人研究发现，左右半球功能存在不对称性。对于大多数右利手者，左半球主要负责言语、逻辑推理等；右半球主要负责空间知觉、形象思维、音乐感知等。小脑主要负责平衡和协调运动；肼胝体是连接两半球的纤维。","src":"大脑两半球功能的不对称性，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-12","ch":0,"no":12,"t":"s","g":null,"stem":"当人处于紧张、恐惧状态时，肾上腺分泌增加，这主要体现了？","o":[["A","内分泌对心理的影响"],["B","心理对内分泌的影响"],["C","＜p><span style=\"font-family：宋体；”＞内分泌与心理无关＜/span><\/p＞"],["D","遗传对内分泌的决定作用"],["E","环境对内分泌的直接作用"]],"ans":"B","k":[1],"exp":"紧张、恐惧等心理状态会通过神经系统促使肾上腺髓质分泌肾上腺素和去甲肾上腺素，使机体处于应激准备状态。这体现了心理活动对内分泌系统的调节作用。A选项指的是激素水平异常导致情绪或行为变化，与题干方向相反；C、D、E均与题干描述的机制不符。","src":"肾上腺，基础心理学→心理活动的生理基础，（熟悉）"},{"id":"1-13","ch":0,"no":13,"t":"s","g":null,"stem":"巴甫洛夫认为，高级神经活动的基本过程是？","o":[["A","扩散和集中"],["B","兴奋和抑制"],["C","相互诱导"],["D","动力定型"],["E","条件反射"]],"ans":"B","k":[1],"exp":"巴甫洛夫高级神经活动学说认为，神经活动的基本过程是兴奋和抑制。兴奋使神经细胞活动增强，抑制则使其活动减弱或停止。A选项扩散和集中是兴奋和抑制运动的规律；C选项相互诱导是兴奋和抑制相互影响的规律；D选项动力定型是条件反射系统化的表现；E选项是神经活动的基本方式。","src":"巴甫洛夫学说的几个基本概念，基础心理学→心理活动的生理基础，（熟悉）"},{"id":"1-14","ch":0,"no":14,"t":"c","g":null,"stem":"生活中，养成“饭前洗手”的习惯后，不洗手吃饭会觉得别扭。这种现象在巴甫洛夫理论中称为？","o":[["A","条件反射的泛化"],["B","条件反射的分化"],["C","动力定型"],["D","无条件反射"],["E","操作性条件反射"]],"ans":"C","k":[2],"exp":"动力定型是一系列条件反射按固定顺序和强度形成的系统。饭前洗手成为一个固定的行为模式后，整个行为链条自动执行，改变它会让人不适。A选项泛化是对相似刺激产生相同反应；B选项分化是对不同刺激做出不同反应；D选项无条件反射是先天本能行为；E选项是斯金纳提出的概念。","src":"巴甫洛夫发现的几个高级神经活动的基本规律，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-15","ch":0,"no":15,"t":"m","g":null,"stem":"神经元按照功能可以分为哪些类型？","o":[["A","感觉神经元"],["B","运动神经元"],["C","中间神经元"],["D","胶质细胞"],["E","自主神经元"]],"ans":"ABC","k":[0,1,2],"exp":"神经元按功能分为三类：A选项感觉神经元将信息从感受器传向中枢；B选项运动神经元将信息从中枢传向效应器；C选项中间神经元在感觉和运动神经元之间起联络作用。D选项胶质细胞不属于神经元；E选项不属于标准的神经元功能分类。","src":"神经元及其功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-16","ch":0,"no":16,"t":"m","g":null,"stem":"以下属于中枢神经系统的有？","o":[["A","大脑"],["B","脑干"],["C","脊髓"],["D","脊神经"],["E","脑神经"]],"ans":"ABC","k":[0,1,2],"exp":"中枢神经系统包括脑（大脑、小脑、脑干、间脑等）和脊髓。D选项脊神经和E选项脑神经均属于外周神经系统。","src":"中枢神经系统及其功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-17","ch":0,"no":17,"t":"m","g":null,"stem":"关于大脑皮层功能分区的说法，正确的有？","o":[["A","中央前回是躯体运动中枢"],["B","中央后回是躯体感觉中枢"],["C","枕叶是视觉中枢"],["D","颞叶是躯体感觉中枢"],["E","额叶是听觉中枢"]],"ans":"ABC","k":[0,1,2],"exp":"A正确，中央前回发出运动指令控制骨骼肌。B正确，中央后回接收皮肤和本体感觉信息。C正确，枕叶后部的距状裂周围是初级视觉皮层。D错误，颞叶是听觉中枢，躯体感觉中枢在顶叶中央后回。E错误，听觉中枢在颞叶。","src":"大脑的结构与功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-18","ch":0,"no":18,"t":"m","g":null,"stem":"与心理活动关系密切的内分泌腺包括？","o":[["A","甲状腺"],["B","肾上腺"],["C","垂体腺"],["D","胰腺"],["E","胸腺"]],"ans":"ABC","k":[0,1,2],"exp":"甲状腺（影响情绪和新陈代谢）、肾上腺（应激反应）、垂体腺（调节其他内分泌腺）均与心理活动密切相关。D选项胰腺主要调节血糖，虽与情绪有一定关联但不是通常讨论的主要内分泌腺；E选项胸腺主要与免疫有关。","src":"内分泌系统与心理，基础心理学→心理活动的生理基础，（熟悉）"},{"id":"1-19","ch":0,"no":19,"t":"m","g":null,"stem":"巴甫洛夫高级神经活动的基本规律包括？","o":[["A","兴奋和抑制的扩散与集中"],["B","相互诱导"],["C","动力定型"],["D","操作性条件反射"],["E","习惯化"]],"ans":"ABC","k":[0,1,2],"exp":"A、B、C均为巴甫洛夫提出的高级神经活动基本规律。D选项操作性条件反射是斯金纳提出的，属于操作性条件作用理论，与巴甫洛夫的经典条件反射不同；E选项习惯化是学习的一种基本形式，不属于巴甫洛夫的高级神经活动规律。","src":"巴甫洛夫发现的几个高级神经活动的基本规律，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-20","ch":0,"no":20,"t":"k","g":"1-0","stem":"从巴甫洛夫高级神经活动理论来看，小明运动技能的形成主要依靠？","o":[["A","无条件反射"],["B","条件反射的建立和动力定型的形成"],["C","兴奋的扩散"],["D","抑制的集中"],["E","操作性条件反射"],["F","试误学习"]],"ans":"B","k":[1],"exp":"运动技能的习得是通过反复练习建立一系列条件反射，并将它们按固定顺序整合成系统，即形成动力定型。A选项无条件反射是生来就有的，如眨眼反射；C、D选项是神经过程运动的基本规律，但未能概括技能形成的全过程；E选项是斯金纳的理论；F选项是桑代克的理论。","src":"巴甫洛夫高级神经活动理论，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-21","ch":0,"no":21,"t":"k","g":"1-0","stem":"小明养成饭前洗手习惯后，不洗手吃饭觉得别扭，这属于？","o":[["A","条件反射的泛化"],["B","条件反射的分化"],["C","动力定型"],["D","无条件反射"],["E","操作性条件反射"],["F","习惯化"]],"ans":"C","k":[2],"exp":"动力定型是一系列条件反射按固定顺序和强度形成的系统。饭前洗手成为一个固定的行为模式后，整个行为链条自动执行，改变它会让人不适。","src":"巴甫洛夫发现的几个高级神经活动的基本规律，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-22","ch":0,"no":22,"t":"k","g":"1-0","stem":"小明投篮动作变得“协调流畅”，除了大脑皮层运动区的支配外，主要依赖中枢神经系统中哪个结构来维持肌肉张力、协调随意运动？","o":[["A","脊髓"],["B","小脑"],["C","丘脑"],["D","下丘脑"],["E","脑干网状结构"],["F","边缘系统"]],"ans":"B","k":[1],"exp":"小脑的主要功能是维持身体平衡、调节肌肉紧张度和协调随意运动。投篮动作的协调流畅，除了大脑皮层发出运动指令外，必须有小脑的参与来修正和协调肌肉的活动。脊髓主要传导和完成简单反射，丘脑是感觉中继站，下丘脑调节内脏和内分泌，脑干网状结构维持觉醒，边缘系统与情绪记忆有关。","src":"中枢神经系统及其功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-23","ch":0,"no":23,"t":"k","g":"1-0","stem":"小明在练习投篮初期，经常做出多余的错误动作，随着练习，错误动作逐渐消失，正确动作得以保留。根据巴甫洛夫高级神经活动的基本规律，错误动作的消失主要是由于何种神经过程的作用？","o":[["A","兴奋的扩散"],["B","抑制的扩散"],["C","兴奋的集中"],["D","抑制的集中"],["E","正诱导"],["F","负诱导"]],"ans":"D","k":[3],"exp":"巴甫洛夫理论指出，兴奋和抑制过程都有集中和扩散的规律。练习初期，兴奋容易扩散，导致多余动作；随着练习，抑制过程逐渐发展并向特定的错误反应点集中，从而压制了错误动作，使动作精确化。这属于抑制的集中。","src":"巴甫洛夫发现的几个高级神经活动的基本规律，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-24","ch":0,"no":24,"t":"k","g":"1-0","stem":"小明在投篮时，手臂发力和手腕拨球的骨骼肌运动受哪种神经系统的支配？而在运动过程中，心跳加快、呼吸急促等内脏活动的变化主要受哪种神经系统的调节？","o":[["A","躯体神经系统；交感神经"],["B","自主神经系统；副交感神经"],["C","躯体神经系统；副交感神经"],["D","自主神经系统；交感神经"],["E","脊神经；脑神经"],["F","交感神经；副交感神经"]],"ans":"A","k":[0],"exp":"外周神经系统分为躯体神经和自主神经。躯体神经支配骨骼肌的随意运动（如投篮动\n作）；自主神经支配内脏器官的活动，其中交感神经在机体应付紧急情况（如运动、紧张）时兴奋，使心跳加快、血压升高，副交感神经则在安静状态下促进消化和储能。","src":"外周神经系统及其功能，基础心理学→心理活动的生理基础，（掌握）"},{"id":"1-25","ch":0,"no":25,"t":"s","g":null,"stem":"“入芝兰之室，久而不闻其香；入鲍鱼之肆，久而不闻其臭。”这种现象属于？","o":[["A","感觉后像"],["B","感觉对比"],["C","感觉适应"],["D","联觉"],["E","感觉补偿"]],"ans":"C","k":[2],"exp":"感觉适应是指刺激持续作用时，感受性发生变化的现象。嗅觉适应是典型的适应现象，长时间处于某种气味环境中，感受性下降，从而“不闻其香／臭”。A选项是刺激停止后感觉仍持续；B选项是不同刺激相互作用；D选项是一种感觉引起另一种感觉；E选项是某种感觉丧失后其他感觉代偿性增强。","src":"感觉适应，基础心理学→感觉、知觉，（掌握）"},{"id":"1-26","ch":0,"no":26,"t":"c","g":null,"stem":"同一块灰色纸片，放在白色背景上显得暗，放在黑色背景上显得亮。这种现象是？","o":[["A","感觉适应"],["B","感觉对比"],["C","感觉后像"],["D","视觉恒常性"],["E","联觉"]],"ans":"B","k":[1],"exp":"感觉对比是指不同刺激同时或先后作用时，感受性发生变化的现象。灰色纸片在不同背景上的明暗差异是同时对比的结果。","src":"感觉对比，基础心理学→感觉、知觉，（掌握）"},{"id":"1-27","ch":0,"no":27,"t":"c","g":null,"stem":"把一张报纸放在面前，我们知觉到它是一个整体，而不是许多铅字的集合。这体现了知觉的？","o":[["A","选择性"],["B","整体性"],["C","理解性"],["D","恒常性"],["E","适应性"]],"ans":"B","k":[1],"exp":"知觉的整体性是指知觉对象由不同部分和属性组成，但人倾向于将其知觉为一个统一的整体。报纸上的铅字是部分，我们知觉为“报纸”这个整体。","src":"知觉的基本特性，基础心理学→感觉、知觉，（掌握）"},{"id":"1-28","ch":0,"no":28,"t":"c","g":null,"stem":"在嘈杂的聚会上，我们能够专注于与一个人的交谈，同时忽略周围的噪音。这主要体现了知觉的？","o":[["A","整体性"],["B","选择性"],["C","恒常性"],["D","理解性"],["E","适应性"]],"ans":"B","k":[1],"exp":"知觉的选择性是指人总是有选择地将少数事物作为知觉对象，其他事物作为背景。在嘈杂环境中专注于某人的谈话，是典型的对象与背景的分离。","src":"知觉的基本特性，基础心理学→感觉、知觉，（掌握）"},{"id":"1-29","ch":0,"no":29,"t":"s","g":null,"stem":"“月明星稀”现象中，月亮看起来特别明亮，星星看起来暗淡。这可以用知觉的哪种特性解释？","o":[["A","选择性"],["B","整体性"],["C","恒常性"],["D","理解性"],["E","适应性"]],"ans":"A","k":[0],"exp":"月亮成为知觉对象，星星成为背景，对象与背景的对比度差异使得月亮更突出。这体现了知觉的选择性。","src":"知觉的基本特性，基础心理学→感觉、知觉，（掌握）"},{"id":"1-30","ch":0,"no":30,"t":"c","g":null,"stem":"当我们从远处走向一个熟悉的人，他在我们视网膜上的成像越来越大，但我们知觉到的他的身高没有变化。这是？","o":[["A","形状恒常性"],["B","大小恒常性"],["C","明度恒常性"],["D","颜色恒常性"],["E","方向恒常性"]],"ans":"B","k":[1],"exp":"大小恒常性是指物体在视网膜上成像大小随距离变化，但知觉到的实际大小保持相对不变。","src":"知觉的基本特性，基础心理学→感觉、知觉，（掌握）"},{"id":"1-31","ch":0,"no":31,"t":"s","g":null,"stem":"在视崖实验中，6个月以上的婴儿会拒绝爬过“悬崖”一侧。这说明婴儿已经具备了？","o":[["A","形状知觉"],["B","深度知觉"],["C","方位知觉"],["D","时间知觉"],["E","运动知觉"]],"ans":"B","k":[1],"exp":"视崖实验用于测试深度知觉。婴儿拒绝爬过看似有落差的玻璃板，表明他们能够知觉深度。","src":"空间知觉，基础心理学→感觉、知觉，（熟悉）"},{"id":"1-32","ch":0,"no":32,"t":"c","g":null,"stem":"看一个静止的亮点，在黑暗环境中注视片刻后会觉得亮点在移动。这是？","o":[["A","真动知觉"],["B","诱发运动"],["C","自主运动"],["D","运动后效"],["E","动景运动"]],"ans":"C","k":[2],"exp":"自主运动是指在暗室中注视一个静止光点，会感觉它在运动的现象。这是由于缺乏参照系时，眼球的不随意运动被错误地归因为光点的移动。A选项是物体真实运动的知觉；B选项是一个物体运动诱发静止物体运动；D选项是注视运动物体后看静止物体感觉在动；E选项是静止刺激连续呈现产生运动感。","src":"运动知觉，基础心理学→感觉、知觉，（熟悉）"},{"id":"1-33","ch":0,"no":33,"t":"c","g":null,"stem":"当我们从桥上看桥下的流水，感觉桥在向后运动。这属于？","o":[["A","真动知觉"],["B","诱发运动"],["C","运动后效"],["D","似动运动"],["E","自主运动"]],"ans":"B","k":[1],"exp":"诱发运动是指由于一个物体的运动使其相邻的静止物体产生运动知觉的现象。流水（运动）诱发桥（静止）产生向后运动的错觉。C选项通常发生在注视运动物体之后。","src":"运动知觉，基础心理学→感觉、知觉，（熟悉）"},{"id":"1-34","ch":0,"no":34,"t":"m","g":null,"stem":"关于感受性与感觉阈限的关系，说法正确的有？","o":[["A","感受性越高，感觉阈限越低"],["B","感受性越低，感觉阈限越高"],["C","感受性与感觉阈限成正比"],["D","感受性与感觉阈限成反比"],["E","感受性与感觉阈限无关"]],"ans":"ABD","k":[0,1,3],"exp":"感受性和感觉阈限是同一问题的两个方面，成反比关系。感受性越高，能觉察的刺激量越小（阈限越低）；感受性越低，需要的刺激量越大（阈限越高）C选项“成正比”错误；E选项错误。","src":"感受性与感觉阈限，基础心理学→感觉、知觉，（掌握）"},{"id":"1-35","ch":0,"no":35,"t":"m","g":null,"stem":"以下属于外部感觉的有？","o":[["A","视觉"],["B","听觉"],["C","平衡觉"],["D","内脏感觉"],["E","嗅觉"]],"ans":"ABE","k":[0,1,4],"exp":"外部感觉接受外部环境刺激，包括视觉、听觉、嗅觉、味觉、皮肤感觉。平衡觉和内脏感觉属于内部感觉。","src":"感觉的种类，基础心理学→感觉、知觉，（掌握）"},{"id":"1-36","ch":0,"no":36,"t":"m","g":null,"stem":"以下关于暗适应和明适应的说法，正确的有？","o":[["A","暗适应是从亮处到暗处，感受性逐渐提高的过程"],["B","明适应是从暗处到亮处，感受性逐渐降低的过程"],["C","暗适应的完成时间通常比明适应更长"],["D","暗适应主要依赖视锥细胞，明适应主要依赖视杆细胞"],["E","暗适应初期感受性提高较快，后期较慢"]],"ans":"ABC","k":[0,1,2],"exp":"A、B、C均正确。D错误：暗适应主要依赖视杆细胞（感受暗光），明适应主要依赖视锥细胞（感受强光和颜色）E错误：暗适应初期提高较慢（视锥细胞适应），后期较快（视杆细胞适应）","src":"感觉适应，基础心理学→感觉、知觉，（掌握）"},{"id":"1-37","ch":0,"no":37,"t":"m","g":null,"stem":"知觉恒常性包括？","o":[["A","大小恒常性"],["B","形状恒常性"],["C","颜色恒常性"],["D","时间恒常性"],["E","明度恒常性"]],"ans":"ABCE","k":[0,1,2,4],"exp":"知觉恒常性包括大小恒常性、形状恒常性、明度恒常性、颜色恒常性等。D选项“时间恒常性”不属于知觉恒常性范畴。","src":"知觉的基本特性，基础心理学→感觉、知觉，（掌握）"},{"id":"1-38","ch":0,"no":38,"t":"m","g":null,"stem":"以下属于似动现象的有？","o":[["A","电影"],["B","霓虹灯广告的流动效果"],["C","月亮在云后移动"],["D","原地旋转后看静止物体感觉旋转"],["E","动景运动"]],"ans":"ABCE","k":[0,1,2,4],"exp":"似动是指在一定条件下，静止物体被知觉为运动。A选项电影是动景运动；B选项是动景运动；C选项是诱发运动；E选项动景运动本身就是似动。D选项是运动后效，属于运动错觉但不是似动。","src":"运动知觉，基础心理学→感觉、知觉，（熟悉）"},{"id":"1-39","ch":0,"no":39,"t":"s","g":null,"stem":"记忆的初级加工阶段，信息保持时间极短（约0.25-2秒）的记忆是？","o":[["A","瞬时记忆"],["B","短时记忆"],["C","长时记忆"],["D","工作记忆"],["E","情景记忆"]],"ans":"A","k":[0],"exp":"瞬时记忆（感觉记忆）保持时间极短，图像记忆约0.25-1秒，声像记忆约2-4秒。B选项短时记忆保持约20秒到1分钟；C选项长时记忆保持1分钟以上到终生；D选项是短时记忆的一种特殊形式；E选项是长时记忆按内容分类的一种。","src":"记忆的种类，基础心理学→记忆，（熟悉）"},{"id":"1-40","ch":0,"no":40,"t":"c","g":null,"stem":"学生在课堂上边听课边记笔记，主要依赖于哪种记忆？","o":[["A","瞬时记忆"],["B","短时记忆"],["C","长时记忆"],["D","感觉记忆"],["E","语义记忆"]],"ans":"B","k":[1],"exp":"短时记忆负责暂时存储和加工当前信息，持续约20秒左右，容量为7±2组块。边听课边记笔记需要短时记忆的参与。","src":"记忆的种类，基础心理学→记忆，（熟悉）"},{"id":"1-41","ch":0,"no":41,"t":"c","g":null,"stem":"在考试中，能够从多个选项中选出正确答案，这属于记忆过程中的？","o":[["A","识记"],["B","保持"],["C","回忆"],["D","再认"],["E","重现"]],"ans":"D","k":[3],"exp":"再认是当曾经感知过的事物再次出现时能够辨认出来。选择题属于再认，填空题和简答题属于回忆（重现）","src":"记忆过程，基础心理学→记忆，（熟悉）"},{"id":"1-42","ch":0,"no":42,"t":"c","g":null,"stem":"当我们回忆某件事时，会根据已有经验对缺失的信息进行填补，可能导致记忆失真。这反映了？","o":[["A","记忆的精确性"],["B","记忆的建构性"],["C","记忆的容量有限"],["D","记忆的系列位置效应"],["E","记忆的衰退"]],"ans":"B","k":[1],"exp":"记忆不是完全复制，而是建构性的，人在回忆时会用已有知识经验填补空白，可能导致错误记忆。","src":"记忆及记忆过程，基础心理学→记忆，（掌握）"},{"id":"1-43","ch":0,"no":43,"t":"s","g":null,"stem":"艾宾浩斯遗忘曲线表明，遗忘的进程是？","o":[["A","匀速的"],["B","先慢后快"],["C","先快后慢"],["D","无规律可循"],["E","波动式前进"]],"ans":"C","k":[2],"exp":"艾宾浩斯遗忘曲线显示，遗忘在识记后最初阶段最快，之后逐渐减慢，最后趋于稳定，即“先快后慢”。","src":"遗忘及遗忘规律，基础心理学→记忆，（掌握）"},{"id":"1-44","ch":0,"no":44,"t":"s","g":null,"stem":"学习一篇材料，开头和结尾部分回忆效果好，中间部分回忆效果差。这称为？","o":[["A","首因效应"],["B","近因效应"],["C","系列位置效应"],["D","蔡格尼克效应"],["E","晕轮效应"]],"ans":"C","k":[2],"exp":"系列位置效应是指材料中不同位置的内容记忆效果不同，开头（首因效应）和结尾（近因效应）好，中间差。A、B是系列位置效应的组成部分；D是指未完成的工作记忆更好；E是社会知觉中的偏差。","src":"系列位置效应，基础心理学→记忆，（掌握）"},{"id":"1-45","ch":0,"no":45,"t":"s","g":null,"stem":"先学习的材料对后学习的材料产生干扰，这称为？","o":[["A","倒摄抑制"],["B","前摄抑制"],["C","记忆重构"],["D","动机性遗忘"],["E","衰退抑制"]],"ans":"B","k":[1],"exp":"前摄抑制是先前学习的内容干扰后继学习。倒摄抑制是后继学习干扰先前内容。C、D、E 均不属于干扰说的范畴。","src":"遗忘的原因及系列位置效应，基础心理学→记忆，（掌握）"},{"id":"1-46","ch":0,"no":46,"t":"m","g":null,"stem":"关于短时记忆的特点，说法正确的有？","o":[["A","保持时间约20秒以内"],["B","容量约为7±2个组块"],["C","编码方式以听觉编码为主"],["D","信息不经复述会迅速遗忘"],["E","容量基本没有限制"]],"ans":"ABCD","k":[0,1,2,3],"exp":"短时记忆的四个特点均正确。保持时间短，容量有限，主要进行听觉编码（也有视觉编码），需要复述才能进入长时记忆。E选项属于长时记忆的特点。","src":"记忆及记忆过程，基础心理学一记忆，（熟悉）"},{"id":"1-47","ch":0,"no":47,"t":"m","g":null,"stem":"有助于提高记忆效果的策略包括？","o":[["A","组织复述"],["B","分散复习"],["C","过度学习"],["D","死记硬背"],["E","整体与部分结合复习"]],"ans":"ABCE","k":[0,1,2,4],"exp":"精细复述、分散复习、适当过度学习、整体与部分结合均能提高记忆效果。死记硬背属于机械复述，效果较差。","src":"记忆及记忆过程，基础心理学→记忆（熟悉）"},{"id":"1-48","ch":0,"no":48,"t":"m","g":null,"stem":"以下属于影响遗忘的因素有？","o":[["A","时间"],["B","材料的性质和意义"],["C","学习者的动机和情绪"],["D","系列位置"],["E","学习程度"]],"ans":"ABCDE","k":[0,1,2,3,4],"exp":"影响遗忘的因素包括时间、材料的意义性、学习程度、系列位置、学习者的态度和情绪等，均为正确选项。","src":"遗忘及遗忘规律，基础心理学→记忆，（掌握）"},{"id":"1-49","ch":0,"no":49,"t":"m","g":null,"stem":"艾宾浩斯在记忆研究中使用的材料和方法包括？","o":[["A","无意义音节"],["B","节省法（再学法）"],["C","有意义的诗歌"],["D","自我实验"],["E","脑成像技术"]],"ans":"ABD","k":[0,1,3],"exp":"艾宾浩斯使用无意义音节作为实验材料，用节省法计算记忆保持量，并以自己为被试进行实验。C选项不是他常用的材料；E选项当时尚未发明。","src":"遗忘及遗忘规律，基础心理学→记忆，（掌握）"},{"id":"1-50","ch":0,"no":50,"t":"c","g":null,"stem":"医生通过观察患者的症状和化验结果，推断出内部器官的病变。这体现了思维的？","o":[["A","概括性"],["B","间接性"],["C","形象性"],["D","直觉性"],["E","发散性"]],"ans":"B","k":[1],"exp":"思维的间接性是指借助已有知识经验，通过推理认识不能直接感知的事物。医生根据症状推断内部病变正是间接性的体现。A选项概括性是抽取共同本质属性；C选项是表象的特征；\nD选项是无逻辑的直接判断；E选项是多向寻找答案。","src":"思维概述，基础心理学→思维、言语与想象，（掌握）"},{"id":"1-51","ch":0,"no":51,"t":"s","g":null,"stem":"“笔”这个概念，无论是毛笔、铅笔还是钢笔，都称为笔。这反映了思维的？","o":[["A","间接性"],["B","概括性"],["C","发散性"],["D","迁移性"],["E","抽象性"]],"ans":"B","k":[1],"exp":"思维的概括性是指抽取同类事物的共同本质属性，形成概念。各种笔的共同本质是“书写工具”，这是概括的结果。","src":"思维概述，基础心理学→思维、言语与想象，（掌握）"},{"id":"1-52","ch":0,"no":52,"t":"s","g":null,"stem":"在头脑中把事物整体分解为各个部分、方面或属性，这称为？","o":[["A","分析"],["B","综合"],["C","抽象"],["D","比较"],["E","概括"]],"ans":"A","k":[0],"exp":"分析是将整体分解为部分；综合是将部分组合成整体；抽象是抽出本质属性舍弃非本质属性；比较是确定事物异同；概括是把本质属性推广到同类事物。","src":"思维概述，基础心理学→思维、言语与想象，（熟悉）"},{"id":"1-53","ch":0,"no":53,"t":"c","g":null,"stem":"建筑师在头脑中构思一栋大楼的形象，这属于？","o":[["A","动作思维"],["B","形象思维"],["C","抽象思维"],["D","发散思维"],["E","直觉思维"]],"ans":"B","k":[1],"exp":"形象思维是借助具体形象进行的思维，建筑师构思大楼形象属于典型形象思维。A选项依赖实际动作；C选项依赖概念和理论；D选项是多向思维；E选项是直接领悟。","src":"思维的种类，基础心理学→思维、言语与想象，（熟悉）"},{"id":"1-54","ch":0,"no":54,"t":"c","g":null,"stem":"物理学家用公式和定理推导电磁场的变化规律，这属于？","o":[["A","动作思维"],["B","形象思维"],["C","抽象逻辑思维"],["D","直觉思维"],["E","辐合思维"]],"ans":"C","k":[2],"exp":"抽象逻辑思维是以概念、判断、推理为形式的思维，公式推导是典型代表。","src":"思维的种类，基础心理学→思维、言语与想象，（熟悉）"},{"id":"1-55","ch":0,"no":55,"t":"s","g":null,"stem":"“一题多解”和“一事多写”主要体现了哪种思维？","o":[["A","辐合思维"],["B","发散思维"],["C","常规思维"],["D","逻辑思维"],["E","直觉思维"]],"ans":"B","k":[1],"exp":"发散思维是从不同角度、不同方向寻找多种答案的思维方式。一题多解是发散思维的典型表现。A选项是向单一方向聚集；C选项是按现成方案解决；D选项是严格遵循逻辑规则；E 选项是迅速领悟。","src":"思维的种类，基础心理学→思维、言语与想象，（熟悉）"},{"id":"1-56","ch":0,"no":56,"t":"s","g":null,"stem":"个体运用言语进行交际的过程称为？","o":[["A","语言"],["B","言语"],["C","思维"],["D","符号"],["E","沟通"]],"ans":"B","k":[1],"exp":"语言是符号系统，言语是运用语言进行交际的心理过程。","src":"思维、言语及想象，基础心理学→思维、言语与想象，（熟悉）"},{"id":"1-57","ch":0,"no":57,"t":"s","g":null,"stem":"自言自语、默默思考时使用的语言形式是？","o":[["A","外部言语"],["B","内部言语"],["C","口头言语"],["D","书面言语"],["E","对话言语"]],"ans":"B","k":[1],"exp":"内部言语是用于自我思考的、不出声的、简略的言语形式。A、C、D均属于外部言语；E 是口头言语的一种。","src":"言语活动的形式，基础心理学→思维、言语与想象，（熟悉）"},{"id":"1-58","ch":0,"no":58,"t":"s","g":null,"stem":"人在阅读时，看到“苹果”两个字，脑海中浮现出苹果的形象。这属于？","o":[["A","无意想象"],["B","再造想象"],["C","创造想象"],["D","幻想"],["E","理想"]],"ans":"B","k":[1],"exp":"再造想象是根据语言描述或图样示意，在头脑中形成相应形象的过程。看到文字描述形成形象是再造想象。A选项是没有预定目的的想象；C选项是独立创造新形象；D选项是指向未来的想象；E选项是积极的幻想。","src":"想象的种类，基础心理学→思维、言语与想象，（熟悉）"},{"id":"1-59","ch":0,"no":59,"t":"c","g":null,"stem":"作家创作小说中的新人物形象，主要依靠？","o":[["A","再造想象"],["B","创造想象"],["C","无意想象"],["D","记忆表象"],["E","幻想"]],"ans":"B","k":[1],"exp":"创造想象是不依据现成描述而独立创造出新形象的过程。文学创作是创造想象的典型。","src":"想象的种类，基础心理学→思维、言语及想象，（熟悉）"},{"id":"1-60","ch":0,"no":60,"t":"m","g":null,"stem":"思维的特征包括？","o":[["A","间接性"],["B","概括性"],["C","形象性"],["D","逻辑性"],["E","问题性"]],"ans":"AB","k":[0,1],"exp":"思维的两个基本特征是间接性和概括性。C选项形象性是表象的特征；D、E选项不是思维的基本特征。","src":"思维的定义和特征，基础心理学→思维、言语及想象，（掌握）"},{"id":"1-61","ch":0,"no":61,"t":"m","g":null,"stem":"关于概念形成的过程，正确的说法有？","o":[["A","概念形成是从具体到抽象的过程"],["B","儿童掌握概念通常先掌握具体概念，后掌握抽象概念"],["C","概念的形成需要提供正例和反例"],["D","概念一旦形成就不会变化"],["E","概念形成受语言发展的影响"]],"ans":"ABCE","k":[0,1,2,4],"exp":"A、B、C、E均正确。D错误，概念随着知识经验的丰富可以不断深化和发展。","src":"概念形成，基础心理学→思维、言语及想象，（掌握）"},{"id":"1-62","ch":0,"no":62,"t":"m","g":null,"stem":"问题解决过程中常采用的策略有？","o":[["A","算法式"],["B","启发式"],["C","试误法"],["D","机械复述"],["E","手段-目的分析"]],"ans":"ABCE","k":[0,1,2,4],"exp":"问题解决策略主要包括算法式和启发式。试误法和手段-目的分析属于启发式策略。机械复述是记忆策略，与问题解决无直接关系。","src":"问题解决及对问题解决的研究，基础心理学→思维、言语及想象，（掌握）"},{"id":"1-63","ch":0,"no":63,"t":"m","g":null,"stem":"言语活动中枢机制包括的脑区有？","o":[["A","布洛卡区"],["B","威尔尼克区"],["C","角回"],["D","海马"],["E","杏仁核"]],"ans":"ABC","k":[0,1,2],"exp":"言语中枢包括布洛卡区（运动性言语中枢）、威尔尼克区（听觉性言语中枢）和角回（视觉性言语中枢）海马与记忆有关，杏仁核与情绪有关。","src":"言语活动的中枢机制，基础心理学一思维、言语及想象，（熟悉）"},{"id":"1-64","ch":0,"no":64,"t":"m","g":null,"stem":"想象的功能包括？","o":[["A","预见功能"],["B","补充功能"],["C","替代功能"],["D","调节功能"],["E","创造功能"]],"ans":"ABCD","k":[0,1,2,3],"exp":"想象具有预见（预测未来）、补充（弥补认知空白）、替代（满足未实现的需要）和调节（调节生理心理状态）等功能。创造功能是创造想象的具体作用，不属于心理学划分的基本功能类别。","src":"表象和想象的定义，基础心理学→思维、言语及想象，（掌握）"},{"id":"1-65","ch":0,"no":65,"t":"s","g":null,"stem":"人的意识的最基本特征是？","o":[["A","觉知性"],["B","能动性"],["C","目的性"],["D","社会性"],["E","主动性"]],"ans":"A","k":[0],"exp":"意识的核心特征是觉知性，即对自身和外界事物的清晰觉察。B、C、D、E虽然是意识的特征，但不是最基本特征。","src":"意识特征，基础心理学→意识与注意，（掌握）"},{"id":"1-66","ch":0,"no":66,"t":"c","g":null,"stem":"上课时，窗外突然飞进一只小鸟，学生们不由自主地去看。这属于？","o":[["A","有意注意"],["B","无意注意"],["C","有意后注意"],["D","注意分配"],["E","注意转移"]],"ans":"B","k":[1],"exp":"无意注意是没有预定目的、不需意志努力的注意。突发事件引起的注意是无意注意。","src":"注意的种类，基础心理学→意识与注意，（掌握）"},{"id":"1-67","ch":0,"no":67,"t":"c","g":null,"stem":"熟练的司机可以一边开车一边与乘客聊天，这时的注意状态主要是？","o":[["A","无意注意"],["B","有意注意"],["C","有意后注意"],["D","注意分散"],["E","注意转移"]],"ans":"C","k":[2],"exp":"有意后注意是有预定目的但不需要意志努力的注意，是技能熟练后的自动化状态。","src":"注意的种类，基础心理学→意识与注意，（掌握）"},{"id":"1-68","ch":0,"no":68,"t":"s","g":null,"stem":"一个人同时关注多个刺激的数量，称为？","o":[["A","注意稳定性"],["B","注意广度"],["C","注意分配"],["D","注意转移"],["E","注意动摇"]],"ans":"B","k":[1],"exp":"注意广度（注意范围）是指同一时间内能清楚把握对象的数量。","src":"注意广度，基础心理学→意识与注意，（熟悉）"},{"id":"1-69","ch":0,"no":69,"t":"c","g":null,"stem":"学生在课堂上认真听讲，思想不溜号。这体现了注意的什么品质？","o":[["A","注意广度"],["B","注意稳定性"],["C","注意分配"],["D","注意转移"],["E","注意分散"]],"ans":"B","k":[1],"exp":"注意稳定性是指注意长时间保持在某一对象上的特性。认真听讲是稳定性好的表现。A 选项是数量特征；C选项是同时关注多件事；D选项是主动转换；E选项是稳定性差的表现。","src":"注意的稳定性，基础心理学→意识与注意，（熟悉）"},{"id":"1-70","ch":0,"no":70,"t":"c","g":null,"stem":"学生上完语文课后，主动将注意转向数学课准备。这是？","o":[["A","注意分散"],["B","注意转移"],["C","注意分配"],["D","注意广度"],["E","注意稳定性"]],"ans":"B","k":[1],"exp":"注意转移是根据任务要求主动将注意从一个对象转向另一个对象。课间转换科目是主动转移。A选项是被动的、无意的。","src":"注意转移，基础心理学→意识与注意，（熟悉）"},{"id":"1-71","ch":0,"no":71,"t":"s","g":null,"stem":"“眼观六路，耳听八方”主要形容注意的什么品质？","o":[["A","注意广度"],["B","注意稳定性"],["C","注意分配"],["D","注意转移"],["E","注意动摇"]],"ans":"C","k":[2],"exp":"注意分配是指同一时间内将注意指向不同对象、从事多种活动。眼观六路、耳听八方是同时关注多个信息，属于分配。","src":"注意分配，基础心理学→意识与注意，（熟悉）"},{"id":"1-72","ch":0,"no":72,"t":"m","g":null,"stem":"以下属于无意识现象的有？","o":[["A","盲视"],["B","舌尖现象"],["C","自动化行为"],["D","对周围环境的清晰觉察"],["E","梦游"]],"ans":"ABCE","k":[0,1,2,4],"exp":"无意识包括对刺激的无意识（如盲视）、记忆的无意识（如舌尖现象）、无意识行为（如自动化、梦游）D选项是意识内容。","src":"无意识，基础心理学→意识与注意，（掌握）"},{"id":"1-73","ch":0,"no":73,"t":"m","g":null,"stem":"意识的状态包括？","o":[["A","清醒状态"],["B","睡眠"],["C","梦"],["D","无意识"],["E","催眠状态"]],"ans":"ABCDE","k":[0,1,2,3,4],"exp":"意识状态包括清醒、睡眠、梦、催眠以及各种改变的意识状态，也包括无意识心理活动。","src":"几种不同的意识状态，基础心理学→意识与注意，（熟悉）"},{"id":"1-74","ch":0,"no":74,"t":"m","g":null,"stem":"关于睡眠的说法正确的有？","o":[["A","睡眠分为非快速眼动睡眠和快速眼动睡眠"],["B","人一夜的睡眠中，REM睡眠时间逐渐增长"],["C","慢波睡眠阶段通常不会做梦"],["D","梦只发生在REM睡眠阶段"],["E","睡眠是大脑完全休息的状态"]],"ans":"ABC","k":[0,1,2],"exp":"D错误，梦也可发生在非快速眼动睡眠，但REM期梦更生动、情节性更强。E错误，睡眠中大脑仍有活跃活动。","src":"几种不同的意识状态，基础心理学→意识与注意，（熟悉）"},{"id":"1-75","ch":0,"no":75,"t":"m","g":null,"stem":"注意的品质包括？","o":[["A","广度"],["B","稳定性"],["C","分配"],["D","转移"],["E","集中性"]],"ans":"ABCD","k":[0,1,2,3],"exp":"四个维度均为注意的品质特征。E选项集中性是注意的基本特征之一，但通常不与广度、稳定性等并列为四大品质。","src":"注意的特征，基础心理学→意识与注意，（熟悉）"},{"id":"1-76","ch":0,"no":76,"t":"m","g":null,"stem":"影响注意广度的因素有？","o":[["A","知觉对象的特点"],["B","活动的任务要求"],["C","个体的知识经验"],["D","注意的稳定性"],["E","神经过程的灵活性"]],"ans":"ABC","k":[0,1,2],"exp":"注意广度受对象特征（如排列是否规律）、任务要求（如是否需要精确识别）和个体经验影响。D选项注意稳定性与广度是不同的品质；E选项影响的是注意转移。","src":"注意广度，基础心理学→意识与注意，（熟悉）"},{"id":"1-77","ch":0,"no":77,"t":"s","g":null,"stem":"需要产生的根本条件是？","o":[["A","个体缺乏某种东西"],["B","个体体验到生理或心理上的不平衡"],["C","个体的社会要求"],["D","外部的刺激"],["E","个体的遗传本能"]],"ans":"B","k":[1],"exp":"需要是有机体内部的不平衡状态，包括生理不平衡和心理不平衡。A选项是表面现象，B 选项是心理学本质定义。","src":"需要，基础心理学→需要与动机，（掌握）"},{"id":"1-78","ch":0,"no":78,"t":"s","g":null,"stem":"由外部奖励或惩罚引起的动机称为？","o":[["A","内在动机"],["B","外在动机"],["C","生理性动机"],["D","社会性动机"],["E","成就动机"]],"ans":"B","k":[1],"exp":"外在动机是在外部环境影响下产生的动机，如为了获得奖励或避免惩罚。A选项出于内部兴趣；C选项基于生理需要；D、E选项属于社会性动机范畴。","src":"动机，基础心理学→需要与动机，（掌握）"},{"id":"1-79","ch":0,"no":79,"t":"s","g":null,"stem":"“耶克斯-多德森定律”表明？","o":[["A","动机越强，工作效率越高"],["B","动机越弱，工作效率越高"],["C","动机强度与工作效率呈倒U型曲线关系"],["D","动机强度与工作效率无关"],["E","动机强度与工作效率呈正比关系"]],"ans":"C","k":[2],"exp":"耶克斯-多德森定律指出，动机过强或过弱都不利于工作效率，中等强度动机效率最高，呈倒U型曲线。","src":"动机，基础心理学→需要与动机，（掌握）"},{"id":"1-80","ch":0,"no":80,"t":"s","g":null,"stem":"根据耶克斯-多德森定律，对于难度较大的任务，最佳的动机水平应该？","o":[["A","偏高"],["B","中等"],["C","偏低"],["D","极高"],["E","为零"]],"ans":"C","k":[2],"exp":"任务难度越大，最佳动机水平越低；简单任务最佳动机水平较高。","src":"动机，基础心理学→需要与动机，（掌握）"},{"id":"1-81","ch":0,"no":81,"t":"s","g":null,"stem":"“归属与爱的需要”属于马斯洛需要层次理论中的？","o":[["A","生理需要"],["B","安全需要"],["C","缺失性需要"],["D","成长性需要"],["E","自我实现需要"]],"ans":"C","k":[2],"exp":"归属与爱的需要属于缺失性需要（基本需要），在安全需要之后、尊重需要之前。D选项包括认知、审美和自我实现需要。","src":"需要的层次，基础心理学→需要与动机，（掌握）"},{"id":"1-82","ch":0,"no":82,"t":"s","g":null,"stem":"马斯洛认为，最高层次的需要是？","o":[["A","尊重需要"],["B","审美需要"],["C","自我实现需要"],["D","认知需要"],["E","超越自我需要"]],"ans":"C","k":[2],"exp":"马斯洛最初提出五层次模型，最高为自我实现需要；后来加入认知和审美，但自我实现仍为最高。","src":"需要的层次，基础心理学→需要与动机，（掌握）"},{"id":"1-83","ch":0,"no":83,"t":"m","g":null,"stem":"动机具有的功能包括？","o":[["A","激活功能"],["B","指向功能"],["C","调节功能"],["D","维持功能"],["E","强化功能"]],"ans":"ABCD","k":[0,1,2,3],"exp":"动机能激发行为（激活）、引导行为朝向目标（指向）、调节行为的强度和持续时间（调节和维持）E选项不属于动机的基本功能分类。","src":"动机，基础心理学→需要与动机，（掌握）"},{"id":"1-84","ch":0,"no":84,"t":"m","g":null,"stem":"关于内在动机和外在动机的关系，正确的说法有？","o":[["A","两者可以相互转化"],["B","过度使用外部奖励可能削弱内在动机"],["C","内在动机通常比外在动机更持久"],["D","外在动机总是有害的"],["E","外在动机对行为没有推动作用"]],"ans":"ABC","k":[0,1,2],"exp":"D错误，外在动机在适当条件下也是有益的，过度依赖才会损害内在动机。E错误，外在动机能有效推动行为。","src":"动机，基础心理学→需要与动机，（掌握）"},{"id":"1-85","ch":0,"no":85,"t":"m","g":null,"stem":"社会性动机包括？","o":[["A","饥饿动机"],["B","成就动机"],["C","权力动机"],["D","交往动机"],["E","口渴动机"]],"ans":"BCD","k":[1,2,3],"exp":"社会性动机是后天习得的，包括成就、权力、交往、归属等。饥饿和口渴动机是生理性动机。","src":"动机的种类，基础心理学→需要与动机，（掌握）"},{"id":"1-86","ch":0,"no":86,"t":"m","g":null,"stem":"动机冲突的类型包括？","o":[["A","双趋冲突"],["B","双避冲突"],["C","趋避冲突"],["D","双重趋避冲突"],["E","多重趋避冲突"]],"ans":"ABCD","k":[0,1,2,3],"exp":"四种基本动机冲突类型均正确。E选项在某些教材中作为D选项的延伸，但核心分类为前四种。","src":"动机冲突的类型，基础心理学→需要与动机，（掌握）"},{"id":"1-87","ch":0,"no":87,"t":"m","g":null,"stem":"马斯洛需要层次理论中，属于基本需要（缺失性需要）的有？","o":[["A","生理需要"],["B","安全需要"],["C","归属与爱的需要"],["D","自我实现需要"],["E","尊重需要"]],"ans":"ABCE","k":[0,1,2,4],"exp":"缺失性需要包括生理、安全、归属与爱、尊重需要。自我实现需要是成长性需要。","src":"需要的层次，基础心理学→需要与动机，（掌握）"},{"id":"1-88","ch":0,"no":88,"t":"s","g":null,"stem":"情绪和情感产生的源泉是？","o":[["A","客观现实"],["B","生理需要"],["C","主观体验"],["D","意志行动"],["E","神经递质"]],"ans":"A","k":[0],"exp":"情绪和情感是人对客观现实与需要之间关系的反映，客观现实是其源泉。B选项是情绪产生的基础之一；C选项是情绪的组成部分；D选项与情绪调节有关；E选项是生理基础。","src":"情绪和情感的定义，基础心理学→情绪、情感与意志，（掌握）"},{"id":"1-89","ch":0,"no":89,"t":"s","g":null,"stem":"“化悲痛为力量”体现了情绪的什么功能？","o":[["A","适应功能"],["B","动机功能"],["C","组织功能"],["D","信号功能"],["E","保护功能"]],"ans":"B","k":[1],"exp":"情绪可以作为动机驱动行为，如悲痛转化为力量去行动。A选项是适应环境；C选项是调节认知和行为；D选项是传递信息。","src":"情绪和情感的功能，基础心理学→情绪、情感与意志，（熟悉）"},{"id":"1-90","ch":0,"no":90,"t":"s","g":null,"stem":"“忧者见之则忧，喜者见之则喜”说的是？","o":[["A","心境"],["B","激情"],["C","应激"],["D","情感"],["E","热情"]],"ans":"A","k":[0],"exp":"心境具有弥漫性，会影响人对周围事物的看法。B选项是短暂强烈的情绪；C选项是紧急状态下的情绪；D选项是稳定的体验；E选项不属于心理学术语。","src":"心境、激情和应激，基础心理学→情绪、情感与意志，（熟悉）"},{"id":"1-91","ch":0,"no":91,"t":"c","g":null,"stem":"突然遭遇火灾时，人可能会产生极强的恐惧感，心跳加速，力量倍增，迅速逃离。这种情绪状态是？","o":[["A","心境"],["B","激情"],["C","应激"],["D","热情"],["E","焦虑"]],"ans":"C","k":[2],"exp":"应激是在意外危险事件中产生的高度紧张状态，能调动身体资源。B选项虽强烈但有明确对象且意识狭窄；A选项微弱持久；D、E不符合。","src":"心境、激情和应激，基础心理学→情绪、情感与意志，（熟悉）"},{"id":"1-92","ch":0,"no":92,"t":"s","g":null,"stem":"意志行动的核心阶段是？","o":[["A","动机冲突"],["B","确定目的"],["C","执行决定"],["D","选择方法"],["E","评估结果"]],"ans":"C","k":[2],"exp":"执行决定阶段需要克服困难、坚持行动，是意志行动的关键。A、B、D是准备阶段；E是反馈阶段。","src":"意志行动的基本阶段，基础心理学→情绪、情感与意志，（熟悉）"},{"id":"1-93","ch":0,"no":93,"t":"s","g":null,"stem":"“人云亦云”“随大流”体现了个体意志品质的什么缺陷？","o":[["A","优柔寡断"],["B","独断性"],["C","受暗示性"],["D","任性"],["E","怯懦"]],"ans":"C","k":[2],"exp":"受暗示性是自觉性品质的反面，容易受他人影响而缺乏主见。A选项是果断性的反面；B 选项也是自觉性的反面，但表现为固执己见；D选项是自制性的反面；E选项是勇敢的反面。","src":"意志品质，基础心理学→情绪、情感与意志，（掌握）"},{"id":"1-94","ch":0,"no":94,"t":"s","g":null,"stem":"“锲而不舍，金石可镂”主要体现了意志的什么品质？","o":[["A","自觉性"],["B","果断性"],["C","坚韧性"],["D","自制性"],["E","独立性"]],"ans":"C","k":[2],"exp":"坚韧性是指长期坚持、克服困难以达到目的的品质。A选项是对行动目的有明确认识；B 选项是迅速决断；D选项是控制情绪。","src":"意志品质，基础心理学→情绪、情感与意志，（掌握）"},{"id":"1-95","ch":0,"no":95,"t":"m","g":null,"stem":"情绪和情感的区别有？","o":[["A","情绪更多与生理需要相关，情感与社会需要相关"],["B","情绪具有情境性和暂时性，情感具有稳定性和深刻性"],["C","情绪常伴有明显的生理变化，情感相对内隐"],["D","情绪是人和动物共有的，情感是人类特有的"],["E","情绪总是消极的，情感总是积极的"]],"ans":"ABCD","k":[0,1,2,3],"exp":"四个选项均为情绪与情感的区别。E选项错误，情绪和情感都有积极和消极之分。","src":"情绪和情感的区别和联系，基础心理学→情绪、情感与意志，（熟悉）"},{"id":"1-96","ch":0,"no":96,"t":"m","g":null,"stem":"情绪和情感的功能包括？","o":[["A","适应"],["B","动机"],["C","组织"],["D","信号"],["E","维持"]],"ans":"ABCD","k":[0,1,2,3],"exp":"四种功能均为情绪和情感的主要功能。E选项是动机的功能。","src":"情绪和情感的功能，基础心理学→情绪、情感与意志，（熟悉）"},{"id":"1-97","ch":0,"no":97,"t":"m","g":null,"stem":"应激状态下，个体可能出现的反应有？","o":[["A","警觉"],["B","抵抗"],["C","衰竭"],["D","快乐"],["E","木僵"]],"ans":"ABCE","k":[0,1,2,4],"exp":"塞利的一般适应综合征分为警觉、抵抗和衰竭三个阶段。极度应激下可能出现木僵反应。D选项不是应激的典型反应。","src":"心境、激情和应激，基础心理学→情绪、情感与意志，（熟悉）"},{"id":"1-98","ch":0,"no":98,"t":"m","g":null,"stem":"意志的品质包括？","o":[["A","自觉性"],["B","果断性"],["C","坚韧性"],["D","自制性"],["E","独立性"]],"ans":"ABCD","k":[0,1,2,3],"exp":"意志的四个基本品质。E选项属于自觉性的范畴。","src":"意志品质，基础心理学→情绪、情感与意志，（掌握）"},{"id":"1-99","ch":0,"no":99,"t":"m","g":null,"stem":"与果断性相反的意志品质有？","o":[["A","优柔寡断"],["B","草率决定"],["C","任性"],["D","怯懦"],["E","动摇性"]],"ans":"AB","k":[0,1],"exp":"优柔寡断（不能及时决定）和草率决定（不加思考）都是果断性差的表现。C选项是自制性的反面；D选项与果断性有关但核心是对立的是AB;E选项是坚韧性的反面。","src":"意志品质，基础心理学→情绪、情感与意志，（掌握）"},{"id":"1-100","ch":0,"no":100,"t":"s","g":null,"stem":"智力属于？","o":[["A","特殊能力"],["B","一般能力"],["C","创造能力"],["D","操作能力"],["E","社交能力"]],"ans":"B","k":[1],"exp":"智力是完成各种活动都必需的最基本的心理条件，属于一般能力。A选项是特定活动所需；C、D、E均属于特殊能力。","src":"能力概述，基础心理学→能力和人格，（掌握）"},{"id":"1-101","ch":0,"no":101,"t":"s","g":null,"stem":"人需要掌握的知识和技能越多，能力就越高。这种说法？","o":[["A","正确"],["B","错误，能力与知识技能是不同概念"],["C","部分正确，知识等同于能力"],["D","正确，技能就是能力"],["E","正确，能力是知识的累积"]],"ans":"B","k":[1],"exp":"能力与知识、技能有关但不等同。能力决定掌握知识技能的速度和质量，但拥有知识不等于有能力。","src":"能力概述，基础心理学→能力和人格，（掌握）"},{"id":"1-102","ch":0,"no":102,"t":"s","g":null,"stem":"在智力结构中，代表智力发展水平的核心因素是？","o":[["A","感知力"],["B","记忆力"],["C","思维力"],["D","注意力"],["E","想象力"]],"ans":"C","k":[2],"exp":"思维力是智力的支柱和核心。A、B、D、E虽然是智力的组成部分，但不是核心。","src":"能力概述，基础心理学→能力和人格，（掌握）"},{"id":"1-103","ch":0,"no":103,"t":"s","g":null,"stem":"“江山易改，禀性难移”中的“禀性”主要指的是？","o":[["A","性格"],["B","气质"],["C","能力"],["D","兴趣"],["E","需要"]],"ans":"B","k":[1],"exp":"气质主要受先天遗传影响，相对稳定，难以改变。A选项受后天影响大，可塑性强。","src":"气质概述，基础心理学一能力和人格，（掌握）"},{"id":"1-104","ch":0,"no":104,"t":"s","g":null,"stem":"根据巴甫洛夫的高级神经活动类型学说，强、平衡、灵活型对应的气质类型是？","o":[["A","胆汁质"],["B","多血质"],["C","黏液质"],["D","抑郁质"],["E","混合质"]],"ans":"B","k":[1],"exp":"多血质对应神经过程的强、平衡、灵活。胆汁质强而不平衡，黏液质强而平衡但不灵活，抑郁质弱。","src":"气质类型学说，基础心理学→能力和人格，（熟悉）"},{"id":"1-105","ch":0,"no":105,"t":"s","g":null,"stem":"一个人对待现实的态度和行为方式中比较稳定的心理特征称为？","o":[["A","气质"],["B","性格"],["C","能力"],["D","动机"],["E","信念"]],"ans":"B","k":[1],"exp":"性格是人对现实的稳定态度和习惯化了的行为方式。A选项是心理活动的动力特征；C选项是心理效能；D、E不属于人格特征范畴。","src":"性格的定义，基础心理学→能力和人格，（掌握）"},{"id":"1-106","ch":0,"no":106,"t":"s","g":null,"stem":"性格结构中的核心成分是？","o":[["A","性格的理智特征"],["B","性格的情绪特征"],["C","性格的意志特征"],["D","性格的态度特征"],["E","性格的行为特征"]],"ans":"D","k":[3],"exp":"性格的态度特征（对待社会、他人、自己、工作的态度）是性格的核心。","src":"性格的结构，基础心理学→能力和人格，（熟悉）"},{"id":"1-107","ch":0,"no":107,"t":"m","g":null,"stem":"能力发展的个体差异表现在？","o":[["A","水平差异"],["B","类型差异"],["C","表现早晚差异"],["D","性别差异"],["E","种族差异"]],"ans":"ABCD","k":[0,1,2,3],"exp":"能力差异包括发展水平（高低）、类型（不同特长）、表现早晚（早慧或大器晚成）和性别（某些能力倾向差异）","src":"能力发展的个体差异，基础心理学→能力和人格，（熟悉）"},{"id":"1-108","ch":0,"no":108,"t":"m","g":null,"stem":"影响能力发展的因素包括？","o":[["A","遗传"],["B","环境"],["C","教育"],["D","个体努力"],["E","营养"]],"ans":"ABCD","k":[0,1,2,3],"exp":"能力发展是遗传与环境、教育、实践活动、主观努力等多因素共同作用的结果。E选项是生理发育的基础，通常不作为心理层面的主要因素讨论。","src":"影响能力发展的因素，基础心理学→能力和人格，（熟悉）"},{"id":"1-109","ch":0,"no":109,"t":"m","g":null,"stem":"人格的特征包括？","o":[["A","独特性"],["B","稳定性"],["C","整体性"],["D","功能性"],["E","社会制约性"]],"ans":"ABCDE","k":[0,1,2,3,4],"exp":"人格具有独特性、稳定性、整体性、功能性和社会制约性等特征。","src":"人格的特性，基础心理学→能力和人格，（掌握）"},{"id":"1-110","ch":0,"no":110,"t":"m","g":null,"stem":"性格的静态结构包括？","o":[["A","态度特征"],["B","意志特征"],["C","情绪特征"],["D","理智特征"],["E","气质特征"]],"ans":"ABCD","k":[0,1,2,3],"exp":"性格的结构包括态度、意志、情绪、理智四个方面。气质特征不属于性格结构。","src":"性格的结构，基础心理学→能力和人格，（熟悉）"},{"id":"2-1","ch":1,"no":1,"t":"s","g":null,"stem":"人格的多种心理特征之间并非孤立存在而是有机联系在一起这体现了人格特性的 ( )","o":[["A","独特性"],["B","稳定性"],["C","统合性"],["D","功能性"],["E","复杂性"]],"ans":"C","k":[2],"exp":"统合性是指人格是由多种成分构成的一个有机整体具有内在的一致性受自我意识的调控。个体并非各种特征的简单堆砌而是整合的统一体。","src":"人格概念的形成与发展人格心理学→概论（掌握）"},{"id":"2-2","ch":1,"no":2,"t":"s","g":null,"stem":"在人格心理学的研究范式中主张通过深人个案研究来理解个体整体人格的取向属于 ( )","o":[["A","临床研究范式"],["B","相关研究范式"],["C","实验研究范式"],["D","行为遗传范式"],["E","进化心理学范式"]],"ans":"A","k":[0],"exp":"临床研究范式强调对个体进行深人细致的整体分析常采用个案研究法；相关研究和实验范式则更强调变量间的普遍关系和因果推断。","src":"人格心理学研究的科学体系人格心理学→概论（熟悉）"},{"id":"2-3","ch":1,"no":3,"t":"c","g":null,"stem":"面对同样的挫折乐观坚韧的人能够迅速调整心态而脆弱的人可能一蹶不振这体现了人格的( )","o":[["A","独特性"],["B","稳定性"],["C","统合性"],["D","功能性"],["E","社会性"]],"ans":"D","k":[3],"exp":"功能性是指人格决定一个人的生活方式甚至决定一个人的命运。面对同样的情境不同人格特征的人会做出不同的反应产生不同的结果。","src":"人格心理学的理论与应用价值人格心理学→概论（了解）"},{"id":"2-4","ch":1,"no":4,"t":"s","g":null,"stem":"研究发现，体内睾酮水平较高的个体，往往在人格测验中表现出更强的攻击性和支配欲，这说明了 ( )","o":[["A","内分泌系统对人格的影响"],["B","神经系统对人格的影响"],["C","身体外貌对人格的影响"],["D","成长环境对人格的影响"],["E","社会文化对人格的影响"]],"ans":"A","k":[0],"exp":"内分泌腺分泌的激素会直接影响个体的心理活动和行为。睾酮属于性激素，其水平高低与攻击性、支配性等人格特质存在关联，体现了内分泌系统对人格的影响。","src":"遗传与生理因素，人格心理学→概论，（熟悉）"},{"id":"2-5","ch":1,"no":5,"t":"s","g":null,"stem":"在安斯沃思的陌生情境测验中，被划分为“安全型依恋”的婴儿，其照看者通常的教养方式是 ( )","o":[["A","冷漠拒绝"],["B","敏感回应"],["C","过度干涉"],["D","忽视需求"],["E","严厉惩罚"]],"ans":"B","k":[1],"exp":"安全型依恋的婴儿能够感知到照看者对自己的需求是敏感和回应的，从而建立信任感；冷漠、忽视和干涉往往导致不安全型依恋。","src":"家庭与早期经验，人格心理学→概论，（熟悉）"},{"id":"2-6","ch":1,"no":6,"t":"c","g":null,"stem":"在课堂上，一个平时内向的学生因为被老师频繁点名发言，逐渐变得敢于表达自己，这体现了学校作为人格成因中的哪种影响途径？","o":[["A","教师的期望效应"],["B","同伴的榜样作用"],["C","校规的约束作用"],["D","课程的设置影响"],["E","校园文化的熏陶"]],"ans":"A","k":[0],"exp":"教师的期望会影响学生的自我认知和行为表现，频繁点名体现了教师对该学生的关注与期望，促使其人格特质发生积极改变。","src":"学校与社会文化，人格心理学→概论，（熟悉）"},{"id":"2-7","ch":1,"no":7,"t":"c","g":null,"stem":"面对嘈杂的环境，外向者倾向于寻找更热闹的社交场所，而内向者倾向于寻找安静的角落，这种对同一环境的不同主观解释和反应属于 ( )","o":[["A","反应的交互作用"],["B","唤起的交互作用"],["C","主动的交互作用"],["D","被动的交互作用"],["E","代际的交互作用"]],"ans":"A","k":[0],"exp":"反应的交互作用是指个体对相同客观环境的主观解释和反应不同。面对同样的嘈杂，内外向者赋予其不同的意义并作出不同反应。","src":"人格与环境的交互作用，人格心理学→概论，（掌握）"},{"id":"2-8","ch":1,"no":8,"t":"m","g":null,"stem":"现代心理学认为人格的基本特性包括 ( )","o":[["A","独特性"],["B","稳定性"],["C","统合性"],["D","功能性"],["E","生物性"]],"ans":"ABCD","k":[0,1,2,3],"exp":"人格具有独特性、稳定性、统合性和功能性四大基本特性；生物性是人格的自然基础但不在人格基本特性的总结范畴内。","src":"人格概念的形成与发展人格心理学→概论（掌握）"},{"id":"2-9","ch":1,"no":9,"t":"m","g":null,"stem":"人格心理学常用的研究方法包括 ( )","o":[["A","临床法"],["B","相关法"],["C","实验法"],["D","观察法"],["E","基因测序法"]],"ans":"ABCD","k":[0,1,2,3],"exp":"人格心理学的研究方法多样主要包括临床法、相关法、实验法和观察法等；基因测序法属于行为遗传学的具体技术手段不在人格心理学常规研究方法体系内。","src":"人格心理学研究的科学体系人格心理学→概论（熟悉）"},{"id":"2-10","ch":1,"no":10,"t":"m","g":null,"stem":"人格心理学在临床心理健康领域的应用价值主要体现在 ( )","o":[["A","帮助评估和诊断心理障碍"],["B","为心理治疗提供理论依据"],["C","指导心理咨询方案的制定"],["D","预测个体未来患病风险"],["E","直接消除致病基因"]],"ans":"ABCD","k":[0,1,2,3],"exp":"人格心理学有助于评估诊断、指导治疗和预测风险；E属于医学干预范畴不属于心理学应用。","src":"人格心理学的理论与应用价值人格心理学→概论（了解）"},{"id":"2-11","ch":1,"no":11,"t":"m","g":null,"stem":"神经系统对人格形成的影响主要体现在 ( )","o":[["A","大脑皮层的功能不对称性"],["B","神经递质的代谢水平"],["C","神经系统的强度与灵活性"],["D","父母的教养方式"],["E","网状上行激活系统的唤醒水平"]],"ans":"ABCE","k":[0,1,2,4],"exp":"大脑功能侧化、神经递质、神经类型及唤醒水平均属于神经系统的生理基础对人格的影响；D属于环境因素。","src":"遗传与生理因素，人格心理学→概论，（熟悉）"},{"id":"2-12","ch":1,"no":12,"t":"m","g":null,"stem":"专制型教养方式的父母对儿童的要求往往表现为 ( )","o":[["A","高控制"],["B","低温暖"],["C","高沟通"],["D","低理解"],["E","允许自由探索"]],"ans":"ABD","k":[0,1,3],"exp":"专制型教养表现为高控制、低温暖、低沟通和低理解，要求孩子绝对服从；高沟通和自由探索属于权威型教养的特点。","src":"家庭与早期经验，人格心理学→概论，（熟悉）"},{"id":"2-13","ch":1,"no":13,"t":"m","g":null,"stem":"同伴关系对儿童人格发展的影响主要表现在 ( )","o":[["A","提供社会比较的参照"],["B","促进观点采择能力的发展"],["C","影响自我价值感"],["D","提供情感支持"],["E","决定遗传基因的表达"]],"ans":"ABCD","k":[0,1,2,3],"exp":"同伴是儿童社会化的重要他人，影响自我认知、社会技能和情感发展；E属于生理遗传范畴。","src":"学校与社会文化，人格心理学→概论，（熟悉）"},{"id":"2-14","ch":1,"no":14,"t":"m","g":null,"stem":"关于人格与环境的交互作用在毕生发展中的变化，以下说法正确的有 ( )","o":[["A","婴儿期以被动交互为主"],["B","儿童早期开始出现主动选择环境"],["C","青少年期主动交互作用显著增加"],["D","成年期主要以被动交互为主"],["E","交互作用的形式在生命各阶段比例恒定"]],"ans":"ABC","k":[0,1,2],"exp":"随着年龄增长，个体从被动接受环境（婴儿期）逐渐发展到主动选择和塑造环境（青少年期和成年期）;D错误，成年期主动交互为主；E错误，交互作用形式的比例随生命周期而变化。","src":"人格与环境的交互作用，人格心理学→概论，（掌握）"},{"id":"2-15","ch":1,"no":15,"t":"s","g":null,"stem":"弗洛伊德认为，本我的活动遵循快乐原则，其心理能量的源泉是 ( )","o":[["A","自我理想"],["B","力比多"],["C","良心"],["D","现实检验"],["E","道德规范"]],"ans":"B","k":[1],"exp":"力比多是弗洛伊德理论中的核心概念，指生本能带来的心理能量，是本我运作的动力源泉。","src":"理论观点，人格心理学一经典精神分析理论，（掌握）"},{"id":"2-16","ch":1,"no":16,"t":"s","g":null,"stem":"当超我的要求与现实的限制发生冲突时，自我无法协调，产生的不安体验被称为 ( )","o":[["A","现实性焦虑"],["B","神经症性焦虑"],["C","道德性焦虑"],["D","存在性焦虑"],["E","认知性焦虑"]],"ans":"B","k":[1],"exp":"弗洛伊德将焦虑分为三种：现实性焦虑（来自外部世界的危险）、神经症性焦虑（害怕本我的冲动失控）、道德性焦虑（超我惩罚带来的内疚）。本我冲动与现实冲突属于神经症性焦虑。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-17","ch":1,"no":17,"t":"s","g":null,"stem":"“酸葡萄”心理和“甜柠檬”心理属于哪种自我防御机制？","o":[["A","压抑"],["B","投射"],["C","合理化"],["D","反向形成"],["E","转移"]],"ans":"C","k":[2],"exp":"合理化又称文饰作用，指无意识地用一种似乎有理的解释来掩盖难以接受的情感或行为，如“酸葡萄”（贬低得不到的）和“甜柠檬”（拔高已拥有的）。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-18","ch":1,"no":18,"t":"c","g":null,"stem":"6岁以后直到青春期，儿童的性本能变得相对安静，能量转向学业和同伴交往，这一时期属于弗洛伊德心理性欲发展的 (  )","o":[["A","口唇期"],["B","肛门期"],["C","性器期"],["D","潜伏期"],["E","生殖期"]],"ans":"D","k":[3],"exp":"潜伏期大约从6岁到青春期，性驱力被压抑在潜意识中，儿童将能量投入到学习、游戏和社会交往中。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-19","ch":1,"no":19,"t":"s","g":null,"stem":"弗洛伊德曾说“梦是通往潜意识的王道”，在释梦技术中，梦的真正含义被称为 ( )","o":[["A","显意"],["B","隐意"],["C","凝缩"],["D","移置"],["E","象征"]],"ans":"B","k":[1],"exp":"显意是梦的表面故事，隐意（潜性梦境）是梦的潜意识真实含义，释梦的目的是透过显意揭示隐意。","src":"理论应用，人格心理学一经典精神分析理论，（熟悉）"},{"id":"2-20","ch":1,"no":20,"t":"s","g":null,"stem":"尽管弗洛伊德理论备受争议，但他对心理学的最大贡献在于 ( )","o":[["A","首创了科学实验法研究人格"],["B","强调了环境对人性的决定作用"],["C","发现了人类潜意识的巨大力量"],["D","提出了条件反射学说"],["E","创立了人本主义心理学"]],"ans":"C","k":[2],"exp":"弗洛伊德最大的贡献是发现了潜意识，并建立了一套系统的潜意识理论，打破了理性主义的传统；A错，他主要用临床法；B错，他强调本能；D是巴甫洛夫；E是马斯洛等。","src":"理论评价，人格心理学一经典精神分析理论，（了解）"},{"id":"2-21","ch":1,"no":21,"t":"s","g":null,"stem":"荣格认为，代表社会认可的行为模式，是个体公开展现的一面，这种原型是 ( )","o":[["A","阴影"],["B","面具"],["C","阿妮玛"],["D","自性"],["E","英雄"]],"ans":"B","k":[1],"exp":"面具原型是个体为了适应社会而展现的公开人格，是为了给别人好印象的心理外壳。","src":"理论观点，人格心理学一经典精神分析理论，（掌握）"},{"id":"2-22","ch":1,"no":22,"t":"s","g":null,"stem":"荣格理论中，那些不被社会接受、被压抑在潜意识深处的阴暗特质构成了哪种原型？","o":[["A","阴影"],["B","面具"],["C","阿妮姆斯"],["D","自我"],["E","智慧老人"]],"ans":"A","k":[0],"exp":"阴影原型代表人格中不被认可的、邪恶的、不道德的冲动和特质，类似于弗洛伊德的本我部分。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-23","ch":1,"no":23,"t":"s","g":null,"stem":"荣格在释梦时，不局限于个人的联想，而是将梦的内容与神话、宗教等人类普遍经验联系起来，这种方法称为 ( )","o":[["A","自由联想"],["B","放大法"],["C","释梦法"],["D","词语联想"],["E","积极想象"]],"ans":"B","k":[1],"exp":"放大法是荣格释梦的核心技术，通过将个人梦的意象与集体潜意识中的神话原型进行类比，以揭示梦的深层含义。","src":"理论应用，人格心理学→经典精神分析理论，（熟悉）"},{"id":"2-24","ch":1,"no":24,"t":"s","g":null,"stem":"阿德勒认为，人生的最终目标不是摆脱自卑，而是追求 ( )","o":[["A","力比多的满足"],["B","优越感"],["C","潜意识整合"],["D","自我实现"],["E","社会认同"]],"ans":"B","k":[1],"exp":"阿德勒认为追求优越是个体行为的最终目标，人天生具有克服自卑、追求完美的内在动力。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-25","ch":1,"no":25,"t":"s","g":null,"stem":"阿德勒认为，个体的行为是受其对未来的虚构目标所牵引的，这种对未来的主观期待被称为 ( )","o":[["A","生活风格"],["B","虚构目的论"],["C","社会兴趣"],["D","创造性自我"],["E","自卑情结"]],"ans":"B","k":[1],"exp":"虚构目的论是阿德勒的重要观点，认为人的行为受其对未来的主观设想（虚构目标）引导，而非仅仅被过去经验决定。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-26","ch":1,"no":26,"t":"s","g":null,"stem":"阿德勒心理治疗的最终目标，是帮助来访者培养和增加 ( )","o":[["A","自我效能感"],["B","社会兴趣"],["C","潜意识觉察"],["D","合理信念"],["E","情绪宣泄"]],"ans":"B","k":[1],"exp":"阿德勒认为心理问题的根源是缺乏社会兴趣，因此治疗的核心和最终目标是帮助来访者重建社会兴趣。","src":"理论应用，人格心理学→经典精神分析理论，（熟悉）"},{"id":"2-27","ch":1,"no":27,"t":"m","g":null,"stem":"弗洛伊德认为，人格结构中的自我具有哪些功能？","o":[["A","协调本我、超我与现实的关系"],["B","遵循现实原则"],["C","提供心理能量"],["D","执行防御机制"],["E","内化社会道德规范"]],"ans":"ABD","k":[0,1,3],"exp":"自我是本我与超我的调节者，遵循现实原则，并运用防御机制缓解焦虑；C错误，本我提供能量；E错误，超我内化道德规范。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-28","ch":1,"no":28,"t":"m","g":null,"stem":"弗洛伊德将焦虑分为哪几种类型？","o":[["A","现实性焦虑"],["B","神经症性焦虑"],["C","道德性焦虑"],["D","社交性焦虑"],["E","分离性焦虑"]],"ans":"ABC","k":[0,1,2],"exp":"弗洛伊德将焦虑分为现实性焦虑、神经症性焦虑和道德性焦虑；D、E是现代焦虑障碍的分类，不属于弗洛伊德的精神分析分类。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-29","ch":1,"no":29,"t":"m","g":null,"stem":"经典精神分析治疗试图通过哪些技术来揭示潜意识冲突？","o":[["A","自由联想"],["B","释梦"],["C","阻抗分析"],["D","移情分析"],["E","系统脱敏"]],"ans":"ABCD","k":[0,1,2,3],"exp":"自由联想、释梦、阻抗分析和移情分析是经典精神分析挖掘潜意识的四大核心技术；E 属于行为疗法技术。","src":"理论应用，人格心理学→经典精神分析理论，（熟悉）"},{"id":"2-30","ch":1,"no":30,"t":"m","g":null,"stem":"科学哲学家波普尔等人对弗洛伊德理论的批评主要集中在 ( )","o":[["A","理论具有不可证伪性"],["B","过分强调早期经验的决定论"],["C","忽视了社会文化因素"],["D","概念缺乏操作化定义"],["E","治疗方法过于简短"]],"ans":"ABCD","k":[0,1,2,3],"exp":"弗洛伊德理论常被批评为不可证伪、决定论倾向、忽视社会文化、概念难以测量；E错误，精神分析治疗通常极其漫长。","src":"理论评价，人格心理学→经典精神分析理论，（了解）"},{"id":"2-31","ch":1,"no":31,"t":"m","g":null,"stem":"荣格提出的心理类型学中，将思维和情感称为 ( )","o":[["A","理性功能"],["B","非理性功能"],["C","判断功能"],["D","知觉功能"],["E","外倾功能"]],"ans":"AC","k":[0,2],"exp":"荣格将思维和情感称为理性功能或判断功能，因为它们涉及对信息的评价和判断；感觉和直觉称为非理性功能或知觉功能。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-32","ch":1,"no":32,"t":"m","g":null,"stem":"阿德勒认为，每个人在生活中都必须面对并完成三大任务 ( )","o":[["A","职业任务"],["B","社交任务"],["C","婚恋任务"],["D","生存任务"],["E","娱乐任务"]],"ans":"ABC","k":[0,1,2],"exp":"阿德勒提出人生的三大任务是职业任务、社交任务（友谊）和婚恋任务（爱情），这三者都离不开社会兴趣。","src":"理论观点，人格心理学一经典精神分析理论，（掌握）"},{"id":"2-33","ch":1,"no":33,"t":"k","g":"2-0","stem":"该来访者认为“这门课本来就没用”，这种心理防御机制属于 ( )","o":[["A","合理化"],["B","酸葡萄心理"],["C","投射"],["D","压抑"],["E","反向形成"],["F","甜柠檬心理"]],"ans":"AB","k":[0,1],"exp":"合理化是个体遭受挫折时用似乎合理的解释来掩饰真实原因，酸葡萄心理（贬低得不到的东西）是合理化的一种表现。","src":"理论观点，人格心理学一经典精神分析理论，（掌握）"},{"id":"2-34","ch":1,"no":34,"t":"k","g":"2-0","stem":"该来访者抱怨“老师出题太偏”，将自己的过错推卸给他人，这种防御机制是 ( )","o":[["A","合理化"],["B","投射"],["C","转移"],["D","否认"],["E","升华"],["F","抵消"]],"ans":"B","k":[1],"exp":"投射是指将自己内心不为社会接受的冲动或过错归因于他人。他将自己未考好的责任推给老师，属于投射。","src":"理论观点，人格心理学一经典精神分析理论，（掌握）"},{"id":"2-35","ch":1,"no":35,"t":"k","g":"2-0","stem":"梦中被猛兽追赶并掉下悬崖，其梦的显意是 ( )","o":[["A","对考试失败的焦虑"],["B","超我的惩罚"],["C","猛兽追赶和掉下悬崖的情境"],["D","对老师的愤怒"],["E","潜意识的欲望"],["F","死亡的本能"]],"ans":"C","k":[2],"exp":"显意是做梦者醒后能回忆起来的梦境表面内容，即猛兽追赶和掉下悬崖的情境；其他选项属于梦的隐意或心理动力学解释。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-36","ch":1,"no":36,"t":"k","g":"2-0","stem":"若要揭示该梦的隐意，精神分析治疗师可能会采用哪些技术 ( )","o":[["A","自由联想"],["B","释梦"],["C","系统脱敏"],["D","阻抗分析"],["E","积极想象"],["F","梦的放大"]],"ans":"ABD","k":[0,1,3],"exp":"精神分析揭示潜意识的技术主要包括自由联想、释梦、阻抗分析和移情分析；C属于行为疗法；E、F属于荣格的分析心理学技术。","src":"理论应用，人格心理学→经典精神分析理论，（熟悉）"},{"id":"2-37","ch":1,"no":37,"t":"k","g":"2-0","stem":"该来访者在考试前感到莫名恐慌，担心自己无法控制去打游戏而荒废学业，这种焦虑在弗洛伊德看来属于 ( )","o":[["A","现实性焦虑"],["B","神经症性焦虑"],["C","道德性焦虑"],["D","存在性焦虑"],["E","分离性焦虑"],["F","超我焦虑"]],"ans":"B","k":[1],"exp":"神经症性焦虑是本我的冲动（如想打游戏）可能突破自我的控制而引发的恐惧；现实性焦虑是对外部危险的恐惧；道德性焦虑是超我惩罚带来的内疚。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-38","ch":1,"no":38,"t":"k","g":"2-0","stem":"根据荣格的心理类型理论，该来访者属于 ( )","o":[["A","内倾思维型"],["B","外倾思维型"],["C","内倾情感型"],["D","外倾直觉型"],["E","内倾感觉型"],["F","外倾感觉型"]],"ans":"A","k":[0],"exp":"内倾思维型的人高度关注内在的逻辑和观念，忽视外部现实和人际情感，常表现为独断专行、固执己见，喜欢独处思考。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-39","ch":1,"no":39,"t":"k","g":"2-0","stem":"他到了中年感到空虚并转向宗教神话的研读，这在荣格理论中属于 ( )","o":[["A","神经症性倒退"],["B","个性化过程的启动"],["C","精神分裂的前兆"],["D","潜意识压抑的释放"],["E","生本能的转化"],["F","情结的爆发"]],"ans":"B","k":[1],"exp":"荣格认为，中年是心理发展的关键期，个体开始从适应外部世界转向关注内心世界，寻求生命的深层意义，这是个性化（自性化）过程启动的标志。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-40","ch":1,"no":40,"t":"k","g":"2-0","stem":"荣格认为，中年期的心理转变通常涉及哪些原型的激活 ( )","o":[["A","面具"],["B","阴影"],["C","阿妮玛"],["D","自性"],["E","英雄"],["F","智慧老人"]],"ans":"CD","k":[2,3],"exp":"中年期个性化过程中，男性常开始整合其女性特质（阿妮玛），并最终追求核心的统合原型（自性）；面具和英雄更多是青年期适应外界的原型。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-41","ch":1,"no":41,"t":"k","g":"2-0","stem":"他沉迷于神话研读，发现不同文化的神话都有相似的英雄历险主题，这体现了荣格理论中的 ( )","o":[["A","个人潜意识"],["B","集体潜意识"],["C","机能自主"],["D","自我实现"],["E","基本焦虑"],["F","社会兴趣"]],"ans":"B","k":[1],"exp":"不同文化中普遍存在的相似神话原型，是集体潜意识存在的有力证据，它是不依赖于个人经验的遗传心理遗产。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-42","ch":1,"no":42,"t":"k","g":"2-0","stem":"如果荣格对该来访者进行释梦，他可能会采用哪些技术 ( )","o":[["A","自由联想"],["B","放大法"],["C","词语联想"],["D","积极想象"],["E","系统脱敏"],["F","消退"]],"ans":"BCD","k":[1,2,3],"exp":"荣格的常用技术包括放大法、词语联想和积极想象；A是弗洛伊德的核心技术；E、F属于行为疗法。","src":"理论应用，人格心理学→经典精神分析理论，（熟悉）"},{"id":"2-43","ch":1,"no":43,"t":"s","g":null,"stem":"霍妮认为，神经症患者内心存在一种不切实际的自我美化形象，借此掩盖内心的空虚和冲突，这种形象被称为 ( )","o":[["A","真实自我"],["B","理想化意象"],["C","应该自我"],["D","魔鬼自我"],["E","现实自我"]],"ans":"B","k":[1],"exp":"理想化意象是霍妮理论的核心概念，指神经症患者为了解决内在冲突而创造出的一个绝对完美的自我幻象，与真实自我脱节。","src":"3.1.1 理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-44","ch":1,"no":44,"t":"s","g":null,"stem":"霍妮将个体将自己内心的冲突、过错外投到他人身上，认为问题出在别人而非自己，这种防御机制称为 ( )","o":[["A","投射"],["B","外化"],["C","合理化"],["D","理想化"],["E","反向形成"]],"ans":"B","k":[1],"exp":"外化是霍妮特别强调的一种防御机制，指个体将内在的冲突体验为外在的，把对自己的不满转化为对他人的不满。","src":"3.1.1理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-45","ch":1,"no":45,"t":"s","g":null,"stem":"霍妮在治疗中鼓励患者去认识自己真实的情感和需求，放弃不切实际的“应该”，这一过程被称为 ( )","o":[["A","自由联想"],["B","系统脱敏"],["C","自我分析"],["D","梦的解析"],["E","移情修通"]],"ans":"C","k":[2],"exp":"霍妮倡导自我分析，帮助患者觉察真实的自我，挑战“应该的专横”，放弃理想化意象。","src":"3.1.2理论应用，人格心理学→新精神分析理论，（熟悉）"},{"id":"2-46","ch":1,"no":46,"t":"s","g":null,"stem":"弗洛姆将那种把自己的价值感建立在被他人需要和喜爱上，试图通过迎合他人来获得安全感的非生产性取向称为 ( )","o":[["A","接受取向"],["B","剥削取向"],["C","囤积取向"],["D","市场取向"],["E","生产取向"]],"ans":"D","k":[3],"exp":"市场取向的人将自己视为商品，其价值取决于市场的交换价值，即别人是否需要和喜欢，像变色龙一样迎合他人。","src":"3.2.1理论观点，人格心理学→新精神分析理论，（掌握）］"},{"id":"2-47","ch":1,"no":47,"t":"s","g":null,"stem":"弗洛姆认为，现代社会中人们获得了自由，但也因此感到孤独和无力，为了克服这种无力感而放弃自由，这被称为 ( )","o":[["A","积极自由"],["B","逃避自由"],["C","权威主义"],["D","机械的自动顺从"],["E","破坏欲"]],"ans":"B","k":[1],"exp":"“逃避自由”是弗洛姆的核心概念，指个体为了逃避自由带来的孤独与责任，而选择臣服于权威或顺从社会。","src":"3.2.1理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-48","ch":1,"no":48,"t":"s","g":null,"stem":"弗洛姆提出，一个社会中大多数成员共同具有的性格结构核心，被称为 ( )","o":[["A","集体潜意识"],["B","社会性格"],["C","基本焦虑"],["D","生活风格"],["E","原型"]],"ans":"B","k":[1],"exp":"社会性格是弗洛姆理论的重要概念，指特定社会结构下形成的共同性格特质，使社会成员的行为符合社会要求。","src":"3.2.1 理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-49","ch":1,"no":49,"t":"s","g":null,"stem":"弗洛姆的自由辩证法认为，人类历史的发展是一个 ( )","o":[["A","不断压抑本能的过程"],["B","不断追求优越的过程"],["C","不断个体化又寻求归属的过程"],["D","不断适应社会规范的过程"],["E","不断消灭自我的过程"]],"ans":"C","k":[2],"exp":"弗洛姆认为，人类脱离自然的个体化过程带来了自由，但也带来了孤独，因此人又渴望重新建立联系（归属），即“自由与安全”的矛盾。","src":"3.2.2理论应用，人格心理学→新精神分析理论，（熟悉）"},{"id":"2-50","ch":1,"no":50,"t":"s","g":null,"stem":"客体关系理论中的“客体”主要指的是 ( )","o":[["A","物理环境中的无生命物体"],["B","个体的重要他人或其心理表征"],["C","本我中的驱力对象"],["D","超我中的道德规范"],["E","集体潜意识中的原型"]],"ans":"B","k":[1],"exp":"在客体关系理论中，“客体”特指对个体心理发展有重要影响的人（通常是早期照看者）或其内化的心理表象。","src":"理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-51","ch":1,"no":51,"t":"s","g":null,"stem":"婴儿将母亲分为“好妈妈”和“坏妈妈”两个截然不同的部分，无法将两者整合，这种心理机制称为 ( )","o":[["A","投射性认同"],["B","内化"],["C","分裂"],["D","外化"],["E","升华"]],"ans":"C","k":[2],"exp":"分裂是客体关系理论的核心防御机制，指将客体割裂为全好或全坏，无法接纳客体兼具好坏两面，常见于边缘型人格特征。","src":"理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-52","ch":1,"no":52,"t":"c","g":null,"stem":"在客体关系治疗中，患者无意识地诱导治疗师以某种特定方式反应，以此来重现其早年的客体关系模式，这种机制称为 ( )","o":[["A","移情"],["B","投射性认同"],["C","内化"],["D","共情"],["E","阻抗"]],"ans":"B","k":[1],"exp":"投射性认同是客体关系理论的重要概念，不仅将内在投射出去，还通过人际互动诱导对方做出符合自己投射的行为，在治疗中常表现为重现患者的病理关系模式。","src":"理论应用，人格心理学→新精神分析理论，（熟悉）"},{"id":"2-53","ch":1,"no":53,"t":"m","g":null,"stem":"霍妮提出的应对基本焦虑的神经症策略中，属于“亲近人”表现的有 ( )","o":[["A","追求他人的喜爱和赞许"],["B","追求权力和剥削他人"],["C","追求他人支配自己的生活"],["D","追求完美无瑕"],["E","限制自己的生活范围"]],"ans":"AC","k":[0,2],"exp":"亲近人（顺从型）表现为顺从、依赖、渴望被爱和被保护；B属于反抗人；D属于理想化意象；E属于回避人。","src":"3.1.1 理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-54","ch":1,"no":54,"t":"m","g":null,"stem":"霍妮认为，神经症患者常处于“应该的专横”之下，其典型的“应该”思维包括 ( )","o":[["A","我应该无所不能"],["B","我应该永远不出错"],["C","我应该让所有人都喜欢我"],["D","我应该接受自己的平凡"],["E","我应该理解他人的局限"]],"ans":"ABC","k":[0,1,2],"exp":"“应该的专横”是不切实际的绝对化要求，如全能、完美、绝对受欢迎；D、E是健康的心态，不属于神经症性的“应该”。","src":"3.1.1 理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-55","ch":1,"no":55,"t":"m","g":null,"stem":"弗洛姆认为人类存在的两种不同的生存方式是 ( )","o":[["A","占有"],["B","存在"],["C","接受"],["D","剥削"],["E","市场"]],"ans":"AB","k":[0,1],"exp":"弗洛姆在晚年提出重“占有”和重“存在”两种生存方式，前者强调对物的控制，后者强调体验和分享。","src":"3.2.1 理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-56","ch":1,"no":56,"t":"m","g":null,"stem":"以下心理学家中，属于客体关系理论代表人物的有 ( )","o":[["A","梅兰妮·克莱因"],["B","玛格丽特·马勒"],["C","海因茨·科胡特"],["D","卡尔·荣格"],["E","阿尔弗雷德·阿德勒"]],"ans":"ABC","k":[0,1,2],"exp":"克莱因、马勒和科胡特（自体心理学由客体关系发展而来）是客体关系理论的代表；荣格属于分析心理学，阿德勒属于个体心理学。","src":"理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-57","ch":1,"no":57,"t":"m","g":null,"stem":"与弗洛伊德经典精神分析相比，客体关系理论的基本假设转变体现在 ( )","o":[["A","从驱力决定论转向关系寻求"],["B","从生物本能转向社会人际"],["C","认为人是寻求客体满足的"],["D","认为人是寻求关系连接的"],["E","强调俄狄浦斯情结的核心作用"]],"ans":"ABD","k":[0,1,3],"exp":"客体关系理论认为人是寻求与他人建立关系的，而非仅仅满足生物驱力（C错），并弱化了俄狄浦斯情结的核心地位（E错）。","src":"理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-58","ch":1,"no":58,"t":"m","g":null,"stem":"马勒的分离-个体化阶段包括以下哪些子阶段？","o":[["A","孵化期（分化）"],["B","实践期"],["C","和解期"],["D","客体恒常期"],["E","共生期"]],"ans":"ABCD","k":[0,1,2,3],"exp":"马勒的分离-个体化阶段包括孵化、实践、和解和客体恒常四个子阶段；共生期是分离-个体化之前的阶段。","src":"理论应用，人格心理学→新精神分析理论，（熟悉）"},{"id":"2-59","ch":1,"no":59,"t":"m","g":null,"stem":"客体关系理论在心理治疗中的核心目标包括 ( )","o":[["A","帮助患者觉察其内化的不良客体关系"],["B","建立新的、健康的客体关系"],["C","释放本我的压抑能量"],["D","修正早期内化的坏客体表象"],["E","培养现实检验能力"]],"ans":"ABD","k":[0,1,3],"exp":"客体关系治疗旨在修正内化的坏客体及不良关系模式，建立新关系；C是弗洛伊德理论目标；E是自我心理学的目标。","src":"理论应用，人格心理学→新精神分析理论，（熟悉）"},{"id":"2-60","ch":1,"no":60,"t":"k","g":"2-1","stem":"根据阿德勒的出生顺序效应，该来访者作为长女，最可能形成的性格特征是 ( )","o":[["A","极度依赖他人"],["B","责任感与保守性"],["C","追求卓越，反叛规则"],["D","缺乏共情能力"],["E","天生的乐观主义"],["F","强烈的自卑感"]],"ans":"B","k":[1],"exp":"阿德勒认为，长子（长女）曾独占父母的爱，后因弟妹出生而“让位”，因此常带有保守、责任感强、重视规则、具有组织领导能力的特征。她从小被要求照顾弟弟，体现了保守与责任感。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-61","ch":1,"no":61,"t":"k","g":"2-1","stem":"她在人际关系中极具竞争性和敌意，同时渴望被爱，这属于霍妮提出的哪些神经症策略( )","o":[["A","亲近人"],["B","反抗人"],["C","回避人"],["D","理想化"],["E","外化"],["F","自谦"]],"ans":"AB","k":[0,1],"exp":"渴望被爱属于“亲近人”（顺从型）的表现，极具竞争性和敌意属于“反抗人”（攻击型）的表现。神经症患者常在这三种策略中摇摆冲突。","src":"理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-62","ch":1,"no":62,"t":"k","g":"2-1","stem":"该来访者童年时总是被迫“让着弟弟”，内心积压了大量的不满与委屈，阿德勒认为这种童年经历容易导致 ( )","o":[["A","社会兴趣过剩"],["B","自卑情结"],["C","优越情结"],["D","机能自主"],["B","集体潜意识"],["F","完美主义"]],"ans":"B","k":[1],"exp":"童年期被忽视或被迫压抑需求，容易使儿童感到自己毫无价值、处于劣势，从而形成深重的自卑情结。","src":"理论观点，人格心理学→经典精神分析理论，（掌握）"},{"id":"2-63","ch":1,"no":63,"t":"k","g":"2-1","stem":"霍妮认为，该来访者觉得“别人会利用她”，这种对外界的基本敌意源于 ( )","o":[["A","遗传的天性"],["B","童年期父母的冷漠与忽视"],["C","性驱力的压抑"],["D","俄狄浦斯情结未解决"],["E","集体潜意识的激活"],["F","出生创伤"]],"ans":"B","k":[1],"exp":"霍妮强调环境因素，认为父母对儿童的不当态度（如冷漠、偏爱、不守承诺等）会使儿童产生基本焦虑和基本敌意。","src":"理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-64","ch":1,"no":64,"t":"k","g":"2-1","stem":"该来访者内心渴望爱又充满敌意，这种矛盾的体验让她极其痛苦，霍妮认为解决这种冲突的神经症性方法包括 ( )","o":[["A","亲近人"],["B","反抗人"],["C","回避人"],["D","建立理想化意象"],["E","外化"],["F","自我分析"]],"ans":"ABCDE","k":[0,1,2,3,4],"exp":"霍妮认为，为了解决基本冲突，神经症患者不仅采用亲近人、反抗人、回避人三种策略，还会辅以理想化意象、外化、合理化等辅助防御机制；F是健康的解决途径。","src":"理论观点，人格心理学→新精神分析理论，（掌握）"},{"id":"2-65","ch":1,"no":65,"t":"s","g":null,"stem":"马斯洛认为，自我实现者能够准确地感知现实，不带有主观偏见，这种特征被称为 ( )","o":[["A","积极的自我概念"],["B","对现实的敏锐洞察力"],["C","高峰体验"],["D","内在的超脱"],["E","文化适应"]],"ans":"B","k":[1],"exp":"马斯洛总结的自我实现者特征中，对现实的敏锐洞察力是指他们能够如实地观察世界，不把个人意愿强加于现实，较少受主观愿望、焦虑或恐惧的歪曲。","src":"理论观点，人格心理学→人本主义心理学，（掌握）"},{"id":"2-66","ch":1,"no":66,"t":"s","g":null,"stem":"马斯洛将那些没有明显的生理或心理缺陷，但由于缺乏成长动机而无法发挥潜能的人称为( )","o":[["A","神经症患者"],["B","精神病患者"],["C","非成长者"],["D","缺乏超越性动机者"],["E","自我实现者"]],"ans":"C","k":[2],"exp":"马斯洛将那些基本需要已满足，却缺乏成长动机、安于现状、不愿发挥潜能的人称为非成长者；他们并非病态，只是未能达到自我实现。","src":"理论观点，人格心理学一人本主义心理学，（掌握）"},{"id":"2-67","ch":1,"no":67,"t":"c","g":null,"stem":"在企业管理中，提倡让员工参与决策、提供富有挑战性的工作以满足其成长需求，这体现了马斯洛理论中的 ( )","o":[["A","生理需要管理"],["B","安全需要管理"],["C","归属需要管理"],["D","自我实现需要管理"],["E","权力需要管理"]],"ans":"D","k":[3],"exp":"给予挑战性和参与决策是为了满足员工发挥潜能、实现自我价值的需要，属于自我实现需要管理的应用。","src":"理论应用，人格心理学→人本主义心理学，（熟悉）"},{"id":"2-68","ch":1,"no":68,"t":"s","g":null,"stem":"罗杰斯认为，个体的全部经验--包括个体在任何一个时刻所感知到的一切，构成了其主观世界，这被称为 ( )","o":[["A","自我概念"],["B","现象场"],["C","理想自我"],["D","机体评价过程"],["E","价值条件"]],"ans":"B","k":[1],"exp":"现象场是个体在任一时刻所体验到的主观世界，是罗杰斯现象学视角的核心概念；自我概念只是现象场中关于自身的那部分经验。","src":"理论观点，人格心理学→人本主义心理学，（掌握）"},{"id":"2-69","ch":1,"no":69,"t":"s","g":null,"stem":"罗杰斯认为，健康人格的标志是经验与自我概念的完全一致，这种状态的人被称为 ( )","o":[["A","自我实现者"],["B","完全功能的人"],["C","理性情绪者"],["D","个体化的人"],["E","控制点内控者"]],"ans":"B","k":[1],"exp":"罗杰斯用“完全功能的人”来形容心理健康者，他们的自我概念与经验协调一致，对经验开放，信任自己的机体评价过程，拥有存在感。","src":"理论观点，人格心理学→人本主义心理学，（掌握）"},{"id":"2-70","ch":1,"no":70,"t":"c","g":null,"stem":"在以人为中心的治疗中，咨询师不对来访者进行评判，也不替来访者做决定，这种态度被称为 ( )","o":[["A","非指导性原则"],["B","价值中立原则"],["C","积极关注原则"],["D","现实检验原则"],["E","节制原则"]],"ans":"A","k":[0],"exp":"非指导性原则是罗杰斯疗法的核心特征，咨询师相信来访者有能力自我成长，不进行干预、指导和评判。","src":"理论应用，人格心理学→人本主义心理学，（熟悉）"},{"id":"2-71","ch":1,"no":71,"t":"m","g":null,"stem":"马斯洛提出的成长性需要包括 ( )","o":[["A","求知需要"],["B","审美需要"],["C","自我实现的需要"],["D","尊重需要"],["E","归属需要"]],"ans":"ABC","k":[0,1,2],"exp":"马斯洛后期将需要分为缺失性需要和成长性需要，成长性需要包括求知、审美和自我实现需要；尊重和归属属于缺失性需要。","src":"理论观点，人格心理学→人本主义心理学，（掌握）"},{"id":"2-72","ch":1,"no":72,"t":"m","g":null,"stem":"马斯洛认为自我实现者具有的特征包括 ( )","o":[["A","对现实的有效洞察力"],["B","对自我、他人和自然的接受"],["C","以问题为中心"],["D","较强的人际交往欲望"],["E","民主的性格结构"]],"ans":"ABCE","k":[0,1,2,4],"exp":"自我实现者虽然具有深厚的感情关系，但朋友圈较小，而非较强的人际交往欲望；A、\nB、C、E均是其典型特征。","src":"理论观点，人格心理学→人本主义心理学，（掌握）"},{"id":"2-73","ch":1,"no":73,"t":"m","g":null,"stem":"对人本主义心理学（马斯洛理论）的批评主要集中在 ( )","o":[["A","概念缺乏严格的操作定义"],["B","研究方法过于强调实证而忽视主观体验"],["C","自我实现概念具有自我服务的精英主义倾向"],["D","忽视人性中的阴暗面"],["E","过度强调社会文化对人的决定作用"]],"ans":"ACD","k":[0,2,3],"exp":"马斯洛理论常被批评为概念模糊（A）、自我实现者多选自精英阶层（C）以及过于乐观而忽视了人性恶的一面（D);B错误，人本主义恰恰重视主观体验而非纯实证；E错误，人本主义强调个体潜能而非社会决定。","src":"理论评价，人格心理学→人本主义心理学，（了解）"},{"id":"2-74","ch":1,"no":74,"t":"m","g":null,"stem":"罗杰斯认为，防御机制的产生是因为个体的经验与自我概念不一致，为了维护自我概念，个体常采用的防御方式有 ( )","o":[["A","选择性忽视"],["B","扭曲经验"],["C","否认"],["D","投射"],["E","升华"]],"ans":"ABC","k":[0,1,2],"exp":"罗杰斯认为主要的防御方式是扭曲（改变经验的意义）和否认（拒绝接受经验），选择性忽视也属于防御范畴；投射和升华属于精神分析的概念。","src":"理论观点，人格心理学→人本主义心理学，（掌握）"},{"id":"2-75","ch":1,"no":75,"t":"m","g":null,"stem":"罗杰斯认为，促进个体心理成长和治疗的三个核心条件是 ( )","o":[["A","无条件积极关注"],["B","共情"],["C","真诚一致"],["D","解释"],["E","指导"]],"ans":"ABC","k":[0,1,2],"exp":"无条件积极关注、共情和真诚一致是罗杰斯以人为中心疗法的三大核心条件；D、E属于精神分析或认知行为疗法的技术。","src":"理论观点，人格心理学→人本主义心理学，（掌握）"},{"id":"2-76","ch":1,"no":76,"t":"s","g":null,"stem":"奥尔波特认为，成年人的动机是独立于童年经验的，当前行为的动机是自主的，这一概念被称为 ( )","o":[["A","功能独立性"],["B","动机的机能自主"],["C","特质自主性"],["D","驱力降低"],["E","自我效能"]],"ans":"B","k":[1],"exp":"机能自主是奥尔波特的重要概念，认为成人的动机是自我维持的当前系统，不再依赖于过去的童年经验。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-77","ch":1,"no":77,"t":"s","g":null,"stem":"在奥尔波特的理论中，一个人身上最突出、最具有代表性的特质是 ( )","o":[["A","中心特质"],["B","次要特质"],["C","首要特质"],["D","根源特质"],["E","表面特质"]],"ans":"C","k":[2],"exp":"首要特质是个体最典型、最具概括性的特质，在个人特质结构中处于主导地位；中心特质是构成个体独特性的几个重要特质。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-78","ch":1,"no":78,"t":"s","g":null,"stem":"卡特尔通过因素分析发现，那些可以通过观察外显行为直接获得的特质被称为 ( )","o":[["A","根源特质"],["B","表面特质"],["C","体质特质"],["D","环境塑造特质"],["E","能力特质"]],"ans":"B","k":[1],"exp":"表面特质是直接观察到的外显特质集合，而根源特质是内在的、构成人格结构的基本因素，是表面特质的原因。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-79","ch":1,"no":79,"t":"s","g":null,"stem":"卡特尔基于因素分析编制的人格问卷，广泛应用于心理咨询和人员选拔，该问卷是 ( )","o":[["A","MMPI"],["B","EPQ"],["C","16PF"],["D","NEO-PI"],["E","SCL-90"]],"ans":"C","k":[2],"exp":"16PF（卡特尔16种人格因素问卷）是卡特尔基于其根源特质理论编制的；A是明尼苏达多项人格测验；B是艾森克人格问卷；D是大五人格量表；E是症状自评量表。","src":"理论应用，人格心理学→人格特质理论，（熟悉）"},{"id":"2-80","ch":1,"no":80,"t":"s","g":null,"stem":"艾森克认为，内向者的大脑皮层基础唤醒水平较高，因此他们 ( )","o":[["A","更需要强烈的外部刺激"],["B","更容易感到无聊"],["C","更喜欢喧闹的社交环境"],["D","倾向于回避强烈的刺激"],["E","冲动控制力较弱"]],"ans":"D","k":[3],"exp":"内向者皮层唤醒水平高，对刺激敏感，容易达到最佳唤醒水平，因此倾向于回避强烈刺激以防止过度唤醒；外向者唤醒水平低，因此寻求刺激。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-81","ch":1,"no":81,"t":"s","g":null,"stem":"在艾森克的人格问卷（EPQ）中，用来测量个体掩饰、做假或自身隐蔽的量表是 ( )","o":[["A","E量表"],["B","N量表"],["C","P量表"],["D","L量表"],["E","Q量表"]],"ans":"D","k":[3],"exp":"L量表（Lie Scale）是效度量表，测量个体的掩饰倾向或社会性期望；E、N、P是人格维度量表。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-82","ch":1,"no":82,"t":"s","g":null,"stem":"大五人格模型中，反映个体对待他人的态度，如信任、利他、顺从等的维度是 ( )","o":[["A","外倾性"],["B","宜人性"],["C","尽责性"],["D","开放性"],["E","神经质"]],"ans":"B","k":[1],"exp":"宜人性评估个体的人际取向，涉及是否乐于助人、信任他人、合作顺从等。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-83","ch":1,"no":83,"t":"s","g":null,"stem":"大五人格模型中，反映个体情绪稳定性的维度是 ( )","o":[["A","外倾性"],["B","宜人性"],["C","尽责性"],["D","开放性"],["E","神经质"]],"ans":"E","k":[4],"exp":"神经质反映个体的情绪稳定性，高分者容易焦虑、抑郁、情绪波动；低分者情绪稳定。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-84","ch":1,"no":84,"t":"s","g":null,"stem":"研究表明，在大五人格中，能够最好地预测个体工作绩效的维度是 ( )","o":[["A","外倾性"],["B","宜人性"],["C","尽责性"],["D","开放性"],["E","神经质"]],"ans":"C","k":[2],"exp":"大量元分析研究表明，尽责性是预测各种职业工作绩效最稳定、最有效的指标。","src":"理论应用，人格心理学→人格特质理论，（熟悉）"},{"id":"2-85","ch":1,"no":85,"t":"m","g":null,"stem":"奥尔波特将个人特质分为 ( )","o":[["A","首要特质"],["B","中心特质"],["C","次要特质"],["D","共同特质"],["E","根源特质"]],"ans":"ABC","k":[0,1,2],"exp":"奥尔波特将特质分为共同特质和个人特质，个人特质又细分为首要、中心和次要特质；D 是另一维度的分类，E是卡特尔的分类。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-86","ch":1,"no":86,"t":"m","g":null,"stem":"卡特尔将根源特质按来源分为 ( )","o":[["A","体质特质"],["B","环境塑造特质"],["C","能力特质"],["D","气质特质"],["E","动力特质"]],"ans":"AB","k":[0,1],"exp":"卡特尔按来源将根源特质分为体质特质（由遗传决定）和环境塑造特质（由环境决\n定）;C、D、E是按功能分类。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-87","ch":1,"no":87,"t":"m","g":null,"stem":"艾森克提出的人格三个基本维度是 ( )","o":[["A","外倾性（E）"],["B","神经质（N）"],["C","精神质（P）"],["D","宜人性（A）"],["E","尽责性（C）"]],"ans":"ABC","k":[0,1,2],"exp":"艾森克的三因素模型是外倾性、神经质和精神质；D、E属于大五人格模型。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-88","ch":1,"no":88,"t":"m","g":null,"stem":"艾森克理论中，精神质（P）得分高的人可能表现出的特征有 ( )","o":[["A","冷漠"],["B","残忍"],["C","固执"],["D","具有很高的同理心"],["E","冲动不计后果"]],"ans":"ABCE","k":[0,1,2,4],"exp":"精神质高分者倾向于孤独、冷漠、残忍、固执和冲动，缺乏同理心和人性化；D是低精神质的表现。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-89","ch":1,"no":89,"t":"m","g":null,"stem":"大五人格模型（OCEAN）包括的维度有 ( )","o":[["A","开放性"],["B","尽责性"],["C","外倾性"],["D","宜人性"],["E","神经质"]],"ans":"ABCDE","k":[0,1,2,3,4],"exp":"大五人格模型包括开放性、尽责性、外倾性、宜人性和神经质，缩写为OCEAN。","src":"理论观点，人格心理学→人格特质理论，（掌握）"},{"id":"2-90","ch":1,"no":90,"t":"m","g":null,"stem":"五因素模型在实践中的应用领域包括 ( )","o":[["A","临床心理评估"],["B","职业选拔与指导"],["C","婚姻咨询与匹配"],["D","脑外科手术定位"],["E","基因工程育种"]],"ans":"ABC","k":[0,1,2],"exp":"大五人格在临床、职场和婚恋等领域有广泛应用；D、E属于医学和生物学领域。","src":"理论应用，人格心理学→人格特质理论，（熟悉）"},{"id":"2-91","ch":1,"no":91,"t":"s","g":null,"stem":"凯利认为，当一个人的建构系统无法预测事件时，他体验到的情绪是 ( )","o":[["A","焦虑"],["B","恐惧"],["C","威胁"],["D","攻击"],["E","内疚"]],"ans":"A","k":[0],"exp":"凯利认为，焦虑是因为个体发现自己的建构系统无法预测即将发生的事件；威胁是核心建构将发生重大改变；恐惧是遇到新的建构。","src":"理论观点，人格心理学→认知理论，（掌握）"},{"id":"2-92","ch":1,"no":92,"t":"s","g":null,"stem":"凯利提出，个体在进行决策时，会经历三个阶段：审视、先取和控制，这被称为 ( )","o":[["A","CPC循环"],["B","自我效能循环"],["C","归因循环"],["D","认知失调循环"],["E","建构循环"]],"ans":"A","k":[0],"exp":"CPC循环是凯利理论中的核心决策过程，C代表审视，P代表先取，C代表控制。","src":"理论观点，人格心理学一认知理论，（掌握）"},{"id":"2-93","ch":1,"no":93,"t":"s","g":null,"stem":"凯利设计的角色建构库测验（REP测验），其主要目的是 ( )","o":[["A","测量个体的智力水平"],["B","评估个体的防御机制"],["C","揭示个体的建构系统"],["D","诊断精神疾病"],["E","测量潜意识冲动"]],"ans":"C","k":[2],"exp":"REP测验通过比较角色人物的异同，来提取和揭示个体用来解释世界的个人建构系统。","src":"理论应用，人格心理学→认知理论，（熟悉）"},{"id":"2-94","ch":1,"no":94,"t":"s","g":null,"stem":"罗特认为，个体对自己行为结果的期待，是取决于自己的行为还是由外部力量决定，这种泛化期待被称为 ( )","o":[["A","自我效能感"],["B","控制点"],["C","预期价值"],["D","心理控制源"],["E","归因风格"]],"ans":"B","k":[1],"exp":"控制点是罗特理论的核心概念，分为内控（相信自己能控制结果）和外控（相信运气等外部因素控制结果）。","src":"罗特的社会认知理论，人格心理学→认知理论，（熟悉）"},{"id":"2-95","ch":1,"no":95,"t":"s","g":null,"stem":"班杜拉认为，个体对自己能否成功完成某项任务的主观判断和信心被称为 ( )","o":[["A","结果期待"],["B","效能期待"],["C","控制点"],["D","自我强化"],["E","替代强化"]],"ans":"B","k":[1],"exp":"效能期待（自我效能感）是对自身能力的信心；结果期待是对行为能否导致某种结果的判断。","src":"班杜拉的社会认知理论，人格心理学→认知理论，（熟悉）"},{"id":"2-96","ch":1,"no":96,"t":"s","g":null,"stem":"米歇尔提出，个体在特定情境中的行为变异，是由其内部的认知-情感单元（CAU）与情境特征的交互作用决定的，下列不属于CAU的是 ( )","o":[["A","编码和类别"],["B","期望和信念"],["C","情感"],["D","基因序列"],["E","自我调节计划"]],"ans":"D","k":[3],"exp":"认知-情感单元包括编码、期望信念、情感、目标和价值观、自我调节计划和能力；基因序列属于生理层面，不属于认知情感单元。","src":"米歇尔的社会认知理论，人格心理学→认知理论，（熟悉）"},{"id":"2-97","ch":1,"no":97,"t":"m","g":null,"stem":"凯利的个人建构理论的基本假设和推论认为 ( )","o":[["A","人是科学家"],["B","建构具有两极性"],["C","建构是为了预测事件"],["D","人格是由潜意识驱力决定的"],["E","每个人都拥有独特的建构系统"]],"ans":"ABCE","k":[0,1,2,4],"exp":"凯利认为人是科学家，用两极的建构来预测事件，且建构系统因人而异；D是弗洛伊德的观点，凯利反对潜意识动力说。","src":"理论观点，人格心理学→认知理论，（掌握）"},{"id":"2-98","ch":1,"no":98,"t":"m","g":null,"stem":"凯利的固定角色疗法要求来访者 ( )","o":[["A","扮演一个与自己性格完全不同的人"],["B","严格按照新角色的剧本生活"],["C","在现实生活中放弃旧的自我"],["D","尝试新的建构方式"],["E","深入挖掘童年创伤"]],"ans":"ABD","k":[0,1,3],"exp":"固定角色疗法让来访者扮演一个虚构角色，按剧本行动，目的是尝试新的建构方式，而非直接要求完全放弃旧自我，也不涉及童年创伤挖掘。","src":"理论应用，人格心理学→认知理论，（熟悉）"},{"id":"2-99","ch":1,"no":99,"t":"m","g":null,"stem":"罗特指出，个体在某一特定情境中表现出某种行为的可能性取决于 ( )","o":[["A","行为潜能"],["B","期望"],["C","强化值"],["D","强化概率"],["E","潜意识冲突"]],"ans":"ABC","k":[0,1,2],"exp":"罗特的行为潜能公式：BP=f(EQRV)，行为潜能是期望和强化值的函数；D是期望的依据，E不属于此公式。","src":"罗特的社会认知理论，人格心理学→认知理论，（熟悉）"},{"id":"2-100","ch":1,"no":100,"t":"m","g":null,"stem":"班杜拉提出的交互决定论认为，心理功能是由哪些因素交互决定的？","o":[["A","内部因素（认知、情感）"],["B","行为"],["C","外部环境"],["D","潜意识驱力"],["E","集体潜意识"]],"ans":"ABC","k":[0,1,2],"exp":"交互决定论认为，个体内部因素、行为和外部环境三者是相互决定、双向互动的关系；\nD、E不属于班杜拉理论。","src":"班杜拉的社会认知理论，人格心理学→认知理论，（熟悉）"},{"id":"2-101","ch":1,"no":101,"t":"m","g":null,"stem":"米歇尔的认知-情感系统理论（CAPS）认为 ( )","o":[["A","人格具有跨情境的稳定性"],["B","人格在不同情境中表现出变异性"],["C","行为是CAU与情境交互的结果"],["D","特质可以独立于情境存在"],["E","人格差异在于CAU网络的激活模式不同"]],"ans":"ABCE","k":[0,1,2,4],"exp":"CAPS理论强调情境与CAU的交互，认为特质不是独立存在的（D错），稳定的人格结构产生跨情境的稳定性和特定情境的变异性。","src":"米歇尔的社会认知理论，人格心理学→认知理论，（熟悉）"},{"id":"3-1","ch":2,"no":1,"t":"s","g":null,"stem":"社会心理学与日常常识的根本区别在于 ( )","o":[["A","常识只关注个体，社会心理学只关注群体"],["B","常识是不可证伪的，社会心理学强调可证伪的实证检验"],["C","常识来源于经验，社会心理学来源于理论推导"],["D","社会心理学总是与常识的结论相反"],["E","常识具有跨文化一致性，社会心理学只适用于特定文化"]],"ans":"B","k":[1],"exp":"常识往往包含许多“后见之明”且相互矛盾（如“人多力量大”与“人多手杂”），具有不可证伪性；而科学的社会心理学必须提出可检验的假设，通过实证数据进行证伪或证实。","src":"社会心理学与常识的关系，社会心理学→社会心理学概论，（了解）"},{"id":"3-2","ch":2,"no":2,"t":"s","g":null,"stem":"在社会心理学的两种主要研究取向中，关注“群体规范如何影响个体偏离行为”的研究更可能属于 ( )","o":[["A","心理学的取向"],["B","社会学的取向"],["C","生物学的取向"],["D","文化人类学的取向"],["E","进化心理学的取向"]],"ans":"B","k":[1],"exp":"心理学取向侧重个体的内在过程和个体差异，而社会学取向更侧重于社会结构、群体互动、群体规范等宏观社会环境对个体行为的约束和影响。关注群体规范对偏离行为的影响属于社会学取向的典型视角。","src":"社会心理学的两种取向，社会心理学→社会心理学概论，（熟悉）"},{"id":"3-3","ch":2,"no":3,"t":"s","g":null,"stem":"在社会心理学的理解层次中，“两人之间的互动如何受彼此吸引力影响”属于哪个层次的问题 ( )","o":[["A","个体水平"],["B","人际水平"],["C","群体水平"],["D","社会文化水平"],["E","物种进化水平"]],"ans":"B","k":[1],"exp":"人际水平关注两人或小群体之间的互动过程，如吸引力、沟通、亲密关系等。个体水平关注个人内在过程，群体水平关注大群体内的互动。","src":"社会心理学理解人类行为的层次，社会心理学→社会心理学概论，（了解）"},{"id":"3-4","ch":2,"no":4,"t":"c","g":null,"stem":"根据社会学习理论，个体不仅通过直接经验学习，还能通过观察他人的行为后果进行学习。这种机制被称为 ( )","o":[["A","强化"],["B","惩罚"],["C","替代性强化"],["D","经典条件反射"],["E","操作性条件反射"]],"ans":"C","k":[2],"exp":"班杜拉的社会学习理论提出，观察者因看到榜样的行为受到奖励（或惩罚）而增加（或减少）自己做出同样行为的倾向，这被称为替代性强化（或替代性惩罚）。","src":"学习理论，社会心理学→社会心理学概论，（掌握）"},{"id":"3-5","ch":2,"no":5,"t":"c","g":null,"stem":"某公司员工在得知年终奖减少后，纷纷选择消极怠工而不是与管理层沟通。从诱因理论的角度看，员工做出这一行为决策是因为他们认为 ( )","o":[["A","消极怠工符合群体规范"],["B","消极怠工的收益超过了可能受到的惩罚成本"],["C","他们对工作本身失去了内在兴趣"],["D","他们的行为是观察学习的结果"],["E","他们的认知失调导致了态度改变"]],"ans":"B","k":[1],"exp":"诱因理论强调行为的理性决策，即个体会权衡行为的收益与成本。员工选择消极怠工，是因为在他们的计算中，怠工带来的情绪发泄（收益）大于可能受到的轻微处罚（成本）。","src":"诱因理论，社会心理学→社会心理学概论，（掌握）"},{"id":"3-6","ch":2,"no":6,"t":"s","g":null,"stem":"关于角色理论，下列说法错误的是 ( )","o":[["A","角色是指与特定社会地位相一致的行为期望"],["B","个体在不同社会情境中扮演不同角色"],["C","角色期望完全来自于个体的内在需求"],["D","角色冲突可能发生在同一时间被期望扮演不同角色时"],["E","角色理论强调社会结构对行为的规范作用"]],"ans":"C","k":[2],"exp":"角色期望主要来自于社会规范、群体共识和特定地位的要求，而非仅仅来自个体的内在需求。C选项表述错误。","src":"角色理论，社会心理学→社会心理学概论，（熟悉）"},{"id":"3-7","ch":2,"no":7,"t":"c","g":null,"stem":"某研究者在不知情的情况下，记录了社区广场上居民自发形成的排队规则和站位距离。这种研究方法属于 ( )","o":[["A","实验法"],["B","调查法"],["C","观察法"],["D","档案研究"],["E","元分析"]],"ans":"C","k":[2],"exp":"观察法是指在自然情境中对个体的行为进行系统观察和记录，而不进行任何干预。研究者在不知情（非干预）的情况下记录自然行为，属于观察法。","src":"观察法，社会心理学→社会心理学概论，（了解）"},{"id":"3-8","ch":2,"no":8,"t":"c","g":null,"stem":"某研究者为了评估“观看暴力节目与攻击行为”的关系，收集了过去十年某地区电视暴力节目播出时长与同期暴力犯罪率的官方统计数据进行分析。这种方法是 ( )","o":[["A","调查法"],["B","实验法"],["C","观察法"],["D","档案研究"],["E","元分析"]],"ans":"D","k":[3],"exp":"档案研究是利用现有的官方记录、统计资料、历史文献等（档案）来检验假设的研究方法。利用官方犯罪率和播出时长数据属于典型的档案研究。","src":"档案研究，社会心理学→社会心理学概论，（了解）"},{"id":"3-9","ch":2,"no":9,"t":"m","g":null,"stem":"社会心理学发展历程中，标志着其在20世纪30-50年代进入制度化阶段的重要事件包括( )","o":[["A","最早的社会心理学教科书出版"],["B","《人格与社会心理学杂志》创刊"],["C","社会问题心理学研究会的成立"],["D","勒温关于群体动力学的开创性研究"],["E","特里普利特关于社会促进的首次实验"]],"ans":"BCD","k":[1,2,3],"exp":"B、C、D均发生在20世纪30-50年代，标志着社会心理学组织、期刊和研究领域的制度化。A最早由罗斯和麦独孤在1908年出版；E发生在1898年，是首次实验但不在制度化阶段。","src":"社会心理学的发展历程，社会心理学→社会心理学概论，（了解）"},{"id":"3-10","ch":2,"no":10,"t":"m","g":null,"stem":"下列关于诱因理论的说法，正确的有 ( )","o":[["A","强调行为的理性计算过程"],["B","认为人类行为总是追求效用最大化"],["C","能够很好地解释习惯性行为"],["D","忽视了行为的内在动机"],["E","又称理性选择理论"]],"ans":"ABDE","k":[0,1,3,4],"exp":"诱因理论（理性选择理论）假设人是理性的，会权衡成本与收益以实现效用最大化，但它难以解释那些不需要深思熟虑的习惯性行为，且常被批评忽视了内在动机。故C错误。","src":"诱因理论，社会心理学→社会心理学概论，（掌握）"},{"id":"3-11","ch":2,"no":11,"t":"m","g":null,"stem":"社会认同理论的核心观点认为，个体通过社会分类、群体认同和群体比较来建立社会认\n同。为了维持积极的自我概念，个体倾向于 ( )","o":[["A","将自己所属群体（内群体）评价得比外群体更好"],["B","在群体比较中寻找积极差异"],["C","尽可能脱离原有的社会群体"],["D","采用群体内偏祖效应"],["E","消除群体间的所有差异"]],"ans":"ABD","k":[0,1,3],"exp":"根据社会认同理论，个体追求积极的社会认同，表现为D选项群体内偏祖、B选项在比较中寻找内群体的优势，从而将A选项内群体评价得更高。C选项和E选项与寻求积极认同的策略不符。","src":"社会认同理论，社会心理学→社会心理学概论，（了解）"},{"id":"3-12","ch":2,"no":12,"t":"m","g":null,"stem":"调查法是社会心理学常用的方法，其主要局限包括 ( )","o":[["A","难以确定因果关系"],["B","难以获得大样本数据"],["C","容易受社会赞许性效应影响"],["D","调查结果的推广性受抽样方法限制"],["E","无法对态度进行量化测量"]],"ans":"ACD","k":[0,2,3],"exp":"调查法的局限在于无法揭示因果关系（A)，自我报告容易受社会赞许性影响（C)，且抽样偏差会影响结果推广（D）。调查法容易获得大样本（B错），且可以对态度进行量化（E 错）。","src":"调查法，社会心理学→社会心理学概论，（掌握）"},{"id":"3-13","ch":2,"no":13,"t":"m","g":null,"stem":"元分析在社会心理学研究中的优势体现在 ( )","o":[["A","能够综合评估已有研究的效果量"],["B","能够发现单一研究无法察觉的微小效应"],["C","能够完全消除发表偏差的影响"],["D","能够解决研究间的异质性问题"],["E","能够替代新的原始实验研究"]],"ans":"AB","k":[0,1],"exp":"元分析通过统计整合多项研究结果，能有效评估整体效果量并发现微小效应。但它无法完全消除发表偏差（只发表显著结果的研究），也不能直接解决异质性或替代新的实验研究。","src":"元分析，社会心理学→社会心理学概论，（了解）"},{"id":"3-14","ch":2,"no":14,"t":"s","g":null,"stem":"人们在处理社会信息时，往往倾向于采用节省认知资源的方式，这被称为“认知吝啬鬼”。下列现象中，最能体现这一倾向的是 ( )","o":[["A","仔细核对合同条款"],["B","依据图式填补缺失信息"],["C","进行复杂的成本收益分析"],["D","寻找反面证据反驳自己的观点"],["E","对每个陌生人的动机进行深度剖析"]],"ans":"B","k":[1],"exp":"认知吝啬鬼指人们倾向于寻找最省力的方式处理信息。利用图式自动填补缺失信息是一种无需深思熟虑的快捷方式，体现了认知吝啬。","src":"分类，社会心理学→社会认知，（掌握）"},{"id":"3-15","ch":2,"no":15,"t":"c","g":null,"stem":"当一个人刚刚经历了一场激烈的争吵，情绪激动，此时如果让他判断一张模糊照片中人物的表情，他更可能将照片中的人物判断为 ( )","o":[["A","悲伤的"],["B","高兴的"],["C","愤怒的"],["D","平静的"],["E","惊讶的"]],"ans":"C","k":[2],"exp":"这体现了情绪一致性效应或启动效应。个体的当前情绪状态会作为图式启动，影响其对模糊信息的解释和提取，因此容易将模糊表情判断为与自己情绪一致的“愤怒”。","src":"图式，社会心理学→社会认知，（熟悉）"},{"id":"3-16","ch":2,"no":16,"t":"s","g":null,"stem":"个体对自己是否有能力完成某一特定任务的信念被称为 ( )","o":[["A","自尊"],["B","自我效能"],["C","自我控制"],["D","自我觉知"],["E","体像"]],"ans":"B","k":[1],"exp":"自我效能是班杜拉提出的概念，指个体对自己组织和执行达成特定目标所需行为的能力的信心或信念。","src":"自我觉知、自我效能与体像，社会心理学一社会认知，（掌握）"},{"id":"3-17","ch":2,"no":17,"t":"s","g":null,"stem":"个体试图控制别人对自己形成印象的过程，被称为 ( )","o":[["A","自我障碍"],["B","自我控制"],["C","自我表演（印象管理）"],["D","自我觉知"],["E","自我图式"]],"ans":"C","k":[2],"exp":"自我表演（印象管理）是指个体在他人面前展示自己，以控制他人对自己形成特定印象的过程。","src":"自尊、自我控制与自我表演，社会心理学→社会认知，（熟悉）"},{"id":"3-18","ch":2,"no":18,"t":"c","g":null,"stem":"小李在一次重要的公开演讲中表现糟糕，他告诉朋友那天自己重感冒，声音根本发不出来。小李的这种解释最可能是为了 ( )","o":[["A","准确描述客观事实"],["B","进行自我障碍"],["C","体现自我效能"],["D","进行自我觉知"],["E","习得性无助"]],"ans":"B","k":[1],"exp":"自我障碍是指个体在表现情境中，为了保护自尊免受潜在失败打击，而提前为自己制造借口或设置障碍的行为。小李提前声明感冒，是在为可能的失败找借口，属于自我障碍。","src":"自我障碍与自证预言，社会心理学→社会认知，（熟悉）"},{"id":"3-19","ch":2,"no":19,"t":"c","g":null,"stem":"某校老师被告知某些学生是“天才”，尽管这些学生是随机抽取的，但一年后这些学生的智商真的显著提高了。这属于 ( )","o":[["A","晕轮效应"],["B","自我实现预言"],["C","自我障碍"],["D","确认偏差"],["E","行动者-观察者偏差"]],"ans":"B","k":[1],"exp":"自我实现预言（自证预言）指期望影响行为，最终导致期望成为现实。老师对学生的期望（天才）改变了老师对待学生的方式，从而真正提高了学生的表现。","src":"自我障碍与自证预言，社会心理学→社会认知，（熟悉）"},{"id":"3-20","ch":2,"no":20,"t":"c","g":null,"stem":"在阿希的印象形成实验中，当描述一个人是“聪明的、勤奋的、冲动的、批判的、固执的、嫉妒的”时，被试大多对他形成负面印象；而如果顺序反过来，先描述“嫉妒的、固执的”等，再描述“聪明的”，被试则形成正面印象。这证明了 ( )","o":[["A","近因效应"],["B","首因效应"],["C","晕轮效应"],["D","刻板印象"],["E","虚假一致效应"]],"ans":"B","k":[1],"exp":"阿希的实验表明，先出现的信息（首因）在印象形成中占据了主导地位，改变了后续信息的解释方向，这证明了首因效应的存在。","src":"第一印象与整体印象，社会心理学→社会认知，（掌握）"},{"id":"3-21","ch":2,"no":21,"t":"c","g":null,"stem":"王某在评价自己的成功时，往往归因于能力强；而在评价他人成功时，则更可能归因于运气好。这种现象属于","o":[["A","基本归因错误"],["B","行动者-观察者偏差"],["C","自利偏差"],["D","虚假一致效应"],["E","确认偏差"]],"ans":"C","k":[2],"exp":"自利偏差（自我服务偏差）是指个体倾向于把成功归因于内部因素（如能力），把失败归因于外部因素（如运气）。王某的表现符合自利偏差。","src":"印象形成中的偏差，社会心理学→社会认知，（熟悉）"},{"id":"3-22","ch":2,"no":22,"t":"s","g":null,"stem":"海德的归因理论认为，人们在归因时遵循的一个基本原则是","o":[["A","最大化共变原则"],["B","折扣原则"],["C","协变原则"],["D","对应推论原则"],["E","一致性原则"]],"ans":"B","k":[1],"exp":"海德在归因理论中提出了折扣原则，即如果存在其他看起来合理的原因，某一特定原因在引发某一特定结果上的作用就会被折扣或减弱。A、C、D分别是凯利、凯利、琼斯的理论核心。","src":"海德的归因理论，社会心理学→社会认知，（掌握）"},{"id":"3-23","ch":2,"no":23,"t":"s","g":null,"stem":"根据艾布拉姆森的归因风格理论，当一个人将失败归因为“我总是做不好任何事”时，这种归因属于 ( )","o":[["A","内部的、稳定的、普遍的"],["B","外部的、不稳定的、特定的"],["C","内部的、不稳定的、普遍的"],["D","外部的、稳定的、特定的"],["E","内部的、稳定的、特定的"]],"ans":"A","k":[0],"exp":"“我总是做不好”指向自身（内部），具有时间上的持久性（稳定），且泛化到所有事情上（普遍），属于内部的、稳定的、普遍的归因，这种风格容易导致抑郁。","src":"艾布拉姆森的归因风格理论，社会心理学→社会认知，（掌握）"},{"id":"3-24","ch":2,"no":24,"t":"s","g":null,"stem":"琼斯和戴维斯的对应推论理论认为，当个体的行为是时，我们最可能将行为归因于其内在特质。  ( )","o":[["A","符合社会角色期望"],["B","具有高选择性且产生非共同效应"],["C","由情境压力强迫产生"],["D","不随时间变化"],["E","符合社会赞许性"]],"ans":"B","k":[1],"exp":"对应推论理论认为，当行为具有高自由选择性，且产生了独特的结果（非共同效应）\n时，我们倾向于认为该行为反映了个体真实的内在特质。A、C、E会降低对应推论的可能性。","src":"琼斯和戴维斯的对应推论理论，社会心理学→社会认知，（熟悉）"},{"id":"3-25","ch":2,"no":25,"t":"s","g":null,"stem":"沙赫特的情绪归因理论认为，情绪体验是由哪两个因素共同决定的 ( )","o":[["A","生理唤醒和认知标签"],["B","刺激强度和反应时"],["C","本能需要和满足程度"],["D","内驱力和诱因"],["E","意志努力和任务难度"]],"ans":"A","k":[0],"exp":"沙赫特的情绪两因素理论认为，情绪是生理唤醒和认知标签（对唤醒原因的解释）共同作用的结果。","src":"沙赫特的情绪归因理论，社会心理学→社会认知，（了解）"},{"id":"3-26","ch":2,"no":26,"t":"m","g":null,"stem":"图式对社会认知的影响具有两面性，其积极作用包括 ( )","o":[["A","加快信息加工速度"],["B","填补信息缺失以维持认知连贯性"],["C","导致记忆扭曲，记住符合图式的信息"],["D","帮助个体对模糊情境做出迅速解释"],["E","阻碍新信息的精细加工"]],"ans":"ABD","k":[0,1,3],"exp":"图式的积极作用在于提高效率（A）、填补空白（B）和辅助解释（D）。C和E属于图式的消极影响（导致偏差和固着）。","src":"图式，社会心理学→社会认知，（熟悉）"},{"id":"3-27","ch":2,"no":27,"t":"m","g":null,"stem":"关于自我障碍和自证预言，下列说法正确的有","o":[["A","两者都是为了保护自尊"],["B","自我障碍是事前制造借口，自证预言是期望导致行为改变"],["C","自我障碍可能导致表现更差"],["D","自证预言只能产生积极影响"],["E","两者的目的都在于避免失败的负面归因"]],"ans":"BCE","k":[1,2,4],"exp":"自我障碍是为了在失败时避免归因于能力差（E)，自证预言是期望影响行为导致结果验证（B）。自我障碍因为分心或放弃努力确实可能导致表现更差（C）。自证预言既有积极（皮格马利翁效应）也有消极（如偏见导致敌意）,D错。","src":"自我障碍与自证预言，社会心理学→社会认知，（熟悉）"},{"id":"3-28","ch":2,"no":28,"t":"m","g":null,"stem":"印象形成的线索主要来源于哪些非言语信息 ( )","o":[["A","面部表情"],["B","目光接触"],["C","身体姿态与手势"],["D","过去的学业成绩单"],["E","言语内容的逻辑性"]],"ans":"ABC","k":[0,1,2],"exp":"非言语线索主要包括面部表情、目光接触、身体姿态和手势等。D属于文字档案，E属于言语内容，不属于非言语线索。","src":"印象形成的线索，社会心理学→社会认知，（熟悉）"},{"id":"3-29","ch":2,"no":29,"t":"m","g":null,"stem":"在印象形成中，常见的认知偏差包括 ( )","o":[["A","晕轮效应"],["B","虚假一致效应"],["C","负性效应（负面权重更大）"],["D","基本归因错误"],["E","证实偏差"]],"ans":"ABCE","k":[0,1,2,4],"exp":"基本归因错误属于归因偏差，而非印象形成过程中的偏差。晕轮效应、虚假一致效应、负性效应和证实偏差都属于印象形成或信息加工过程中的偏差。","src":"印象形成中的偏差，社会心理学→社会认知，（熟悉）"},{"id":"3-30","ch":2,"no":30,"t":"m","g":null,"stem":"关于基本归因错误，下列表述正确的有","o":[["A","指在解释他人行为时，高估内在特质而低估情境影响的倾向"],["B","在集体主义文化中比个人主义文化中更明显"],["C","又称对应偏差"],["D","观察者视角容易出现，而行动者自身不易出现"],["E","产生原因之一是知觉显著性（人比情境更显眼）"]],"ans":"ACDE","k":[0,2,3,4],"exp":"基本归因错误在个人主义文化（如西方）中比集体主义文化（如东方）更明显，B错。ACDE均是对基本归因错误的正确描述。","src":"印象形成中的偏差，社会心理学→社会认知，（熟悉）"},{"id":"3-31","ch":2,"no":31,"t":"m","g":null,"stem":"根据维纳的归因理论，影响成就动机的归因维度包括","o":[["A","部位（内／外源）"],["B","稳定性"],["C","可控性"],["D","普遍性"],["E","特异性"]],"ans":"ABC","k":[0,1,2],"exp":"维纳的三维归因模型包括部位（内／外）、稳定性（稳定／不稳定）和可控性（可控／不可控）。普遍性和特异性是其他归因理论的维度。","src":"维纳的归因理论，社会心理学→社会认知，（熟悉）"},{"id":"3-32","ch":2,"no":32,"t":"m","g":null,"stem":"凯利的三维归因理论认为，人们在归因时需要收集的信息维度包括 ( )","o":[["A","区别性"],["B","一致性"],["C","一贯性"],["D","稳定性"],["E","可控性"]],"ans":"ABC","k":[0,1,2],"exp":"凯利的三维归因理论的三个维度是区别性、一致性和一贯性。稳定性和可控性是维纳理论的维度。","src":"凯利的归因理论，社会心理学→社会认知，（熟悉）"},{"id":"3-33","ch":2,"no":33,"t":"m","g":null,"stem":"根据贝姆的自我知觉理论，个体在何种情况下会通过观察自己的行为来推断自己的态度( )","o":[["A","内在态度微弱或模糊时"],["B","行为是在强烈的外部诱因驱动下发生时"],["C","行为是自愿选择且没有明显外部奖励时"],["D","个体处于情绪高度激动的状态"],["E","个体缺乏已有态度图式时"]],"ans":"ACE","k":[0,2,4],"exp":"自我知觉理论认为，当内部线索微弱、模糊（A）或缺乏已有态度（E）时，个体才会像观察别人一样观察自己的自愿行为（C）来推断态度。如果有强烈外部诱因（B）或高唤醒情绪（D)，则不会归因于自身态度。","src":"贝姆的自我知觉理论，社会心理学→社会认知，（了解）"},{"id":"3-34","ch":2,"no":34,"t":"k","g":"3-0","stem":"她在会议上假装听不懂、故意犯错，这种保护自己免受孤立的自我策略称为 ( )","o":[["A","自我障碍"],["B","自我设限"],["C","自证预言"],["D","自我表演"],["E","体像防御"],["F","自我贬低"]],"ans":"B","k":[1],"exp":"自我设限是指个体故意在自己前进的道路上寻找或设置障碍，以便在表现不佳时能够将失败归因于这些障碍，从而保护自我价值感（如避免被孤立）。","src":"对自我的认识，社会心理学→社会认知，（熟悉）"},{"id":"3-35","ch":2,"no":35,"t":"k","g":"3-0","stem":"她将成功归因于运气，而将同事的错误归因于态度一贯不认真，这种归因偏差称为 ( )","o":[["A","基本归因错误"],["B","行动者-观察者效应"],["C","自我服务偏差"],["D","折扣原则"],["E","扩大原则"],["F","显著性效应"]],"ans":"A","k":[0],"exp":"基本归因错误是指人们在解释他人行为时，倾向于高估内部特质因素，低估外部情境因素（认为同事一贯态度差）；而解释自己行为时则相反（自己成功是运气等外部因素，这同时也体现了自我服务偏差，但针对同事的判断是典型的基本归因错误）。","src":"归因与归因理论，社会心理学→社会认知，（熟悉）"},{"id":"3-36","ch":2,"no":36,"t":"k","g":"3-0","stem":"她觉得主管会刁难自己，结果表现防御导致主管反感，这属于 ( )","o":[["A","刻板印象"],["B","自证预言"],["C","光环效应"],["D","首因效应"],["E","近因效应"],["F","对比效应"]],"ans":"B","k":[1],"exp":"自证预言是指个体对情境的最初错误信念引发了新的行为，使得原本错误的信念变为现实。她的防御行为促使了主管的反感，验证了她最初的“预感”。","src":"对自我的认识，社会心理学→社会认知，（熟悉）"},{"id":"3-37","ch":2,"no":37,"t":"k","g":"3-0","stem":"如果运用凯利的归因理论来分析她认为“同事一贯态度不认真”的归因过程，她可能获得了哪些信息？","o":[["A","区别性低（该同事在其他任务上也粗心）"],["B","一致性高（其他同事也认为此人态度差）"],["C","一贯性高（该同事以前也经常粗心）"],["D","区别性高（该同事只在这次任务上粗心）"],["E","一致性低（其他同事不认为此人态度差）"],["F","一贯性低（该同事以前不粗心）"]],"ans":"ABC","k":[0,1,2],"exp":"根据凯利的协变模型，当区别性低、一致性高、一贯性高时，人们倾向于做出内部归因（即归因于该同事的个人特质）。","src":"归因与归因理论，社会心理学→社会认知，（熟悉）"},{"id":"3-38","ch":2,"no":38,"t":"k","g":"3-0","stem":"她关于“表现得聪明就会被孤立”的认知结构，属于社会认知中的图式，图式的功能包括( )","o":[["A","节省认知资源"],["B","帮助记忆"],["C","影响情绪反应"],["D","自动引导行为"],["E","完全客观地反映现实"],["F","排斥新信息"]],"ans":"ABCD","k":[0,1,2,3],"exp":"图式是认知框架，具有组织、记忆、引导注意和行为的功效，但它具有主观性，会过滤和扭曲信息，并非完全客观（E错），也不绝对排斥新信息（F错）。","src":"基本概念，社会心理学→社会认知，（熟悉）"},{"id":"3-39","ch":2,"no":39,"t":"c","g":null,"stem":"某品牌为了推销一款新型香水，在广告中请了当红明星代言，并展示其迷人的微笑和优雅气质。该广告利用了态度的哪种心理功能 ( )","o":[["A","效用功能"],["B","知识功能"],["C","价值表达功能"],["D","自我防御功能"],["E","评价功能"]],"ans":"A","k":[0],"exp":"效用功能（工具性功能）指态度帮助人们获得奖励或避免惩罚。明星代言暗示使用该产品能获得社会赞赏或吸引力，属于效用功能的利用。","src":"态度的定义与心理功能，社会心理学→社会态度，（掌握）"},{"id":"3-40","ch":2,"no":40,"t":"c","g":null,"stem":"某人声称自己非常关心环保，但在日常生活中却经常使用一次性餐具。根据态度与行为关系的理论，下列哪种情况最可能导致其行为与态度一致 ( )","o":[["A","他在公开场合表达环保态度"],["B","环保行为需要付出很大代价"],["C","他的环保态度是基于直接经验形成的，且自我意识强"],["D","社会上大多数人都不环保"],["E","他的态度只是随口一说，没有经过深思熟虑"]],"ans":"C","k":[2],"exp":"态度预测行为的条件包括：态度是基于直接经验形成的；态度的特异性高；态度强烈且自我意识强；态度与行为的时间间隔短等。C选项满足了关键条件。","src":"态度与行为，社会心理学→社会态度，（了解）"},{"id":"3-41","ch":2,"no":41,"t":"s","g":null,"stem":"计划行为理论认为，决定个体行为意向的核心因素不包括 ( )","o":[["A","行为态度"],["B","主观规范"],["C","知觉行为控制"],["D","过去行为"],["E","以上都是核心因素"]],"ans":"D","k":[3],"exp":"计划行为理论认为行为意向由行为态度、主观规范和知觉行为控制三者共同决定。过去行为不直接作为核心决定因素包含在该理论的核心模型中。","src":"计划行为理论，社会心理学→社会态度，（熟悉）"},{"id":"3-42","ch":2,"no":42,"t":"s","g":null,"stem":"根据海德的平衡理论，P-O-X三者关系为“P喜欢0,P喜欢X，但0讨厌X”，此时P的认知状态属于 ( )","o":[["A","平衡状态"],["B","不平衡状态"],["C","无关状态"],["D","紧张消除状态"],["E","认知失调状态"]],"ans":"B","k":[1],"exp":"海德平衡理论的P-O-X模型中，三个符号的乘积为正时为平衡，为负时为不平衡。\nP(+)0,P(+)X,0(-)X，乘积为（+)x(+)x(-)＝负，属于不平衡状态，会产生心理压力促使态度改变。","src":"平衡理论，社会心理学→社会态度，（了解）"},{"id":"3-43","ch":2,"no":43,"t":"s","g":null,"stem":"在认知失调理论中，如果个体是在很少外部理由的情况下做出了与原有态度相反的行为，为了减少失调，个体最可能采取的方式是 ( )","o":[["A","增加新的协调认知"],["B","改变行为"],["C","改变对行为的认知"],["D","改变原有态度以符合行为"],["E","贬低失调的重要性"]],"ans":"D","k":[3],"exp":"当外部理由不足（如没有足够的奖励或惩罚）时，个体必须内部寻找理由来解释与态度相反的行为，这被称为“不足辩护效应”。此时最典型的反应是改变原有态度，使其与行为一致（D）。","src":"认知失调理论，社会心理学→社会态度，（掌握）"},{"id":"3-44","ch":2,"no":44,"t":"c","g":null,"stem":"某员工因为觉得领导不重视自己，故意拖延项目进度。根据认知失调理论，该员工减少失调的方式是 ( )","o":[["A","改变认知（领导其实很重视我）"],["B","增加协调认知（反正这项目也不重要）"],["C","改变行为（努力工作）"],["D","改变对失调的认知重要性"],["E","改变环境（辞职）"]],"ans":"B","k":[1],"exp":"员工行为（拖延）与态度（想被重视）失调，但他并没有改变行为或对领导的认知，而是通过增加新认知（贬低项目价值）来使拖延行为合理化。","src":"认知失调理论，社会心理学→社会态度，（掌握）"},{"id":"3-45","ch":2,"no":45,"t":"s","g":null,"stem":"在说服的双加工模型中，当个体缺乏动机和能力仔细思考信息时，更容易被哪类说服线索影响 ( )","o":[["A","信息逻辑的严密性"],["B","信息论据的充足度"],["C","信息来源的专业性"],["D","信息的复杂程度"],["E","信息是否涉及核心价值观"]],"ans":"C","k":[2],"exp":"当动机或能力低时，个体走外周路径，依赖于边缘线索（如信息来源的专业性、吸引力等），而非信息内容本身（A、B、D属于中心路径关注的内容）。","src":"说服模型，社会心理学→社会态度，（熟悉）"},{"id":"3-46","ch":2,"no":46,"t":"c","g":null,"stem":"小李昨天听了一个专家关于投资的讲座，觉得毫无道理，但一周后当朋友提起该讲座观点时，小李却表示赞同。这种现象称为 ( )","o":[["A","睡眠效应"],["B","反向说服"],["C","过度辩护效应"],["D","认知失调"],["E","曝光效应"]],"ans":"A","k":[0],"exp":"睡眠效应是指低可信度来源的信息在刚接受时说服力低，但随着时间推移，信息内容与来源分离，其说服力反而升高的现象。","src":"说服者，社会心理学→社会态度，（掌握）"},{"id":"3-47","ch":2,"no":47,"t":"s","g":null,"stem":"在运用恐惧诉求进行说服时（如劝人戒烟），最有效的策略是 ( )","o":[["A","只呈现极度恐惧的后果"],["B","只呈现轻微不适的后果"],["C","唤起中等程度的恐惧，并提供有效可行的行动建议"],["D","唤起极度恐惧，但不提供解决方案，以逼迫对方改变"],["E","不涉及恐惧，只强调吸烟的经济成本"]],"ans":"C","k":[2],"exp":"恐惧诉求研究表明，单纯的极度恐惧可能导致回避或否认，最有效的策略是唤起适度的恐惧，同时必须提供具体可行的解决方案（行动指导），增强个体的控制感。","src":"说服信息，社会心理学→社会态度，（掌握）"},{"id":"3-48","ch":2,"no":48,"t":"s","g":null,"stem":"“登门槛效应”和“低球技术”都是增加顺从的策略，两者的关键区别在于 ( )","o":[["A","前者先提小要求，后者先提大要求"],["B","前者小要求与大要求无关，后者小要求与大要求相关且条件在后加码"],["C","前者基于互惠规范，后者基于一致性原则"],["D","前者用于说服，后者用于改变行为"],["E","前者产生自我认知改变，后者不产生"]],"ans":"B","k":[1],"exp":"登门槛效应是先提小要求，被接受后再提相关大要求；低球技术是先提一个有吸引力的小要求，对方答应后，再揭示该要求的不利方面（加码）。两者的关键区别在于低球技术是同一要求的条件变化，而登门槛是两个不同的要求。","src":"说服对象，社会心理学→社会态度，（掌握）"},{"id":"3-49","ch":2,"no":49,"t":"s","g":null,"stem":"仅仅因为某个人属于某个群体，就对他产生消极的、先入为主的评价，这种态度属于 ( )","o":[["A","偏见"],["B","歧视"],["C","刻板印象"],["D","社会排斥"],["E","侵犯"]],"ans":"A","k":[0],"exp":"偏见是基于群体归属产生的消极态度；歧视是偏见引发的消极行为；刻板印象是对群体的认知概括；社会排斥是行为表现。","src":"偏见的产生与影响，社会心理学→社会态度，（熟悉）"},{"id":"3-50","ch":2,"no":50,"t":"s","g":null,"stem":"为了减少群体间的偏见，让两个敌对群体的成员必须合作完成一项共同目标（如修车），这种干预策略依据的理论是 ( )","o":[["A","接触假设"],["B","再分类（共同内群体认同模型）"],["C","现实冲突理论"],["D","社会学习理论"],["E","群体极化理论"]],"ans":"A","k":[0],"exp":"接触假设指出，在地位平等、有共同目标、有制度支持的条件下，群体间的接触能减少偏见。共同目标是接触假设发挥作用的关键条件之一。","src":"偏见的克服，社会心理学→社会态度，（掌握）"},{"id":"3-51","ch":2,"no":51,"t":"m","g":null,"stem":"态度的心理功能主要包括 ( )","o":[["A","效用功能"],["B","知识功能"],["C","自我防御功能"],["D","价值表达功能"],["E","社会适应功能"]],"ans":"ABCD","k":[0,1,2,3],"exp":"卡茨提出的态度四大心理功能为：效用（工具性）功能、知识功能、自我防御功能和价值表达功能。","src":"态度的定义与心理功能，社会心理学→社会态度，（掌握）"},{"id":"3-52","ch":2,"no":52,"t":"m","g":null,"stem":"在态度的测量方法中，下列属于间接测量方法的有 ( )","o":[["A","李克特量表"],["B","语义差异量表"],["C","反应时测量"],["D","生理指标测量"],["E","行为观察法"]],"ans":"CDE","k":[2,3,4],"exp":"直接测量要求被试自我报告，如李克特量表和语义差异量表（A、B错）。间接测量不依赖自我报告，如反应时测量（IAT）、生理指标测量和行为观察法。","src":"态度测量，社会心理学→社会态度，（熟悉）"},{"id":"3-53","ch":2,"no":53,"t":"m","g":null,"stem":"根据计划行为理论，主观规范受哪些因素影响 ( )","o":[["A","个体对特定行为的信念"],["B","个体感知到的社会压力"],["C","个体遵从重要他人期望的动机"],["D","个体完成行为的能力感知"],["E","个体对行为结果的评价"]],"ans":"BC","k":[1,2],"exp":"主观规范是指个体感知到的社会压力，它取决于个体感知到的重要他人期望以及个体遵从这些期望的动机。","src":"计划行为理论，社会心理学→社会态度，（熟悉）"},{"id":"3-54","ch":2,"no":54,"t":"m","g":null,"stem":"关于认知失调理论，下列说法正确的有 ( )","o":[["A","认知失调是一种令人不愉快的紧张状态"],["B","只要存在认知不一致，就会产生强烈的失调感"],["C","个体通常会采取最省力的方式来减少失调"],["D","不足辩护效应是认知失调理论的重要推论"],["E","选择前的冲突也会产生失调"]],"ans":"ACDE","k":[0,2,3,4],"exp":"认知不一致必须达到一定程度，且涉及自我概念时才会产生强烈的失调感（B错）。A、\nC、D、E均是对认知失调理论的正确描述（E指决策后失调）。","src":"认知失调理论，社会心理学→社会态度，（掌握）"},{"id":"3-55","ch":2,"no":55,"t":"m","g":null,"stem":"影响说服效果的说服对象（被说服者）因素包括 ( )","o":[["A","人格特征（如自尊、智力）"],["B","心理卷入度"],["C","先前态度的承诺"],["D","心情和情绪状态"],["E","信息的呈现方式"]],"ans":"ABCD","k":[0,1,2,3],"exp":"说服对象因素包括其人格特征、卷入度、原有态度承诺、心情等。信息的呈现方式属于说服信息因素（E错）。","src":"说服对象，社会心理学→社会态度，（掌握）"},{"id":"3-56","ch":2,"no":56,"t":"m","g":null,"stem":"偏见的认知根源主要包括 ( )","o":[["A","社会分类"],["B","现实冲突"],["C","刻板印象的证实偏差"],["D","自利偏差"],["E","群体极化"]],"ans":"AC","k":[0,2],"exp":"偏见的认知根源主要来自社会分类（产生内群偏好和外群贬损）以及基于刻板印象的证实偏差。B是现实冲突理论强调的经济根源，D、E不属于偏见的直接认知根源。","src":"偏见的产生与影响，社会心理学→社会态度，（熟悉）"},{"id":"3-57","ch":2,"no":57,"t":"m","g":null,"stem":"克服偏见的有效策略包括 ( )","o":[["A","创造平等地位的接触机会"],["B","建立共同内群体认同"],["C","采用非典型群体成员作为榜样"],["D","强化群体边界"],["E","提供反刻板印象的信息"]],"ans":"ABCE","k":[0,1,2,4],"exp":"强化群体边界会加剧内外群体区分，从而加剧偏见（D错）。ABCE都是减少偏见的有效策略。","src":"偏见的克服，社会心理学→社会态度，（掌握）"},{"id":"3-58","ch":2,"no":58,"t":"m","g":null,"stem":"社会排斥作为一种群体现象，其对被排斥者造成的心理影响包括 ( )","o":[["A","归属感降低"],["B","自尊下降"],["C","控制感丧失"],["D","存在意义感减弱"],["E","认知功能提升"]],"ans":"ABCD","k":[0,1,2,3],"exp":"根据威廉姆斯的研究，社会排斥会威胁个体的四种基本需求：归属感、自尊、控制感和存在意义感，导致这些心理指标下降，而非认知提升。","src":"社会排斥，社会心理学→社会态度，（了解）"},{"id":"3-59","ch":2,"no":59,"t":"k","g":"3-
