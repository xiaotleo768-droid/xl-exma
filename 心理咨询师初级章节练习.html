1","stem":"他反驳“吸烟有害”的报道，以减轻自己吸烟带来的内心冲突，这属于哪种心理防御？( )","o":[["A","合理化"],["B","认知失调的减少"],["C","反向形成"],["D","投射"],["E","否认"],["F","升华"]],"ans":"B","k":[1],"exp":"认知失调理论认为，当个体的认知与行为不一致时会产生不适。他通过改变对吸烟危害的认知（反驳报道）来减少失调，这是减少认知失调的典型策略。","src":"态度形成与改变的理论，社会心理学→社会态度，（掌握）"},{"id":"3-60","ch":2,"no":60,"t":"k","g":"3-1","stem":"他为了备孕在妻子要求下戒烟，根据计划行为理论，决定他戒烟意向的关键因素不包括( )","o":[["A","对吸烟的态度"],["B","主观规范（妻子的要求）"],["C","知觉行为控制（觉得自己能戒掉）"],["D","过去的习惯"],["E","行为信念"],["F","规范信念"]],"ans":"D","k":[3],"exp":"计划行为理论认为，行为意向由态度、主观规范和知觉行为控制共同决定；过去的习惯虽然影响行为，但在该理论模型中不直接决定意向，而是通过知觉行为控制起作用。","src":"态度形成与改变的理论，社会心理学→社会态度，（熟悉）"},{"id":"3-61","ch":2,"no":61,"t":"k","g":"3-1","stem":"他在戒烟后觉得公益广告说得对，这体现了态度的哪种功能？  ( )","o":[["A","知识功能"],["B","工具性功能"],["C","自我防御功能"],["D","价值表达功能"],["E","社会适应功能"],["F","认知功能"]],"ans":"AF","k":[0,5],"exp":"知识功能（又称认知功能）是指态度帮助人们组织和理解世界。他接受公益广告的观点，是为了建立与当前戒烟行为相一致的认知框架。","src":"态度的概念与测量，社会心理学→社会态度，（掌握）"},{"id":"3-62","ch":2,"no":62,"t":"k","g":"3-1","stem":"该公益广告想要说服他，根据说服模型，影响说服效果的因素包括 ( )","o":[["A","说服者的专业性"],["B","信息的恐惧唤醒程度"],["C","他自身的卷入度"],["D","他的人格特征"],["E","沟通的渠道"],["F","他是否正在戒烟"]],"ans":"ABCDE","k":[0,1,2,3,4],"exp":"说服模型包括说服者、信息、渠道和受众四个方面；F（他是否正在戒烟）是受众当前的状态，会影响卷入度，但选项A-E已全面覆盖模型的核心要素。","src":"说服模型与影响因素，社会心理学→社会态度，（掌握）"},{"id":"3-63","ch":2,"no":63,"t":"k","g":"3-1","stem":"他之前认为“吸烟长寿者很多”，这是对某群体的刻板印象，刻板印象是偏见的认知成分，克服这种偏见最有效的方法是 ( )","o":[["A","接触假设"],["B","忽视差异"],["C","强制说服"],["D","合理化"],["E","外化"],["F","压抑"]],"ans":"A","k":[0],"exp":"接触假设认为，在适当条件下，群体间的直接接触是减少偏见的最有效方法；B、C、D、E均非克服偏见的科学方法。","src":"偏见与社会排斥，社会心理学→社会态度，（掌握）"},{"id":"3-64","ch":2,"no":64,"t":"s","g":null,"stem":"根据社会规范理论，人们帮助别人是因为他们的社会规范要求这样做 ( )","o":[["A","社会责任"],["B","社会交换"],["C","互惠"],["D","公平"],["E","利他"]],"ans":"A","k":[0],"exp":"社会责任规范指出，人们应该帮助那些依赖他们的人（如儿童、弱者），无论是否期望回报。这是利他行为的社会规范解释之一。","src":"对利他行为的理论解释，社会心理学一社会行为，（掌握）"},{"id":"3-65","ch":2,"no":65,"t":"c","g":null,"stem":"小王在街上看到有人抢劫，由于周围有很多旁观者，他并没有上前制止。事后他说：“肯定会有别人去管的。”这种现象称为 ( )","o":[["A","旁观者效应"],["B","评价恐惧"],["C","社会懈怠"],["D","责任分散"],["E","去个性化"]],"ans":"D","k":[3],"exp":"责任分散是指他人在场使得个体感觉自己的责任减少了。小王认为别人会管，正是责任分散的体现。旁观者效应是结果（助人减少），责任分散是心理机制。","src":"利他行为的影响因素，社会心理学→社会行为，（熟悉）"},{"id":"3-66","ch":2,"no":66,"t":"c","g":null,"stem":"某人在被同事无端指责后，回家对孩子发脾气。这种侵犯行为属于 ( )","o":[["A","敌意性侵犯"],["B","工具性侵犯"],["C","替代性侵犯"],["D","本能性侵犯"],["E","利他性侵犯"]],"ans":"C","k":[2],"exp":"替代性侵犯（置换）是指当个体无法对引发挫折的源头进行报复时，将侵犯行为转向较安全或被社会允许的目标（如家人）。","src":"侵犯行为的影响因素，社会心理学→社会行为，（熟悉）"},{"id":"3-67","ch":2,"no":67,"t":"s","g":null,"stem":"在媒体暴力对侵犯行为影响的机制中，“脱敏效应”是指 ( )","o":[["A","观看暴力使个体模仿暴力行为"],["B","观看暴力使个体对现实暴力的生理和情绪反应减弱"],["C","观看暴力使个体认为世界是危险的"],["D","观看暴力使个体对暴力产生强烈反感"],["E","观看暴力使个体产生替代性强化"]],"ans":"B","k":[1],"exp":"脱敏效应是指反复接触暴力媒体内容，会降低个体对暴力行为的情绪唤醒和同理心，使其对现实中的暴力变得麻木或习以为常，从而增加侵犯倾向。","src":"传统媒体对人类行为的影响，社会心理学→社会行为，（熟悉）"},{"id":"3-68","ch":2,"no":68,"t":"c","g":null,"stem":"在社交媒体上，人们常常因为匿名性和群体极化而发表极端言论，这种现象与社会心理学中的哪个概念最相关 ( )","o":[["A","去个性化"],["B","自我效能"],["C","认知失调"],["D","曝光效应"],["E","旁观者效应"]],"ans":"A","k":[0],"exp":"网络环境中的匿名性和责任分散导致去个性化，使个体的自我约束减弱，更容易表现出极端行为或发表极端言论。","src":"社交媒体与人类行为，社会心理学→社会行为，（了解）"},{"id":"3-69","ch":2,"no":69,"t":"c","g":null,"stem":"在职场中，员工为了获得晋升而排挤竞争对手。这种侵犯行为属于 ( )","o":[["A","敌意性侵犯"],["B","工具性侵犯"],["C","冲动性侵犯"],["D","情绪性侵犯"],["E","替代性侵犯"]],"ans":"B","k":[1],"exp":"工具性侵犯是以达到特定目的（如晋升）为动机的侵犯行为，侵犯本身不是目的，而是工具。","src":"侵犯的概念，社会心理学→社会行为，（掌握）"},{"id":"3-70","ch":2,"no":70,"t":"s","g":null,"stem":"研究发现，在炎热的夏天，城市中的暴力犯罪率会上升。这支持了侵犯行为受哪种因素影响 ( )","o":[["A","温度（环境因素）"],["B","拥挤（密度因素）"],["C","噪音（环境因素）"],["D","贫困（经济因素）"],["E","文化（社会因素）"]],"ans":"A","k":[0],"exp":"环境温度的升高与暴力犯罪增加相关，这是侵犯行为受物理环境因素影响的证据之一。","src":"侵犯行为的影响因素，社会心理学→社会行为，（熟悉）"},{"id":"3-71","ch":2,"no":71,"t":"s","g":null,"stem":"根据社会交换理论的“比较水平”，个体对一段关系的满意度取决于 ( )","o":[["A","实际收益与实际成本的差值"],["B","实际收益与替代关系收益的比较"],["C","实际结果与期望结果（比较水平）的比较"],["D","投入与产出的绝对比例"],["E","对方对自己的付出程度"]],"ans":"C","k":[2],"exp":"比较水平（CL）是指个体基于过去经验认为在某种关系中应该得到的结果标准。满意度取决于当前关系的结果是否超过了个体的CL。","src":"社会交换理论，社会心理学→社会行为，（掌握）"},{"id":"3-72","ch":2,"no":72,"t":"s","g":null,"stem":"根据社会交换理论，个体在决定是否助人时，如果助人的成本高于收益，但个体仍然选择助人，这可能是因为 ( )","o":[["A","社会赞许的长期收益超过了短期成本"],["B","个体处于极度愉快的情绪中"],["C","助人行为完全是本能的"],["D","个体缺乏计算成本的能力"],["E","助人行为是由基因决定的"]],"ans":"A","k":[0],"exp":"社会交换理论认为，即使短期成本高，个体也会为了长期的收益（如社会赞许、建立良好声誉、未来可能获得回报）而助人。","src":"社会交换理论，社会心理学→社会行为，（掌握）"},{"id":"3-73","ch":2,"no":73,"t":"s","g":null,"stem":"根据公平理论，当个体在关系中发现自己的投入产出比低于对方时，可能会采取以下哪种策略来恢复公平感 ( )","o":[["A","增加自己的投入"],["B","降低对方的产出"],["C","改变对投入产出的认知"],["D","选择离开关系"],["E","降低自己的投入或要求增加产出"]],"ans":"E","k":[4],"exp":"公平理论认为，当感到不公平时，个体会采取行动恢复公平。对自己投入产出比低的情况，个体可能减少自己的投入或要求增加自己的产出（如要求加薪）。","src":"社会交换的证据与应用，社会心理学→社会行为，（熟悉）"},{"id":"3-74","ch":2,"no":74,"t":"m","g":null,"stem":"进化心理学对利他行为的解释主要包括 ( )","o":[["A","亲缘选择"],["B","互惠利他"],["C","社会责任规范"],["D","群体选择"],["E","公平规范"]],"ans":"AB","k":[0,1],"exp":"进化心理学主要通过亲缘选择（帮助有共同基因的亲属）和互惠利他（期望未来回报）来解释利他行为。C和E属于社会规范理论的解释。","src":"对利他行为的理论解释，社会心理学→社会行为，（掌握）"},{"id":"3-75","ch":2,"no":75,"t":"m","g":null,"stem":"影响利他行为的情境因素包括 ( )","o":[["A","旁观者数量"],["B","时间压力"],["C","环境条件（如天气）"],["D","助人者的宗教信仰"],["E","受助者的依赖程度"]],"ans":"ABCE","k":[0,1,2,4],"exp":"助人者的宗教信仰属于个人因素（D错）。旁观者数量、时间压力、环境条件（天气、噪音等）以及受助者的依赖程度（情境线索）都属情境因素。","src":"利他行为的影响因素，社会心理学→社会行为，（熟悉）"},{"id":"3-76","ch":2,"no":76,"t":"m","g":null,"stem":"增加利他行为的策略包括 ( )","o":[["A","增加责任感"],["B","减少情境的模糊性"],["C","树立利他榜样"],["D","增加时间压力"],["E","将助人行为内化为个人价值观"]],"ans":"ABCE","k":[0,1,2,4],"exp":"增加时间压力会减少利他行为（D错）。ABCE都是增加利他行为的有效策略。","src":"增加利他行为的策略，社会心理学→社会行为，（了解）"},{"id":"3-77","ch":2,"no":77,"t":"m","g":null,"stem":"关于网络社交媒体对人类行为的影响，下列说法正确的有 ( )","o":[["A","促进了社会比较，可能降低自尊"],["B","增加了去个性化现象，导致网络欺凌"],["C","扩大了社会支持网络，增强归属感"],["D","完全消除了人际沟通的障碍"],["E","可能导致“信息茧房”效应，强化偏见"]],"ans":"ABCE","k":[0,1,2,4],"exp":"网络并未完全消除沟通障碍，反而可能因为缺乏非言语线索导致误解（D错）。ABCE都是社交媒体对行为的影响。","src":"社交媒体与人类行为，社会心理学→社会行为，（了解）"},{"id":"3-78","ch":2,"no":78,"t":"m","g":null,"stem":"侵犯行为的影响因素中，属于个人因素的有","o":[["A","A型人格"],["B","敌意归因偏差"],["C","性别差异"],["D","酒精作用"],["E","挫折水平"]],"ans":"ABCD","k":[0,1,2,3],"exp":"A型人格、敌意归因偏差、性别差异和酒精作用都属于个体层面的因素。挫折水平通常被视为情境因素（如外界阻碍导致挫折）。","src":"侵犯行为的影响因素，社会心理学→社会行为，（熟悉）"},{"id":"3-79","ch":2,"no":79,"t":"m","g":null,"stem":"减少侵犯行为的有效方法包括 ( )","o":[["A","宜泄（通过合法途径释放攻击能量）"],["B","培养同理心"],["C","惩罚侵犯行为"],["D","提供侵犯线索（如武器）"],["E","训练问题解决技能"]],"ans":"ABCE","k":[0,1,2,4],"exp":"提供侵犯线索（武器效应）会增加侵犯行为（D错）。ABCE都是减少侵犯的有效策略。","src":"减少侵犯行为的方法，社会心理学→社会行为，（熟悉）"},{"id":"3-80","ch":2,"no":80,"t":"m","g":null,"stem":"根据鲁斯布尔特的投入模型，决定个体是否留在关系中的因素包括 ( )","o":[["A","满意度"],["B","替代选择的质量"],["C","投资规模"],["D","伴侣的满意度"],["E","外部压力"]],"ans":"ABC","k":[0,1,2],"exp":"投入模型认为，关系承诺取决于满意度、替代选择的质量以及在关系中已投入的资源规模（投资规模）。","src":"社会交换的证据与应用，社会心理学→社会行为，（熟悉）"},{"id":"3-81","ch":2,"no":81,"t":"k","g":"3-2","stem":"他暴怒想打人的行为属于 ( )","o":[["A","亲社会行为"],["B","侵犯行为"],["C","社会懈怠"],["D","去个性化"],["E","顺从"],["F","服从"]],"ans":"B","k":[1],"exp":"侵犯行为是指有意伤害他人身心健康的行为。他因愤怒产生伤害他人的意图和举动，属于侵犯行为。","src":"侵犯行为，社会心理学→社会行为，（掌握）"},{"id":"3-82","ch":2,"no":82,"t":"k","g":"3-2","stem":"他将自己的路怒归因于天气热和被老板批评，这体现了影响侵犯行为的哪些因素？  ( )","o":[["A","温度"],["B","挫折"],["C","去个性化"],["D","酒精"],["E","媒体暴力"],["F","侵犯线索"]],"ans":"AB","k":[0,1],"exp":"天气热属于环境温度因素，被老板批评属于挫折（挫折-侵犯假设），两者都是影响侵犯行为的外部因素。","src":"侵犯行为，社会心理学→社会行为，（熟悉）"},{"id":"3-83","ch":2,"no":83,"t":"k","g":"3-2","stem":"他评价新闻里的路怒者“天生暴脾气”，而他对自己却找外部借口，这种偏差属于 ( )","o":[["A","自我服务偏差"],["B","行动者-观察者效应"],["C","基本归因错误"],["D","证实偏差"],["E","后视偏差"],["F","虚假一致偏差"]],"ans":"B","k":[1],"exp":"行动者-观察者效应是指人们倾向于把自己的行为归因于外部情境，而把他人的行为归因于内部特质。","src":"归因与归因理论，社会心理学→社会认知，（熟悉）"},{"id":"3-84","ch":2,"no":84,"t":"k","g":"3-2","stem":"他扶起老人并拒绝酬金，这种行为属于 ( )","o":[["A","利他行为"],["B","社会交换"],["C","顺从"],["D","互惠规范"],["E","社会责任规范"],["F","服从"]],"ans":"A","k":[0],"exp":"利他行为是不期待任何回报的助人行为。他扶人并拒绝酬金，符合利他行为的定义。","src":"利他行为，社会心理学→社会行为，（掌握）"},{"id":"3-85","ch":2,"no":85,"t":"k","g":"3-2","stem":"他扶老人前“犹豫了片刻”，影响他助人决策的因素可能包括 ( )","o":[["A","责任分散"],["B","情境的模糊性"],["C","助人者的内疚感"],["D","时间压力"],["E","求助者的相似性"],["F","旁观者数量"]],"ans":"ABCDEF","k":[0,1,2,3,4,5],"exp":"根据拉塔内和达利的助人决策模型，情境模糊性、他人在场（责任分散、旁观者数量）、时间压力、内疚感、相似性等都会影响助人行为。","src":"利他行为，社会心理学→社会行为，（熟悉）"},{"id":"3-86","ch":2,"no":86,"t":"s","g":null,"stem":"当个体在群体中时，由于匿名性和责任分散，个体自我意识下降，行为变得更具冲动性和破坏性，这种现象称为 ( )","o":[["A","社会懈怠"],["B","去个性化"],["C","群体极化"],["D","旁观者效应"],["E","社会抑制"]],"ans":"B","k":[1],"exp":"去个性化是指个体在群体中丧失了个体感，自我控制和自我评价能力下降，导致冲动和反社会行为增加。","src":"社会影响的概念与来源，社会心理学→社会影响，（掌握）"},{"id":"3-87","ch":2,"no":87,"t":"s","g":null,"stem":"拉塔内的社会影响理论认为，当影响源的强度、接近性和数量增加时，社会影响力也会增加。这三种因素对影响力的影响是 ( )","o":[["A","加法关系"],["B","乘法关系"],["C","减法关系"],["D","替代关系"],["E","互斥关系"]],"ans":"B","k":[1],"exp":"拉塔内的社会影响理论（社会冲击理论）提出，影响力是强度、接近性和数量的乘积函数。","src":"社会影响理论的思路，社会心理学→社会影响，（熟悉）"},{"id":"3-88","ch":2,"no":88,"t":"c","g":null,"stem":"大学生小明在寝室里做简单的算术题时，如果室友在场，他的速度会变快；但做复杂的逻辑推理题时，室友在场会使他出错率增加。这属于 ( )","o":[["A","社会懈怠"],["B","社会促进"],["C","社会抑制"],["D","社会促进和社会抑制"],["E","从众和服从"]],"ans":"D","k":[3],"exp":"简单任务表现变好是社会促进，复杂任务表现变差是社会抑制。两者都是他人在场效应，统称为社会促进／抑制效应。","src":"社会促进的概念与解释，社会心理学→社会影响，（掌握）"},{"id":"3-89","ch":2,"no":89,"t":"s","g":null,"stem":"关于社会懈怠的“评价顾虑解释”，下列说法正确的是 ( )","o":[["A","个体因为担心被评价而紧张，导致表现下降"],["B","个体认为在群体中自己的努力无法被单独评价，因此降低了动机"],["C","个体在群体中感受到竞争压力，导致过度努力"],["D","个体因为群体凝聚力低而拒绝合作"],["E","个体通过懈怠来表达对领导的不满"]],"ans":"B","k":[1],"exp":"评价顾虑解释认为，当个体认为自己的输出无法与群体中其他人区分开来（无法单独评价）时，评价顾虑降低，努力程度随之下降。","src":"社会懈怠及其原因，社会心理学→社会影响，（熟悉）"},{"id":"3-90","ch":2,"no":90,"t":"s","g":null,"stem":"在阿希的从众实验中，当7个假被试一致给出错误答案时，真被试也给出了错误答案。这种从众主要是出于 ( )","o":[["A","信息性影响"],["B","规范性影响"],["C","价值认同"],["D","权威服从"],["E","群体极化"]],"ans":"B","k":[1],"exp":"阿希线段判断实验中，任务简单明了，被试并非不知道正确答案，而是为了避免显得格格不入而顺从群体，这属于规范性从众。","src":"从众，社会心理学→社会影响，（掌握）"},{"id":"3-91","ch":2,"no":91,"t":"s","g":null,"stem":"在谢里夫的光点似动实验中，被试在模糊情境下逐渐形成了与群体一致的判断。这种从众主要是出于 ( )","o":[["A","信息性影响"],["B","规范性影响"],["C","群体压力"],["D","权威服从"],["E","互惠规范"]],"ans":"A","k":[0],"exp":"谢里夫的实验情境高度模糊（光点似动），被试不相信自己的判断，转而参考他人的答案作为正确信息的来源，这属于信息性从众。","src":"从众，社会心理学→社会影响，（掌握）"},{"id":"3-92","ch":2,"no":92,"t":"c","g":null,"stem":"商店促销员先向顾客推荐一款价格极高的奢侈品，顾客拒绝后，促销员再推荐一款价格适中的同类产品，顾客更容易接受。这使用了哪种顺从技巧 ( )","o":[["A","登门槛效应"],["B","留面子效应"],["C","低球技术"],["D","那不是全部技巧"],["E","诱发技巧"]],"ans":"B","k":[1],"exp":"留面子效应（door-in-the-face）是指先提出一个大的会被拒绝的要求，然后再提出一个小的真正目的的要求，从而增加顺从的可能性。","src":"顺从，社会心理学→社会影响，（熟悉）"},{"id":"3-93","ch":2,"no":93,"t":"s","g":null,"stem":"在米尔格拉姆的服从实验中，当主试离开现场通过电话下达命令时，被试的服从率显著下降。这表明影响服从的因素是 ( )","o":[["A","命令者的权威性"],["B","命令者的接近性"],["C","受害者的接近性"],["D","机构合法性"],["E","群体影响"]],"ans":"B","k":[1],"exp":"命令者（主试）离开现场减少了其物理和心理学上的接近性，导致服从率下降，表明命令者的接近性是影响服从的重要因素。","src":"服从，社会心理学→社会影响，（熟悉）"},{"id":"3-94","ch":2,"no":94,"t":"m","g":null,"stem":"扎伊翁茨关于社会促进的解释（分心冲突理论）认为，他人在场引起个体分心，导致 ( )","o":[["A","个体注意集中在任务上"],["B","个体在注意任务和注意观众之间产生冲突"],["C","冲突导致生理唤醒增加"],["D","唤醒提高了简单任务的优势反应"],["E","唤醒抑制了复杂任务的优势反应"]],"ans":"BCD","k":[1,2,3],"exp":"分心冲突理论认为，他人在场使个体分心，在关注任务和关注他人之间产生冲突，冲突导致唤醒增强。增强的唤醒促进了简单任务的优势反应，但阻碍了复杂任务的非优势反应。E 表述不够准确，是阻碍了复杂任务表现（非优势反应），而非抑制优势反应。","src":"社会促进的概念与解释，社会心理学→社会影响，（掌握）"},{"id":"3-95","ch":2,"no":95,"t":"m","g":null,"stem":"减少社会懈怠的策略包括 ( )","o":[["A","使个体贡献可识别"],["B","增加任务的重要性和吸引力"],["C","缩小群体规模"],["D","增加群体凝聚力"],["E","强调集体目标而非个人目标"]],"ans":"ABCD","k":[0,1,2,3],"exp":"使贡献可识别、增加任务重要性、缩小规模、增加凝聚力都能有效减少懈怠。强调集体目标而不突出个人贡献反而可能加剧懈怠，E错。","src":"社会懈怠及其原因，社会心理学→社会影响，（熟悉）"},{"id":"3-96","ch":2,"no":96,"t":"m","g":null,"stem":"影响从众行为的个体因素包括 ( )","o":[["A","群体规模"],["B","自我意识"],["C","个体在群体中的地位"],["D","文化背景"],["E","任务的模糊性"]],"ans":"BCD","k":[1,2,3],"exp":"群体规模和任务模糊性属于情境因素（A、E错）。自我意识（内控者不易从众）、群体地位（地位低易从众）和文化背景（集体主义更易从众）属于个体因素。","src":"从众，社会心理学→社会影响，（掌握）"},{"id":"3-97","ch":2,"no":97,"t":"m","g":null,"stem":"关于顺从的心理机制，下列说法正确的有 ( )","o":[["A","互惠规范驱动了对他人让步的回报（留面子效应）"],["B","一致性原则驱动了个体保持前后承诺的统一（登门槛效应）"],["C","稀缺性原则增加了人们对失去资源的恐惧"],["D","权威原则导致了无条件的服从"],["E","喜好原则使人们更愿意答应自己喜欢的人的要求"]],"ans":"ABCDE","k":[0,1,2,3,4],"exp":"这五种原则是社会心理学中影响顺从和说服的核心心理机制（Cialdini的原则），全部正确。","src":"顺从，社会心理学→社会影响，（熟悉）"},{"id":"3-98","ch":2,"no":98,"t":"m","g":null,"stem":"在米尔格拉姆服从实验中，导致被试服从的关键因素包括 ( )","o":[["A","合法权威的命令"],["B","逐步升级的请求（脚在门内）"],["C","受害者的距离（距离越远越服从）"],["D","机构背景（耶鲁大学）"],["E","没有他人作为不服从的榜样"]],"ans":"ABCDE","k":[0,1,2,3,4],"exp":"A、C、D、E都是实验揭示的影响服从的因素。B虽然表述为脚在门内，但在实验中体现为电压是逐步增加的（渐进性），也是导致服从难以中断的关键机制。","src":"服从，社会心理学一社会影响，（熟悉）"},{"id":"3-99","ch":2,"no":99,"t":"k","g":"3-3","stem":"她在图书馆学习效率提高，这种现象称为 ( )","o":[["A","社会促进"],["B","社会懈怠"],["C","从众"],["D","服从"],["E","去个性化"],["F","群体极化"]],"ans":"A","k":[0],"exp":"社会促进是指个体在他人在场时表现出比独处时更好的表现。他人在场或与他人一起活动促进了她的学习效率。","src":"社会促进与社会懈怠，社会心理学→社会影响，（掌握）"},{"id":"3-100","ch":2,"no":100,"t":"k","g":"3-3","stem":"她在大扫除时偷懒，这属于 ( )","o":[["A","社会促进"],["B","社会懈怠"],["C","去个性化"],["D","群体思维"],["E","顺从"],["F","服从"]],"ans":"B","k":[1],"exp":"社会懈怠是指在群体任务中，个体因为责任分散和评价焦虑降低而付出的努力比单独完成时少的现象。","src":"社会促进与社会懈怠，社会心理学→社会影响，（熟悉）"},{"id":"3-101","ch":2,"no":101,"t":"k","g":"3-3","stem":"她买了不适合自己的同款裙子，这主要是由于哪种动机导致的从众？  ( )","o":[["A","信息性影响"],["B","规范性影响"],["C","价值性影响"],["D","自我确认"],["E","群体极化"],["F","服从权威"]],"ans":"B","k":[1],"exp":"规范性影响是指为了获得群体的接纳和喜欢而顺从群体，避免被排斥。她怕不合群而买同款，属于规范性从众。","src":"从众、顺从与服从，社会心理学→社会影响，（掌握）"},{"id":"3-102","ch":2,"no":102,"t":"k","g":"3-3","stem":"她帮室友代签到，虽然不情愿但怕破坏关系，这种行为属于：  ( )","o":[["A","从众"],["B","顺从"],["C","服从"],["D","内化"],["E","认同"],["F","依从"]],"ans":"B","k":[1],"exp":"顺从是指在他人的直接请求下按照他人要求做的行为；服从是在权威命令下；从众是群体压力下的行为改变。室友是请求而非权威，属于顺从。","src":"从众、顺从与服从，社会心理学→社会影响，（熟悉）"},{"id":"3-103","ch":2,"no":103,"t":"k","g":"3-3","stem":"导致她在大扫除时社会懈怠的原因可能有 ( )","o":[["A","责任分散"],["B","评价顾忌减少"],["C","认为自己的贡献无法被单独评估"],["D","任务本身具有挑战性"],["E","群体凝聚力极高"],["F","群体规模较小"]],"ans":"ABC","k":[0,1,2],"exp":"社会懈怠的原因包括责任分散、无法单独评估贡献、评价顾忌减少等；任务挑战性高、群体凝聚力极高通常会减少懈怠。","src":"社会促进与社会懈怠，社会心理学→社会影响，（熟悉）"},{"id":"3-104","ch":2,"no":104,"t":"s","g":null,"stem":"人际吸引的最强烈形式是 ( )","o":[["A","亲密"],["B","友谊"],["C","爱情"],["D","合群"],["E","喜爱"]],"ans":"C","k":[2],"exp":"人际吸引按强度从低到高分为合群、喜欢和爱情，爱情是人际吸引的最强烈形式。","src":"人际吸引的概念，社会心理学→人际关系，（掌握）"},{"id":"3-105","ch":2,"no":105,"t":"s","g":null,"stem":"“异性相吸”现象在人际吸引中往往体现在 ( )","o":[["A","价值观的互补性"],["B","人格特质的互补性"],["C","社会角色的互补性"],["D","需要的互补性"],["E","外貌的互补性"]],"ans":"D","k":[3],"exp":"互补性原则主要体现在需要的互补上，即一方所缺正是另一方所有的，从而产生相互吸引。角色和特质有时互补，但核心是需要满足的互补。","src":"人际吸引的基本原则，社会心理学→人际关系，（熟悉）"},{"id":"3-106","ch":2,"no":106,"t":"s","g":null,"stem":"根据社会渗透理论，亲密关系的发展像剥洋葱一样，涉及哪两个维度的变化 ( )","o":[["A","广度和深度"],["B","强度和频率"],["C","信任和承诺"],["D","激情和亲密"],["E","依赖和独立"]],"ans":"A","k":[0],"exp":"社会渗透理论认为，亲密关系的发展通过自我暴露的广度（讨论话题的范围）和深度（暴露的隐私程度）两个维度的增加来实现。","src":"亲密关系的发展，社会心理学→人际关系，（熟悉）"},{"id":"3-107","ch":2,"no":107,"t":"s","g":null,"stem":"在亲密关系的终结过程中，个体开始对关系感到不满，并思考分手的可能性和后果，这属于拉斯韦尔提出的分手阶段的 ( )","o":[["A","认知阶段"],["B","情感阶段"],["C","行为阶段"],["D","修复阶段"],["E","社会阶段"]],"ans":"A","k":[0],"exp":"认知阶段是个体在内心开始对关系产生不满，评估关系的成本和收益，思考分手的合理性，但尚未在情感上完全脱离或采取行动。","src":"亲密关系的维持与终结，社会心理学→人际关系，（熟悉）"},{"id":"3-108","ch":2,"no":108,"t":"s","g":null,"stem":"斯腾伯格的爱情三元论中，只有亲密和承诺，缺乏激情的爱情被称为 ( )","o":[["A","浪漫之爱"],["B","伴侣之爱"],["C","虚幻之爱"],["D","完美之爱"],["E","愚蠢之爱"]],"ans":"B","k":[1],"exp":"亲密＋承诺＝伴侣之爱，通常出现在长久而稳定的婚姻关系中。浪漫之爱＝亲密＋激情；虚幻（愚蠢）之爱＝激情＋承诺；完美之爱＝亲密＋激情＋承诺。","src":"爱情，社会心理学→人际关系，（了解）"},{"id":"3-109","ch":2,"no":109,"t":"m","g":null,"stem":"影响人际吸引的情境因素主要包括 ( )","o":[["A","接近性（空间距离）"],["B","熟悉度（曝光效应）"],["C","个体能力"],["D","物理吸引力"],["E","环境压力"]],"ans":"ABE","k":[0,1,4],"exp":"接近性、熟悉度和共同经历的环境压力（危机情境增加吸引力）属于情境因素。个体能力和物理吸引力属于个人特质因素（C、D错）。","src":"影响人际吸引的因素，社会心理学一人际关系，（了解）"},{"id":"3-110","ch":2,"no":110,"t":"m","g":null,"stem":"根据哈泽尔和谢弗的依恋理论，成人的亲密关系风格可分为 ( )","o":[["A","安全型"],["B","回避型"],["C","矛盾-焦虑型"],["D","依赖型"],["E","控制型"]],"ans":"ABC","k":[0,1,2],"exp":"基于婴儿依恋研究，成人依恋风格分为安全型、回避型和矛盾-焦虑型（痴迷型）。D、E 不属于标准分类。","src":"亲密关系的定义与本质，社会心理学→人际关系，（熟悉）"},{"id":"3-111","ch":2,"no":111,"t":"m","g":null,"stem":"维持亲密关系的有效策略包括 ( )","o":[["A","积极的互动与沟通"],["B","避免所有冲突"],["C","相互的自我暴露"],["D","持续的包容与支持"],["E","保持个人边界与独立性"]],"ans":"ACDE","k":[0,2,3,4],"exp":"B选项避免所有冲突是不现实的，且压抑冲突反而有害；建设性的冲突处理有助于关系维持。ACDE均为维持策略。","src":"亲密关系的维持与终结，社会心理学→人际关系，（熟悉）"},{"id":"3-112","ch":2,"no":112,"t":"k","g":"3-4","stem":"他们因为住在同一个小区而相识，这体现了影响人际吸引的哪个因素？  ( )","o":[["A","相似性"],["B","接近性"],["C","互补性"],["D","外貌吸引力"],["E","能力"],["F","人格特质"]],"ans":"B","k":[1],"exp":"接近性是指物理距离的远近，距离近的人更容易发生互动，从而增加相互吸引的机会。","src":"人际关系的基础：人际吸引，社会心理学→人际关系，（了解）"},{"id":"3-113","ch":2,"no":113,"t":"k","g":"3-4","stem":"他们喜欢同样的小说和运动，这体现了相似性对人际吸引的作用，其心理机制包括 ( )","o":[["A","一致性带来社会认同"],["B","证明自身观点的正确性"],["C","提供共同活动的机会"],["D","满足互补的需求"],["E","产生光环效应"],["F","降低人际交往成本"]],"ans":"ABC","k":[0,1,2],"exp":"相似性之所以促进吸引，是因为它提供一致性确认（证明自己正确）、获得社会支持，并提供了共同活动的基础；D是互补性机制；E、F与此无关。","src":"人际关系的基础：人际吸引，社会心理学→人际关系，（了解）"},{"id":"3-114","ch":2,"no":114,"t":"k","g":"3-4","stem":"在恋爱初期认为对方完美无缺，这属于斯滕伯格爱情三角理论中的哪种成分过高的表现？( )","o":[["A","亲密"],["B","承诺"],["C","激情"],["D","理性"],["E","义务"],["F","依恋"]],"ans":"C","k":[2],"exp":"恋爱初期的“晕轮效应”和浪漫狂热，主要是由激情驱动的，它容易让人忽视对方的缺点。","src":"亲密关系与爱情，社会心理学→人际关系，（了解）"},{"id":"3-115","ch":2,"no":115,"t":"k","g":"3-4","stem":"他们发现对方不完美后开始争吵，但又不舍得分手，这种维持关系的机制在人际交往原则中属于 ( )","o":[["A","得失原则"],["B","最小最大化原则"],["C","社会交换理论中的“比较水平”"],["D","公平原则"],["E","互补性原则"],["F","一致性原则"]],"ans":"C","k":[2],"exp":"社会交换理论认为，个体是否维持关系取决于结果与比较水平的对比。不舍得分手说明当前关系的结果仍然高于其替代比较水平或比较水平。","src":"人际关系的基础：人际吸引，社会心理学→人际关系，（熟悉）"},{"id":"3-116","ch":2,"no":116,"t":"k","g":"3-4","stem":"根据斯滕伯格的爱情三角理论，一段完整的爱情应该包括：  ( )","o":[["A","亲密"],["B","激情"],["C","承诺"],["D","浪漫"],["E","崇拜"],["F","依赖"]],"ans":"ABC","k":[0,1,2],"exp":"斯滕伯格认为爱情由亲密、激情和承诺三个维度组成，三者兼备才是完美的爱情。","src":"亲密关系与爱情，社会心理学→人际关系，（了解）"},{"id":"3-117","ch":2,"no":117,"t":"s","g":null,"stem":"谢里夫的“游动效应”实验（光点似动实验）主要证明了什么现象的产生 ( )","o":[["A","社会促进"],["B","群体规范"],["C","群体极化"],["D","群体思维"],["E","社会懈怠"]],"ans":"B","k":[1],"exp":"谢里夫的实验发现，在模糊情境下，个体的判断会逐渐趋同，形成一种群体内部的标准，即非正式的群体规范。","src":"群体规范，社会心理学→群体心理与行为，（熟悉）"},{"id":"3-118","ch":2,"no":118,"t":"s","g":null,"stem":"关于群体凝聚力与生产力的关系，下列说法正确的是 ( )","o":[["A","凝聚力越高，生产力一定越高"],["B","凝聚力越高，生产力一定越低"],["C","凝聚力与生产力的关系取决于群体的绩效规范"],["D","凝聚力与生产力无关"],["E","高凝聚力群体无法改变绩效规范"]],"ans":"C","k":[2],"exp":"社会心理学研究表明，凝聚力与生产力的关系取决于群体的绩效规范。如果群体规范是高产的，高凝聚力会导致高生产力；如果规范是低产（如限制产量）的，高凝聚力反而导致更低的生产力。","src":"群体凝聚力，社会心理学→群体心理与行为，（掌握）"},{"id":"3-119","ch":2,"no":119,"t":"s","g":null,"stem":"在群体冲突解决中，一方牺牲自己的利益以满足对方需求的策略属于 ( )","o":[["A","竞争"],["B","回避"],["C","迁就"],["D","妥协"],["E","合作"]],"ans":"C","k":[2],"exp":"迁就（顺应）策略的特点是高合作、低坚持，为了维护关系或对方利益而牺牲自己利益。","src":"群体冲突解决的模型，社会心理学→群体心理与行为，（掌握）"},{"id":"3-120","ch":2,"no":120,"t":"s","g":null,"stem":"根据赫塞和布兰查德的情境领导理论，当下属成熟度较低（无能力且无意愿）时，最有效的领导风格是 ( )","o":[["A","授权型"],["B","参与型"],["C","推销型（说服型）"],["D","指示型（命令型）"],["E","民主型"]],"ans":"D","k":[3],"exp":"情境领导理论认为，下属成熟度低时，需要领导者提供明确的工作指导，因此指示型（高任务、低关系）最有效。","src":"领导理论，社会心理学→群体心理与行为，（掌握）"},{"id":"3-121","ch":2,"no":121,"t":"m","g":null,"stem":"群体沟通的障碍主要包括 ( )","o":[["A","地位障碍（上下级沟通困难）"],["B","空间距离障碍"],["C","信息过载"],["D","语言和语义障碍"],["E","沟通网络过于开放"]],"ans":"ABCD","k":[0,1,2,3],"exp":"地位差异、空间距离、信息量过大以及语义理解差异都是常见的群体沟通障碍。沟通网络过于开放通常不是障碍，反而在某些情境下促进沟通。","src":"群体沟通的特性与型态，社会心理学→群体心理与行为，（熟悉）"},{"id":"3-122","ch":2,"no":122,"t":"m","g":null,"stem":"群体思维（团体思维）的主要症状表现包括 ( )","o":[["A","无懈可击的错觉（群体过于自信）"],["B","道德错觉（认为群体绝对正确）"],["C","对异议者施加压力"],["D","内部一致性的自我审查"],["E","绝对理性的决策过程"]],"ans":"ABCD","k":[0,1,2,3],"exp":"群体思维的症状包括错觉（无懈可击、道德）、压力、自我审查、心灵卫士等，导致决策非理性。E与群体思维的特征相反。","src":"群体思维，社会心理学→群体心理与行为，（熟悉）"},{"id":"3-123","ch":2,"no":123,"t":"m","g":null,"stem":"德尔菲法作为一种群体决策方法，其主要特点包括 ( )","o":[["A","匿名性"],["B","面对面激烈讨论"],["C","多轮反馈"],["D","群体统计算法"],["E","少数服从多数"]],"ans":"ACD","k":[0,2,3],"exp":"德尔菲法通过背靠背的匿名方式（A）、多轮反馈问卷（C）和统计汇总（D）来获得专家共识，避免面对面讨论（B错）和简单多数（E错）的弊端。","src":"群体决策方法，社会心理学→群体心理与行为，（了解）"},{"id":"3-124","ch":2,"no":124,"t":"m","g":null,"stem":"根据路径-目标理论，领导者的职责是帮助下属达到目标，并提供必要的指导和支持。该理论提出的领导风格包括 ( )","o":[["A","指导型领导"],["B","支持型领导"],["C","参与型领导"],["D","成就取向型领导"],["E","专制型领导"]],"ans":"ABCD","k":[0,1,2,3],"exp":"豪斯的路径-目标理论提出四种领导风格：指导型、支持型、参与型和成就取向型。专制型不属于该理论的分类。","src":"领导理论，社会心理学→群体心理与行为，（掌握）"},{"id":"3-125","ch":2,"no":125,"t":"k","g":"3-5","stem":"市场部与技术部互相认为对方具有“木讷”或“浮夸”的特质，这种将群体特征强加给个体的现象及其心理学根源主要涉及 ( )","o":[["A","刻板印象"],["B","基本归因错误"],["C","群体间的社会分类"],["D","内群体偏好"],["E","外群体同质性效应"],["F","晕轮效应"]],"ans":"ACDE","k":[0,2,3,4],"exp":"将群体特征强加给个体属于刻板印象（A）。其认知根源在于社会分类（C)，即把人分为“我们”（内群体）和“他们”（外群体）。人们倾向于偏袒内群体（D)，并认为外群体成员彼此都很相似，即外群体同质性效应（E)，从而容易对外群体形成单一刻板的评价。","src":"偏见的产生与影响，社会心理学→社会态度，（熟悉）"},{"id":"3-126","ch":2,"no":126,"t":"k","g":"3-5","stem":"小赵对自己外貌的不满意影响了他在演讲中的信心。这涉及社会认知中的哪些概念 ( )","o":[["A","体像"],["B","自我效能"],["C","自我觉知"],["D","自尊"],["E","自我障碍"],["F","自证预言"]],"ans":"AB","k":[0,1],"exp":"小赵对自己外貌的主观评价属于体像（A)，体像负面导致他对自己完成演讲任务的能力缺乏信心，即自我效能低下（B）。虽然也涉及自尊，但题目明确指向对演讲信心的影响，自我效能更精准。","src":"自我觉知、自我效能与体像，社会心理学→社会认知，（掌握）"},{"id":"3-127","ch":2,"no":127,"t":"k","g":"3-5","stem":"技术部小李认为小赵出汗是因为“专业能力不足、心虚”。根据琼斯和戴维斯的对应推论理论，小李做出这种特质归因可能是因为他考虑了哪些因素 ( )","o":[["A","小赵出汗行为的自由选择性"],["B","出汗行为的社会赞许性低"],["C","行为的非共同效应（独特结果）"],["D","小赵出汗的一贯性"],["E","小赵出汗的特异性"],["F","其他人的共识性"]],"ans":"ABC","k":[0,1,2],"exp":"对应推论理论关注如何从外显行为推断内在特质。主要考虑：行为是否是自由选择的（A)，行为的社会赞许性（低赞许性行为如心虚出汗，更容易归因为特质，B)，以及行为的非共同效应（即该行为产生的独有结果，C）。DEF是凯利三维归因理论的协变维度。","src":"琼斯和戴维斯的对应推论理论，社会心理学→社会认知，（熟悉）"},{"id":"3-128","ch":2,"no":128,"t":"k","g":"3-5","stem":"小赵将自己出汗解释为“空调坏了”和“容易紧张”。如果运用沙赫特的情绪归因理论来解释，小赵的紧张情绪体验是由哪些因素构成的 ( )","o":[["A","生理唤醒（出汗、心跳加速）"],["B","认知标签（环境热、任务难）"],["C","本能冲动"],["D","无意识动机"],["E","刺激的物理属性"],["F","遗传特质"]],"ans":"AB","k":[0,1],"exp":"沙赫特的情绪两因素理论认为，情绪体验是生理唤醒（A）和认知标签（对唤醒原因的认知解释，B）共同作用的结果。","src":"沙赫特的情绪归因理论，社会心理学→社会认知，（了解）"},{"id":"3-129","ch":2,"no":129,"t":"k","g":"3-5","stem":"公司HR组织混合编组完成协作任务，以减少部门偏见。根据接触假设，这种方法有效的前提条件包括哪些 ( )","o":[["A","群体间地位平等"],["B","有共同目标"],["C","接触能获得群体支持（制度背书）"],["D","必须存在竞争"],["E","必须有权威指令"],["F","群体规模必须相同"]],"ans":"ABC","k":[0,1,2],"exp":"接触假设认为，减少偏见的接触必须满足：地位平等（A）、共同目标（B）、群体支持／制度背书（C）。竞争（D）通常会加剧冲突而非减少偏见。EF并非必要条件。","src":"偏见的克服，社会心理学→社会态度，（掌握）"},{"id":"3-130","ch":2,"no":130,"t":"k","g":"3-5","stem":"老王因为儿子被录用而改变了对化工厂的反对态度。根据海德的平衡理论，老王改变态度前的P-0-X关系处于什么状态 ( ) 改变态度后又处于什么状态 ( )","o":[["A","平衡，不平衡"],["B","不平衡，平衡"],["C","不平衡，不平衡"],["D","平衡，平衡"],["E","无法确定平衡状态"],["F","改变态度前后均为无关状态"]],"ans":"B","k":[1],"exp":"改变前：P（老王）不喜欢0（工厂）,P喜欢X（儿子受益）,0与X相关（工厂给儿子工作）。三者的符号相乘为(-)×(+)×(+)=-,，为不平衡状态。改变态度后：P喜欢0,P喜欢X，0与X相关。符号相乘为正，为平衡状态。","src":"平衡理论，社会心理学→社会态度，（了解）"},{"id":"3-131","ch":2,"no":131,"t":"k","g":"3-5","stem":"老王想抗议但觉得“抗议也没用”，且“没有领袖组织”。根据计划行为理论，老王没有采取抗议行为主要是缺乏了哪些因素 ( )","o":[["A","积极的行为态度"],["B","强烈的主观规范"],["C","高的知觉行为控制"],["D","行为意向"],["E","过去行为习惯"],["F","价值观导向"]],"ans":"BC","k":[1,2],"exp":"老王内心害怕（有消极态度倾向，所以A不选），但决定行为意向的关键在于他觉得抗议没用（知觉行为控制低，C）和没人组织（缺乏主观规范的感知压力，B）。","src":"计划行为理论，社会心理学→社会态度，（熟悉）"},{"id":"3-132","ch":2,"no":132,"t":"k","g":"3-5","stem":"老王虽然害怕但仍救助了独居老人。根据社会规范理论，老王的行为受哪种规范的驱动根据利他行为的理论，老王的行为体现了什么 ( )","o":[["A","互惠规范"],["B","社会责任规范"],["C","进化心理学的亲缘选择"],["D","社会交换理论的内部回报"],["E","社会交换理论的外部奖励"],["F","诱因理论"]],"ans":"BD","k":[1,3],"exp":"救助弱者（独居老人）属于社会责任规范（B）。老王虽然害怕仍救助，社会交换理论认为利他行为也有回报，此时内部回报（如自我满足感、减少内疚感，D）是重要驱动力。非亲缘关系（C错），无互惠预期（A错），无外部奖励（E错）。","src":"对利他行为的理论解释，社会心理学→社会行为，（掌握）"},{"id":"3-133","ch":2,"no":133,"t":"k","g":"3-5","stem":"居委会主任在谈判中采取“双赢”策略，这属于群体冲突解决模型中的哪种策略 ( )","o":[["A","回避"],["B","迁就"],["C","竞争"],["D","妥协"],["E","合作"],["F","退让"]],"ans":"E","k":[4],"exp":"双赢策略即合作（整合）策略，其特点是高坚持性（关注自身利益）且高合作性（关注对方利益），寻求双方利益的满足。","src":"群体冲突解决的模型，社会心理学→群体心理与行为，（掌握）"},{"id":"3-134","ch":2,"no":134,"t":"k","g":"3-5","stem":"居委会主任对情绪激动的居民采取倾听、安抚和支持的态度。根据路径-目标领导理论，这属于哪种领导风格 ( )","o":[["A","指导型领导"],["B","支持型领导"],["C","参与型领导"],["D","成就取向型领导"],["E","专制型领导"],["F","放任型领导"]],"ans":"B","k":[1],"exp":"支持型领导关心下属的需求、情感和福利，建立友好氛围。倾听和安抚体现了支持型领导风格。","src":"领导理论，社会心理学→群体心理与行为，（掌握）"},{"id":"3-135","ch":2,"no":135,"t":"k","g":"3-5","stem":"高管团队做出的收购决定比个体单独决策时更冒险，这种现象称为 ( )","o":[["A","群体思维"],["B","群体极化"],["C","社会懈怠"],["D","去个性化"],["E","头脑风暴"],["F","冒险转移"]],"ans":"B","k":[1],"exp":"群体极化是指群体讨论后，个体的态度或决策倾向变得更加极端（更冒险或更保守）。\n这里决策更冒险，属于群体极化（冒险转移是其表现形式之一）。","src":"群体决策，社会心理学→群体心理与行为，（掌握）"},{"id":"3-136","ch":2,"no":136,"t":"k","g":"3-5","stem":"大家为了维护表面和谐而压制不同意见，导致决策失误，这属于 ( )","o":[["A","群体极化"],["B","群体思维"],["C","社会促进"],["D","从众效应"],["E","服从效应"],["F","光环效应"]],"ans":"B","k":[1],"exp":"群体思维是指高凝聚力的群体为了寻求一致，压制异议，导致对问题解决方案的客观评估受损，常导致灾难性决策。","src":"群体决策，社会心理学→群体心理与行为，（熟悉）"},{"id":"3-137","ch":2,"no":137,"t":"k","g":"3-5","stem":"为了克服上述案例中出现的群体决策偏差，小组在后续讨论中可以采取哪些有效方法？( )","o":[["A","领导者在讨论初期保持中立"],["B","鼓励成员提出反对意见"],["C","分组讨论后再汇总意见"],["D","邀请外部专家参与讨论"],["E","强调群体的高度一致性"],["F","设立“魔鬼代言人”角色"]],"ans":"ABCDF","k":[0,1,2,3,5],"exp":"克服群体思维和极化的方法包括：领导者后发言（保持中立）、鼓励异议、分组讨论、引入外部专家、设立专门挑刺的角色（魔鬼代言人）等。强调一致性反而会加剧群体思维。","src":"群体决策，社会心理学→群体心理与行为，（了解）"},{"id":"3-138","ch":2,"no":138,"t":"k","g":"3-5","stem":"董事长能在会议上轻易影响他人，这体现了哪种领导理论的观点？  ( )","o":[["A","特质理论"],["B","情境理论"],["C","权变理论"],["D","风格理论"],["E","路径-目标理论"],["F","功能理论"]],"ans":"A","k":[0],"exp":"特质理论认为领导者具备某些特质（如决断力、影响力），董事长因其地位和特质对群体产生巨大影响。","src":"群体领导，社会心理学→群体心理与行为，（掌握）"},{"id":"3-139","ch":2,"no":139,"t":"k","g":"3-5","stem":"该高管团队是一个正式群体，群体的基本特征包括：  ( )","o":[["A","成员间有互动"],["B","有共同的规范"],["C","有共同的目标"],["D","成员必须是朋友"],["E","必须有明确的领导者"],["F","有群体认同感"]],"ans":"ABCF","k":[0,1,2,5],"exp":"群体的基本特征包括成员互动、共同规范、共同目标和群体认同感；D错误，群体成员不一定是朋友；E错误，非正式群体可能没有明确领导者。","src":"基本概念，社会心理学→群体心理与行为，（熟悉）"},{"id":"4-1","ch":3,"no":1,"t":"s","g":null,"stem":"发展心理学研究的特殊性主要在于其关注的核心变量是 ( )","o":[["A","人格特质"],["B","智力水平"],["C","年龄特征"],["D","情绪反应"],["E","动机强度"]],"ans":"C","k":[2],"exp":"发展心理学以心理发展的年龄特征为核心变量，这是其区别于其他心理学分支的特殊性。","src":"发展心理学研究的功能和特殊性，发展心理学→概述，（了解）"},{"id":"4-2","ch":3,"no":2,"t":"c","g":null,"stem":"研究者为了探讨某种早期教育干预对智力发展的长期影响，从2020年起对一批2岁儿童进行追踪，直至他们10岁。但在2025年时，国家颁布了新的教育政策，这可能混淆了年龄效应。这种设计属于 ( )","o":[["A","横断研究"],["B","纵向研究"],["C","聚合交叉研究"],["D","微观发生研究"],["E","文化研究"]],"ans":"B","k":[1],"exp":"对同一组被试进行长期的反复追踪研究属于纵向研究。纵向研究的缺点之一是时代变迁效应（如政策改变）的混淆。","src":"发展心理学研究的设计方式，发展心理学→概述，（熟悉）"},{"id":"4-3","ch":3,"no":3,"t":"s","g":null,"stem":"主张遗传因素和环境因素共同决定心理发展，但两者是各自独立的、相加的关系，这种观点属于 ( )","o":[["A","遗传决定论"],["B","环境决定论"],["C","二因素论"],["D","相互作用论"],["E","社会文化决定论"]],"ans":"C","k":[2],"exp":"二因素论认为遗传和环境共同起作用，但两者是相加的、非相互渗透的关系；相互作用论则强调两者是相互影响、交织在一起的。","src":"遗传与环境共同决定心理发展，发展心理学→概述，（熟悉）"},{"id":"4-4","ch":3,"no":4,"t":"s","g":null,"stem":"维果斯基认为，高级心理机能是在人际交往中形成的，个体将其通过语言符号的中介转化为内部心理结构的过程称为 ( )","o":[["A","同化"],["B","顺应"],["C","内化"],["D","平衡"],["E","整合"]],"ans":"C","k":[2],"exp":"维果茨基创立的文化一历史理论指出人的高级心理机能的发展是由社会文化历史因素决定的。他认为，心理的实质就是社会文化历史通过语言符号的中介而不断内化的结果。","src":"社会文化因素决定心理发展，发展心理学→概述，（掌握）"},{"id":"4-5","ch":3,"no":5,"t":"c","g":null,"stem":"儿童在已掌握“鸟”的概念后，看到鸡也称之为“鸟”，这种认知过程属于 ( )","o":[["A","同化"],["B","顺应"],["C","平衡"],["D","组织"],["E","内化"]],"ans":"A","k":[0],"exp":"同化是指将新刺激纳入已有图式的认知过程；儿童将鸡（新刺激）纳入鸟的图式，是同化现象。","src":"心理发展是主体和客体相互作用的结果，发展心理学→概述，（掌握）"},{"id":"4-6","ch":3,"no":6,"t":"s","g":null,"stem":"心理发展的内动力和外动力的关系是 ( )","o":[["A","内动力起决定作用，外动力无足轻重"],["B","外动力起决定作用，内动力是基础"],["C","两者相互独立，互不影响"],["D","两者是对立统一的，相互影响与转化"],["E","内动力只存在于儿童期，外动力贯穿一生"]],"ans":"D","k":[3],"exp":"心理发展是内动力（遗传、本能）与外动力（环境、教育）对立统一的过程，两者相互影响、转化。","src":"心理发展的内动力和外动力的关系，发展心理学→概述，（熟悉）"},{"id":"4-7","ch":3,"no":7,"t":"s","g":null,"stem":"“关键期”概念的提出最初源于对哪种动物的研究 ( )","o":[["A","小白鼠走迷宫"],["B","狗分泌唾液"],["C","雏鹅的印刻现象"],["D","猩猩的顿悟学习"],["E","鸽子啄键"]],"ans":"C","k":[2],"exp":"劳伦兹通过对雏鹅“印刻现象”的研究，提出了关键期（敏感期）的概念。","src":"儿童早期心理发展的关键期，发展心理学→概述，（熟悉）"},{"id":"4-8","ch":3,"no":8,"t":"s","g":null,"stem":"从儿童心理学向毕生发展心理学演变的关键人物之一，提出生命周期理论的心理学家是( )","o":[["A","普莱尔"],["B","霍尔"],["C","荣格"],["D","巴尔特斯"],["E","皮亚杰"]],"ans":"C","k":[2],"exp":"荣格是最早关注成年期和老年期心理发展的心理学家，提出了生命周期理论，为毕生发展观奠定了基础。","src":"儿童心理学的诞生和演变，发展心理学→概述，（熟悉）"},{"id":"4-9","ch":3,"no":9,"t":"m","g":null,"stem":"心理发展的方向性体现在心理发展总是 ( )","o":[["A","由低级向高级"],["B","由简单向复杂"],["C","由表及里"],["D","由单一向分化"],["E","由无意向有意"]],"ans":"AB","k":[0,1],"exp":"心理发展的方向性是指心理发展的指向性，一般来说，发展的趋向是从简单到复杂、从低级向高级发展。","src":"心理发展的概念和性质，发展心理学→概述，（掌握）"},{"id":"4-10","ch":3,"no":10,"t":"m","g":null,"stem":"聚合交叉研究设计的优点包括 ( )","o":[["A","克服了横断研究缺乏连续性的问题"],["B","克服了纵向研究被试流失的问题"],["C","能够分析世代效应"],["D","耗时比纯纵向研究短"],["E","完全消除所有研究误差"]],"ans":"ABCD","k":[0,1,2,3],"exp":"聚合交叉研究结合了横断和纵向的优点，能追踪连续性、减少流失、分析世代效应，且相对省时；E过于绝对。","src":"发展心理学研究的设计方式，发展心理学→概述，（熟悉）"},{"id":"4-11","ch":3,"no":11,"t":"m","g":null,"stem":"皮亚杰认为心理发展是主体与客体相互作用的结果，其理论的核心概念包括 ( )","o":[["A","图式"],["B","同化"],["C","顺应"],["D","平衡"],["E","强化"]],"ans":"ABCD","k":[0,1,2,3],"exp":"图式、同化、顺应和平衡是皮亚杰认知发展理论的核心机制；E属于行为主义概念。","src":"心理发展是主体和客体相互作用的结果，发展心理学→概述，（掌握）"},{"id":"4-12","ch":3,"no":12,"t":"m","g":null,"stem":"心理发展的连续性和阶段性的统一意味着 ( )","o":[["A","发展是量的积累 [["A","积极应对"],["B","消极应对"],["C","问题解决"],["D","求助"],["E","退避"]],"ans":"A,B","k":[0,1],"exp":"SCSQ将应对方式分为积极应对和消极应对两个维度。","src":"简易应对方式量表的记分，心理测验→社会支持与应对方式评估量表，（熟悉）"},{"id":"11-46","ch":10,"no":46,"t":"c","g":null,"stem":"评估家庭亲密度和适应性最常用的量表是 ( )","o":[["A","SCL-90"],["B","EPQ"],["C","FACES"],["D","EMBU"],["E","SSRS"],["F","ITS"]],"ans":"C","k":[2],"exp":"FACES即家庭亲密度和适应性评价量表。","src":"家庭亲密度和适应性评价量表的实施，心理测验→家庭与人际关系评估量表，（熟悉）"},{"id":"11-47","ch":10,"no":47,"t":"c","g":null,"stem":"FACES评估的家庭两个核心维度是 ( )","o":[["A","情感联系和规则适应"],["B","经济收入和权力分配"],["C","沟通方式和角色分工"],["D","行为控制和情感表达"],["E","家庭边界和代际传承"],["F","权威和服从"]],"ans":"A","k":[0],"exp":"FACES评估的是亲密度（情感联系）和适应性（对规则和变化的适应能力）。","src":"家庭亲密度和适应性评价量表的理论基础，心理测验→家庭与人际关系评估量表，（了解）"},{"id":"11-48","ch":10,"no":48,"t":"c","g":null,"stem":"评估父母教养方式最适宜的量表是 ( )","o":[["A","FACES"],["B","EMBU"],["C","ITS"],["D","SCSQ"],["E","SSRS"],["F","16PF"]],"ans":"B","k":[1],"exp":"EMBU即父母教养方式评价量表。","src":"父母教养方式评价量表的实施，心理测验一家庭与人际关系评估量表，（熟悉）"},{"id":"11-49","ch":10,"no":49,"t":"c","g":null,"stem":"关于父母教养方式评价量表（EMBU)，正确的说法是 ( )","o":[["A","仅适用于儿童"],["B","仅评估父亲的教养方式"],["C","包含父亲和母亲两个分量表"],["D","不涉及情感温暖维度"],["E","只有惩罚维度"],["F","由父母本人填写"]],"ans":"C","k":[2],"exp":"EMBU包含父亲和母亲两个分量表，由子女根据自己的感受来评价父母的教养方式。","src":"父母教养方式评价量表的记分，心理测验→家庭与人际关系评估量表，（熟悉）"},{"id":"11-50","ch":10,"no":50,"t":"c","g":null,"stem":"评估来访者的人际信任水平，应选择 ( )","o":[["A","FACES"],["B","EMBU"],["C","ITS"],["D","SSRS"],["E","EPQ"],["F","PHQ-9"]],"ans":"C","k":[2],"exp":"ITS即人际信任量表。","src":"人际信任量表的实施，心理测验→家庭与人际关系评估量表，（熟悉）"}]}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const CH=D.chapters, QS=D.qs, BY={};
QS.forEach(q=>BY[q.id]=q);
const TYPES={
  s:{n:'单句型单选题',short:'单句单选'},
  c:{n:'案例摘要型单选题',short:'案例摘要单选'},
  m:{n:'多选题',short:'多选'},
  k:{n:'案例分析题（不定项）',short:'案例分析'}
};
const ORDER=['s','c','m','k'];
const EXAM={
  1:{s:'考试：50题 × 1分 = 50分',c:'考试：25题 × 1分 = 25分',m:'考试：15题，答对1.5分，漏选0.5分，错选/多选/不选0分',k:'考试：5小题，答对2分，漏选1分，错选/多选/不选0分'},
  2:{c:'考试：50题 × 1分 = 50分',m:'考试：30题，答对1.5分，漏选0.5分，错选/多选/不选0分',k:'考试：10小题，答对2分，漏选1分，错选/多选/不选0分'}
};
const L='ABCDEFGH';

/* ---------- state ---------- */
// a: qid -> {s:[idx], r:'ok'|'part'|'bad'|null, t}
// w: qid -> {n, on, t, last:[idx]}
let S={a:{},w:{}};
let UI={mode:'prac',ch:0,t:null,wch:'all',wt:'all'};
const LS='xlzx-c1-v1', LSUI='xlzx-c1-ui';
try{const x=JSON.parse(localStorage.getItem(LS)||'null'); if(x&&x.a) S=x;}catch(e){}
try{const u=JSON.parse(localStorage.getItem(LSUI)||'null'); if(u) Object.assign(UI,u);}catch(e){}
const retry={}; // wrong-book session attempts: qid -> {s:[], r}
const draft={}; // pending multi selections: key -> Set

let dbRef=null, writing=false, pending=false, timer=null, syncNote='';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function saveUI(){try{localStorage.setItem(LSUI,JSON.stringify(UI));}catch(e){}}
function persist(){
  saveLocal();
  if(!dbRef) return;
  clearTimeout(timer); timer=setTimeout(flush,1200);
}
async function flush(){
  if(!dbRef) return;
  if(writing){pending=true;return;}
  writing=true;
  try{await dbRef.set({a:S.a,w:S.w,v:1}); syncNote='已同步到云端';}
  catch(e){syncNote='云端同步暂不可用，记录保存在本机浏览器';}
  writing=false; renderStats();
  if(pending){pending=false;flush();}
}
function mergeRemote(r){
  let changed=false, localNewer=false;
  ['a','w'].forEach(k=>{
    const R=(r&&r[k])||{}, Lc=S[k];
    for(const id in R){ if(!Lc[id]||(R[id].t||0)>(Lc[id].t||0)){Lc[id]=R[id];changed=true;} }
    for(const id in Lc){ if(!R[id]||(Lc[id].t||0)>(R[id].t||0)) localNewer=true; }
  });
  if(changed){saveLocal();render();}
  if(localNewer) persist();
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db) return;
    const uid=await user.id(); if(!uid) return;
    dbRef=db.doc('data/users/'+uid+'/progress');
    dbRef.onSnapshot(s=>{
      if(s.metadata&&s.metadata.hasPendingWrites) return;
      if(s.exists) mergeRemote(s.data()); else if(Object.keys(S.a).length||Object.keys(S.w).length) persist();
      syncNote='已同步到云端'; renderStats();
    },()=>{dbRef=null;syncNote='云端同步暂不可用，记录保存在本机浏览器';renderStats();});
  }catch(e){}
})();

/* ---------- helpers ---------- */
const el=(tag,cls,txt)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;};
const isMultiInput=q=>q.t==='m'||q.t==='k';
function judge(q,sel){
  const k=new Set(q.k), s=new Set(sel);
  if(!s.size) return 'bad';
  for(const i of s) if(!k.has(i)) return 'bad';
  if(s.size===k.size) return 'ok';
  return q.t==='s'||q.t==='c'?'bad':'part';
}
const VERD={ok:'回答正确',part:'漏选',bad:'回答错误'};
function letters(q,idxs){return idxs.map(i=>q.o[i]?q.o[i][0]:L[i]).join('');}
function chapQs(ci,t){return QS.filter(q=>q.ch===ci&&(!t||q.t===t));}
function typesIn(ci){return ORDER.filter(t=>QS.some(q=>q.ch===ci&&q.t===t));}
function wrongOn(){return QS.filter(q=>S.w[q.id]&&S.w[q.id].on);}
function done(id){return S.a[id]&&S.a[id].r;}

function record(q,sel,inWrong){
  const r=judge(q,sel), t=Date.now();
  if(inWrong){ retry[q.id]={s:sel,r}; }
  else { S.a[q.id]={s:sel,r,t}; }
  const w=S.w[q.id];
  if(r!=='ok'){ S.w[q.id]={n:((w&&w.n)||0)+1,on:true,t,last:sel}; }
  else if(w&&w.on&&!inWrong){ /* answered right in practice: keep in wrong book until removed */ }
  persist();
}

/* ---------- question card ---------- */
function card(q,ctx){
  const inWrong=ctx==='wrong';
  const st=inWrong?retry[q.id]:(S.a[q.id]&&S.a[q.id].r?S.a[q.id]:null);
  const box=el('article','q'); box.id='q-'+q.id;
  const h=el('div','qh');
  h.append(el('span','no','第'+q.no+'题'));
  h.append(el('span','chip',TYPES[q.t].short));
  if(inWrong){ h.append(el('span','chip',CH[q.ch].n)); h.append(el('span','chip bad','错 '+S.w[q.id].n+' 次')); }
  if(st) h.append(el('span','chip '+st.r,VERD[st.r]));
  box.append(h);
  box.append(el('p','stem',q.stem));
  const multi=isMultiInput(q);
  const dk=(inWrong?'w:':'p:')+q.id;
  const cur=draft[dk]||(draft[dk]=new Set());
  const opts=el('div','opts'); opts.setAttribute('role',multi?'group':'radiogroup');
  const kset=new Set(q.k);
  q.o.forEach((o,i)=>{
    const b=el('button','opt'+(multi?' multi':'')); b.type='button';
    b.append(el('span','l',o[0])); b.append(el('span','tx',o[1]));
    if(st){
      b.disabled=true;
      const picked=st.s.includes(i);
      if(kset.has(i)) b.classList.add(picked?'right':'missed');
      else if(picked) b.classList.add('wrong');
    }else{
      if(cur.has(i)) b.classList.add('sel');
      b.setAttribute('aria-pressed',cur.has(i)?'true':'false');
      b.onclick=()=>{
        if(!multi){ record(q,[i],inWrong); delete draft[dk]; rerender(box,q,ctx); return; }
        cur.has(i)?cur.delete(i):cur.add(i);
        b.classList.toggle('sel',cur.has(i)); b.setAttribute('aria-pressed',cur.has(i)?'true':'false');
        sub.disabled=!cur.size;
      };
    }
    opts.append(b);
  });
  box.append(opts);
  let sub;
  if(!st&&multi){
    const a=el('div','act');
    sub=el('button','btn','提交答案'); sub.type='button'; sub.disabled=!cur.size;
    sub.onclick=()=>{ if(!cur.size) return; record(q,[...cur].sort((x,y)=>x-y),inWrong); delete draft[dk]; rerender(box,q,ctx); };
    a.append(sub); a.append(el('span','hint',q.t==='k'?'不定项：正确答案可能是一个或多个，选好后提交':'选择所有正确选项后提交'));
    box.append(a);
  }
  if(st){
    const fb=el('div','fb');
    const v=el('div','verdict '+st.r); v.append(document.createTextNode(VERD[st.r]));
    v.append(el('span','', '你的答案：'+(letters(q,st.s)||'—')));
    v.append(el('span','', '正确答案：'+q.ans));
    fb.append(v);
    const ex=el('div','exp'); ex.append(el('b','','解析')); ex.append(document.createTextNode(q.exp)); fb.append(ex);
    if(q.src){const s=el('div','srcl'); s.append(el('b','','出处')); s.append(document.createTextNode(q.src)); fb.append(s);}
    const a=el('div','act');
    const again=el('button','btn ghost','重做本题'); again.type='button';
    again.onclick=()=>{ if(inWrong) delete retry[q.id]; else {S.a[q.id]={s:[],r:null,t:Date.now()}; persist();} rerender(box,q,ctx); };
    a.append(again);
    const w=S.w[q.id];
    if(w&&w.on&&st.r==='ok'){
      const rm=el('button','btn','移出错题集'); rm.type='button';
      rm.onclick=()=>{ S.w[q.id]={...w,on:false,t:Date.now()}; delete retry[q.id]; persist(); render(); };
      a.append(rm);
    }else if(w&&w.on&&!inWrong){ a.append(el('span','hint','已加入错题集')); }
    fb.append(a);
    box.append(fb);
  }
  return box;
}
function rerender(box,q,ctx){ const n=card(q,ctx); box.replaceWith(n); renderStats(); renderRail(); updateTabs(); }

/* ---------- views ---------- */
function renderStats(){
  const total=QS.length; let n=0,ok=0;
  for(const id in S.a){const a=S.a[id]; if(a&&a.r){n++; if(a.r==='ok') ok++;}}
  const w=wrongOn().length;
  const st=document.getElementById('stats'); st.textContent='';
  const add=(v,l,c)=>{const d=el('div','stat'+(c?' '+c:'')); d.append(el('b','',v)); d.append(el('span','',l)); st.append(d);};
  add(n+' / '+total,'已作答');
  add(n?Math.round(ok/n*100)+'%':'—','正确率');
  add(String(w),'错题','w');
  if(syncNote){const s=el('div','sync',syncNote); s.style.alignSelf='flex-end'; st.append(s);}
  document.getElementById('wcnt').textContent=w?String(w):'';
}
function renderRail(){
  const r=document.getElementById('rail'); r.textContent='';
  const sel=document.getElementById('mselect'); sel.textContent='';
  let part=0;
  CH.forEach((c,i)=>{
    if(c.part!==part){part=c.part; r.append(el('h3','',part===1?'第一部分 基础知识':'第二部分 操作技能'));
      const og=document.createElement('optgroup'); og.label=part===1?'第一部分 基础知识':'第二部分 操作技能'; sel.append(og);}
    const qs=chapQs(i), d=qs.filter(q=>done(q.id)).length;
    const b=el('button','chap'); b.type='button';
    b.append(document.createTextNode(c.part===2?'操作技能（全部）':c.n));
    const sm=el('small'); sm.append(el('span','',d+'/'+qs.length));
    const wc=qs.filter(q=>S.w[q.id]&&S.w[q.id].on).length; sm.append(el('span','',wc?'错题 '+wc:''));
    b.append(sm);
    const bar=el('div','bar'), bi=el('i'); bi.style.width=(qs.length?d/qs.length*100:0)+'%'; bar.append(bi); b.append(bar);
    if(UI.mode==='prac'&&i===UI.ch) b.setAttribute('aria-current','true');
    b.onclick=()=>{UI.mode='prac';UI.ch=i;UI.t=null;saveUI();render();window.scrollTo({top:0});};
    r.append(b);
    const o=document.createElement('option'); o.value=i; o.textContent=(c.part===2?'操作技能（全部）':c.n)+'  '+d+'/'+qs.length; if(i===UI.ch) o.selected=true;
    sel.lastChild.append(o);
  });
  sel.onchange=()=>{UI.mode='prac';UI.ch=+sel.value;UI.t=null;saveUI();render();};
  sel.hidden=UI.mode!=='prac';
}
let tabEls={};
function updateTabs(){
  for(const t in tabEls){const q=chapQs(UI.ch,t); tabEls[t].querySelector('.n').textContent=q.filter(x=>done(x.id)).length+'/'+q.length;}
}
function practice(v){
  const c=CH[UI.ch], ts=typesIn(UI.ch);
  if(!UI.t||!ts.includes(UI.t)) UI.t=ts[0];
  const hd=el('div','chead');
  hd.append(el('h2','',c.n));
  hd.append(el('span','hint',(c.part===1?'第一部分 基础知识':'第二部分 操作技能')+' · 共 '+chapQs(UI.ch).length+' 题'));
  v.append(hd);
  const tabs=el('div','tabs'); tabs.setAttribute('role','tablist'); tabEls={};
  ts.forEach(t=>{
    const b=el('button','tab',TYPES[t].n); b.type='button'; b.setAttribute('role','tab');
    b.setAttribute('aria-selected',t===UI.t?'true':'false'); b.append(el('span','n',''));
    b.onclick=()=>{UI.t=t;saveUI();render();};
    tabs.append(b); tabEls[t]=b;
  });
  v.append(tabs); updateTabs();
  const ex=EXAM[c.part][UI.t];
  const rule=el('div','rule', ex||'');
  if(UI.t==='k') rule.textContent+='。原资料未附案例背景材料，以下题干按原文呈现，同一案例的小题放在一起。';
  if(UI.t==='c'&&c.part===1) rule.textContent+='。本类为题干中给出具体情境/人物的单选题。';
  v.append(rule);
  const qs=chapQs(UI.ch,UI.t);
  // tools
  const tl=el('div','tools');
  const d=qs.filter(q=>done(q.id)).length, ok=qs.filter(q=>S.a[q.id]&&S.a[q.id].r==='ok').length;
  tl.append(el('span','', '本题型已做 '+d+'/'+qs.length+(d?'，答对 '+ok:'')));
  if(d){
    const rs=el('button','lnk','清空本题型作答记录'); rs.type='button';
    rs.onclick=()=>{
      const cf=el('span','confirm'); cf.append(document.createTextNode('清空后可重新作答，错题集不受影响。'));
      const y=el('button','btn','确认清空'); y.type='button'; y.onclick=()=>{const t=Date.now(); qs.forEach(q=>{if(done(q.id)) S.a[q.id]={s:[],r:null,t};}); persist(); render();};
      const n=el('button','lnk','取消'); n.type='button'; n.onclick=()=>render();
      cf.append(y,n); rs.replaceWith(cf);
    };
    tl.append(rs);
    const nx=qs.find(q=>!done(q.id));
    if(nx){const j=el('button','lnk','跳到第一道未做题'); j.type='button'; j.onclick=()=>{const t=document.getElementById('q-'+nx.id); if(t) t.scrollIntoView({behavior:'smooth',block:'center'});}; tl.append(j);}
  }
  v.append(tl);
  const list=el('div','list');
  if(UI.t==='k'){
    const groups=[]; qs.forEach(q=>{let g=groups.find(x=>x.g===q.g); if(!g){g={g:q.g,qs:[]};groups.push(g);} g.qs.push(q);});
    groups.forEach((g,gi)=>{
      const box=el('section','case');
      const h=el('div','case-h'); h.append(el('b','','案例 '+(gi+1))); h.append(document.createTextNode('第'+g.qs[0].no+'–'+g.qs[g.qs.length-1].no+'题'));
      box.append(h); g.qs.forEach(q=>box.append(card(q,'prac'))); list.append(box);
    });
  } else qs.forEach(q=>list.append(card(q,'prac')));
  v.append(list);
}
function wrongView(v){
  const all=wrongOn();
  const hd=el('div','chead'); hd.append(el('h2','','错题集')); hd.append(el('span','hint','共 '+all.length+' 题 · 答错或漏选的题会自动收进来'));
  v.append(hd);
  if(!all.length){ v.append(el('div','empty','暂无错题。在章节练习中答错或漏选的题目会自动出现在这里。')); return; }
  const f=el('div','wfilter');
  const s1=document.createElement('select'); s1.id='wf-ch'; s1.setAttribute('aria-label','按章节筛选');
  const o0=document.createElement('option'); o0.value='all'; o0.textContent='全部章节'; s1.append(o0);
  CH.forEach((c,i)=>{const n=all.filter(q=>q.ch===i).length; if(!n) return; const o=document.createElement('option'); o.value=String(i); o.textContent=c.n+'（'+n+'）'; s1.append(o);});
  s1.value=UI.wch; if(s1.value!==String(UI.wch)) {UI.wch='all'; s1.value='all';}
  const s2=document.createElement('select'); s2.id='wf-t'; s2.setAttribute('aria-label','按题型筛选');
  const p0=document.createElement('option'); p0.value='all'; p0.textContent='全部题型'; s2.append(p0);
  ORDER.forEach(t=>{const n=all.filter(q=>q.t===t).length; if(!n) return; const o=document.createElement('option'); o.value=t; o.textContent=TYPES[t].n+'（'+n+'）'; s2.append(o);});
  s2.value=UI.wt; if(s2.value!==UI.wt){UI.wt='all'; s2.value='all';}
  s1.onchange=()=>{UI.wch=s1.value;saveUI();render();}; s2.onchange=()=>{UI.wt=s2.value;saveUI();render();};
  f.append(s1,s2); v.append(f);
  v.append(el('div','rule','错题集里的题重新作答不影响章节练习记录；重做答对后可点「移出错题集」。'));
  const qs=all.filter(q=>(UI.wch==='all'||q.ch===+UI.wch)&&(UI.wt==='all'||q.t===UI.wt));
  let lastCh=-1,lastT=null,list=null;
  qs.forEach(q=>{
    if(q.ch!==lastCh||q.t!==lastT){
      const g=el('div','wgroup'); g.append(el('h4','',CH[q.ch].n+' · '+TYPES[q.t].n)); list=el('div','list'); g.append(list); v.append(g); lastCh=q.ch; lastT=q.t;
    }
    list.append(card(q,'wrong'));
  });
}
function render(){
  document.getElementById('m-prac').setAttribute('aria-selected',UI.mode==='prac'?'true':'false');
  document.getElementById('m-wrong').setAttribute('aria-selected',UI.mode==='wrong'?'true':'false');
  renderStats(); renderRail();
  const v=document.getElementById('view'); v.textContent='';
  if(UI.ch>=CH.length) UI.ch=0;
  UI.mode==='wrong'?wrongView(v):practice(v);
}
document.getElementById('m-prac').onclick=()=>{UI.mode='prac';saveUI();render();};
document.getElementById('m-wrong').onclick=()=>{UI.mode='wrong';saveUI();render();window.scrollTo({top:0});};
render();
})();
</script>
</body></html>
